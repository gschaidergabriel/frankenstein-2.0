name: Review WP600 Route Candidate Identity Falsifier

on:
  push:
    branches:
      - review/wp600-route-candidate-identity-falsifier-20260829
    paths:
      - 'src/frankenstein2/direct_delegate_router.py'
      - 'src/frankenstein2/situation_frame.py'
      - 'tests/falsifiers/test_wp600_route_candidate_identity_falsifier.py'
      - '.github/workflows/review-wp600-route-candidate-identity-falsifier.yml'
  pull_request:
    paths:
      - 'src/frankenstein2/direct_delegate_router.py'
      - 'src/frankenstein2/situation_frame.py'
      - 'tests/falsifiers/test_wp600_route_candidate_identity_falsifier.py'
      - '.github/workflows/review-wp600-route-candidate-identity-falsifier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  falsifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile
        run: >-
          python -m py_compile
          src/frankenstein2/direct_delegate_router.py
          src/frankenstein2/situation_frame.py
          tests/falsifiers/test_wp600_route_candidate_identity_falsifier.py
      - name: Execute route-candidate identity falsifier
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/falsifiers/test_wp600_route_candidate_identity_falsifier.py
