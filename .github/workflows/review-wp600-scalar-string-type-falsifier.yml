name: REVIEW ONLY WP600 Scalar String Type Falsifier

on:
  pull_request:
    paths:
      - 'tests/test_wp600_scalar_string_type_falsifier.py'
      - '.github/workflows/review-wp600-scalar-string-type-falsifier.yml'
      - 'src/frankenstein2/direct_delegate_router.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-falsifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile exact review surface
        run: >-
          python -m py_compile
          src/frankenstein2/direct_delegate_router.py
          tests/test_direct_delegate_router.py
          tests/test_wp600_scalar_string_type_falsifier.py
      - name: Execute candidate falsifier
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_wp600_scalar_string_type_falsifier.py
