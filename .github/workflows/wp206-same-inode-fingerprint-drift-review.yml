name: REVIEW ONLY WP206 same-inode fingerprint drift

on:
  pull_request:
    paths:
      - 'tests/test_wp206_same_inode_fingerprint_drift_characterization.py'
      - '.github/workflows/wp206-same-inode-fingerprint-drift-review.yml'
      - 'src/state/unifieddb_identity.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  characterize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Compile characterization
        run: python -m py_compile tests/test_wp206_same_inode_fingerprint_drift_characterization.py
      - name: Run isolated discriminator
        env:
          PYTHONPATH: src
        run: python -m unittest -v tests.test_wp206_same_inode_fingerprint_drift_characterization
