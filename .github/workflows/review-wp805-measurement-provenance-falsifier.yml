name: Review WP805 Measurement Provenance Falsifier

on:
  pull_request:
    paths:
      - 'src/frankenstein2/cognitive_transfer_recovery_benchmark.py'
      - 'tests/test_wp805_measurement_provenance_falsifier.py'
      - '.github/workflows/review-wp805-measurement-provenance-falsifier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  falsifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile exact review surface
        run: >-
          python -m py_compile
          src/frankenstein2/cognitive_microworld.py
          src/frankenstein2/cognitive_transfer_recovery_benchmark.py
          tests/test_wp805_measurement_provenance_falsifier.py
      - name: Reproduce measurement provenance gap
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_wp805_measurement_provenance_falsifier.py' -v
