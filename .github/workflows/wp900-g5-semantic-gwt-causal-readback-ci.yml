name: WP900 G5 Semantic GWT Causal Readback CI

on:
  pull_request:
    paths:
      - 'src/frankenstein2/gwt_semantic_causal_readback.py'
      - 'src/frankenstein2/gwt_causal_runtime_readback.py'
      - 'src/frankenstein2/gwt_runtime_witness.py'
      - 'src/frankenstein2/gwt_uptake.py'
      - 'src/frankenstein2/gwt_reentry_uptake_binding.py'
      - 'tests/test_gwt_semantic_causal_readback.py'
      - 'tests/test_gwt_causal_runtime_readback.py'
      - 'tests/test_gwt_causal_runtime_readback_context_gate.py'
      - '.github/workflows/wp900-g5-semantic-gwt-causal-readback-ci.yml'
      - 'workpackages/active/F2-WP-900.json'
      - 'workpackages/deltas/F2-WP-900/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install repository-test dependency
        run: python -m pip install --disable-pip-version-check pytest

      # Repository-CI only. This job executes no model/provider and mints no
      # semantic GWT/J-Space/runtime/effect/training/product credit.
      - name: Compile G5 semantic gate and accepted G4 dependencies
        run: |
          python -m py_compile \
            src/frankenstein2/gwt_semantic_causal_readback.py \
            src/frankenstein2/gwt_causal_runtime_readback.py \
            src/frankenstein2/gwt_runtime_witness.py \
            src/frankenstein2/gwt_uptake.py \
            src/frankenstein2/gwt_reentry_uptake_binding.py

      - name: Run G5 semantic gate and G4 dependency regressions
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q \
            tests/test_gwt_semantic_causal_readback.py \
            tests/test_gwt_causal_runtime_readback.py \
            tests/test_gwt_causal_runtime_readback_context_gate.py \
            tests/test_gwt_runtime_witness.py \
            tests/test_gwt_uptake.py \
            tests/test_gwt_reentry_uptake_binding.py
