name: Architect Worker Coordination CI

on:
  pull_request:
    paths:
      - 'workpackages/ARCHITECT_WORKER_COORDINATION_PROTOCOL.md'
      - 'tools/coordination/architect_packet.py'
      - 'tests/test_architect_worker_packet.py'
      - '.github/workflows/architect-worker-coordination-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packet-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run architect packet adversarial tests
        run: python3 -m unittest tests.test_architect_worker_packet -v
      - name: Compile helper
        run: python3 -m py_compile tools/coordination/architect_packet.py
