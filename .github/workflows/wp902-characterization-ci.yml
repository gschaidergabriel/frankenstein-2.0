name: WP902 whole-system characterization ABI CI

on:
  pull_request:
    paths:
      - 'src/frankenstein2/whole_system_characterization.py'
      - 'tests/test_whole_system_characterization.py'
      - '.github/workflows/wp902-characterization-ci.yml'
      - 'workpackages/active/F2-WP-902.json'
  push:
    branches:
      - main
    paths:
      - 'src/frankenstein2/whole_system_characterization.py'
      - 'tests/test_whole_system_characterization.py'
      - '.github/workflows/wp902-characterization-ci.yml'
      - 'workpackages/active/F2-WP-902.json'
      - 'workpackages/reconciliations/F2-WP-902/**'
      - 'workpackages/receipts/F2-WP-902*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  characterization-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact workflow ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Compile WP902 source and regressions
        run: >-
          python -m py_compile
          src/frankenstein2/whole_system_characterization.py
          tests/test_whole_system_characterization.py
      - name: Run WP902 fail-closed suite
        env:
          PYTHONPATH: src
        run: python -m unittest -v tests.test_whole_system_characterization
