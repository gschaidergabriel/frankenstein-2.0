name: F2 WP700 Retina Pipeline CI

on:
  push:
    branches:
      - main
      - trigger4/f2-wp700-retina-pipeline-20260829
    paths:
      - 'src/frankenstein2/retina_pipeline.py'
      - 'tests/test_retina_pipeline.py'
      - '.github/workflows/wp700-retina-pipeline-ci.yml'
  pull_request:
    paths:
      - 'src/frankenstein2/retina_pipeline.py'
      - 'tests/test_retina_pipeline.py'
      - '.github/workflows/wp700-retina-pipeline-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile
        run: python -m py_compile src/frankenstein2/retina_pipeline.py tests/test_retina_pipeline.py
      - name: Retina boundary falsification suite
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_retina_pipeline.py
