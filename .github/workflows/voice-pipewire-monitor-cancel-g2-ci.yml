name: Voice PipeWire Monitor Cancel G2 CI

on:
  push:
    paths:
      - "research/local_voice/tools/t4_voice_virtual_sink_cancel_readback.py"
      - "tests/test_t4_voice_virtual_sink_cancel_readback.py"
      - ".github/workflows/voice-pipewire-monitor-cancel-g2-ci.yml"
  pull_request:
    paths:
      - "research/local_voice/tools/t4_voice_virtual_sink_cancel_readback.py"
      - "tests/test_t4_voice_virtual_sink_cancel_readback.py"
      - ".github/workflows/voice-pipewire-monitor-cancel-g2-ci.yml"

permissions:
  contents: read

jobs:
  repository-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run cancellation regression suite
        run: python tests/test_t4_voice_virtual_sink_cancel_readback.py
      - name: Emit bounded repository reference receipt
        run: python research/local_voice/tools/t4_voice_virtual_sink_cancel_readback.py --backend software --out /tmp/pipewire-monitor-cancel-g2-reference.json
