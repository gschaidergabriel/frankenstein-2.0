name: REVIEW ONLY WP1107 G2 trailing-data falsifier

on:
  pull_request:
    paths:
      - 'src/frankenstein2/release_integrity.py'
      - 'src/frankenstein2/release_archive.py'
      - 'tests/test_wp1107_trailing_data_review.py'
      - '.github/workflows/review-wp1107-trailing-data-falsifier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trailing-data-falsifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile review surface
        run: >-
          python -m py_compile
          src/frankenstein2/release_integrity.py
          src/frankenstein2/release_archive.py
          tests/test_wp1107_trailing_data_review.py
      - name: Run REVIEW_ONLY trailing-data falsifier
        env:
          PYTHONPATH: src
        run: python tests/test_wp1107_trailing_data_review.py -v
