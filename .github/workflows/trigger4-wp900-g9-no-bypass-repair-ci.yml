name: Trigger4 WP900 G9 No-Bypass Repair

on:
  push:
    branches: [main]
    paths:
      - 'src/frankenstein2/gwt_semantic_reentry_only_execution.py'
      - 'tests/test_wp900_g9_reentry_only_execution.py'
      - '.github/workflows/trigger4-wp900-g9-no-bypass-repair-ci.yml'
      - 'workpackages/active/F2-WP-900.json'
  pull_request:
    paths:
      - 'src/frankenstein2/gwt_semantic_reentry_only_execution.py'
      - 'tests/test_wp900_g9_reentry_only_execution.py'
      - '.github/workflows/trigger4-wp900-g9-no-bypass-repair-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trigger4-wp900-g9-no-bypass-${{ github.ref }}
  cancel-in-progress: true

jobs:
  g9-no-bypass-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: '1'
      EXPECTED_SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact repair source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prove exact source and clean tracked tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}

      - name: Compile and import no-bypass repair
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile src/frankenstein2/gwt_semantic_reentry_only_execution.py
          python - <<'PY'
          import frankenstein2.gwt_semantic_reentry_only_execution as repair
          assert repair.behavioral_input_keys().isdisjoint(repair.FORBIDDEN_BEHAVIORAL_INPUT_KEYS)
          print(repair.ReentryOnlyExecutorPlan.worker_source_sha256)
          PY

      - name: Execute accepted G9 base plus no-bypass repair regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q \
            tests/test_wp900_g9_semantic_content_causality.py \
            tests/test_wp900_g9_reentry_only_execution.py

      - name: Preserve bounded credit fence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from frankenstein2.gwt_semantic_reentry_only_execution import (
              NoBypassSemanticCrossoverCandidate,
              ReentryOnlyExecutionReceipt,
          )
          for cls in (NoBypassSemanticCrossoverCandidate, ReentryOnlyExecutionReceipt):
              assert cls.repository_ci_credit == 0
              assert cls.target_environment_component_runtime_credit == 0
              assert cls.semantic_content_causal_candidate_credit == 0
              assert cls.semantic_gwt_runtime_credit == 0
              assert cls.jspace_runtime_credit == 0
              assert cls.whole_system_acceptance is False
          PY
