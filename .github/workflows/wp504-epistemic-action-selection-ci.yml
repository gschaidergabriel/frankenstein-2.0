name: F2 WP504 Epistemic Action Selection CI

on:
  push:
    branches:
      - main
      - trigger4/wp504-epistemic-action-selection-g1-gpt56sol-20260829
    paths:
      - 'src/frankenstein2/epistemic_action_selection.py'
      - 'tests/test_epistemic_action_selection.py'
      - '.github/workflows/wp504-epistemic-action-selection-ci.yml'
  pull_request:
    paths:
      - 'src/frankenstein2/epistemic_action_selection.py'
      - 'tests/test_epistemic_action_selection.py'
      - '.github/workflows/wp504-epistemic-action-selection-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile src/frankenstein2/epistemic_action_selection.py tests/test_epistemic_action_selection.py
      - name: Epistemic action selection falsification suite
        env:
          PYTHONPATH: src
        run: python tests/test_epistemic_action_selection.py -v
