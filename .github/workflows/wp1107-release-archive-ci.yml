name: F2 WP1107 G2 Deterministic Release Archive CI

on:
  push:
    branches:
      - main
    paths:
      - 'src/frankenstein2/release_integrity.py'
      - 'src/frankenstein2/release_archive.py'
      - 'tests/test_release_archive.py'
      - 'tests/test_release_archive_metadata_perimeter.py'
      - '.github/workflows/wp1107-release-archive-ci.yml'
      - 'workpackages/active/F2-WP-1107.json'
      - 'workpackages/state_events/F2-WP-1107/**'
      - 'workpackages/deltas/F2-WP-1107/**'
      - 'workpackages/reconciliations/F2-WP-1107/**'
  pull_request:
    paths:
      - 'src/frankenstein2/release_integrity.py'
      - 'src/frankenstein2/release_archive.py'
      - 'tests/test_release_archive.py'
      - 'tests/test_release_archive_metadata_perimeter.py'
      - '.github/workflows/wp1107-release-archive-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-release-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile exact WP1107 G2 surfaces
        run: >-
          python -m py_compile
          src/frankenstein2/release_integrity.py
          src/frankenstein2/release_archive.py
          tests/test_release_archive.py
          tests/test_release_archive_metadata_perimeter.py
      - name: Run deterministic archive variance and negative-control suite
        env:
          PYTHONPATH: src
        run: python tests/test_release_archive.py -v
      - name: Run ZIP metadata perimeter falsifiers
        env:
          PYTHONPATH: src
        run: python tests/test_release_archive_metadata_perimeter.py -v
      - name: Validate migrated workpackage state chain
        run: python tools/resolve_workpackage_state_v2.py --check-active
