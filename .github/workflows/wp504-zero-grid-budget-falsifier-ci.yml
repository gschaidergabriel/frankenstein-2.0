name: F2 WP504 Zero GRID Budget Falsifier

on:
  pull_request:
    paths:
      - 'src/frankenstein2/epistemic_action_selection.py'
      - 'src/frankenstein2/hyperposition.py'
      - 'src/frankenstein2/grid10_interface.py'
      - 'tests/test_wp504_zero_grid_budget_falsifier.py'
      - '.github/workflows/wp504-zero-grid-budget-falsifier-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  falsifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile exact WP504 and upstream ABI surface
        run: >-
          python -m py_compile
          src/frankenstein2/hyperposition.py
          src/frankenstein2/grid10_interface.py
          src/frankenstein2/epistemic_action_selection.py
          tests/test_wp504_zero_grid_budget_falsifier.py
      - name: Execute zero GRID budget falsifier
        env:
          PYTHONPATH: src
        run: python tests/test_wp504_zero_grid_budget_falsifier.py -v
