name: F2 WP1207 Portable Release Transaction CI

on:
  push:
    branches:
      - main
    paths:
      - 'src/frankenstein2/portable_release_transaction.py'
      - 'tests/test_portable_release_transaction.py'
      - '.github/workflows/wp1207-portable-release-transaction-ci.yml'
      - 'workpackages/active/F2-WP-1207.json'
      - 'workpackages/deltas/F2-WP-1207/**'
  pull_request:
    paths:
      - 'src/frankenstein2/portable_release_transaction.py'
      - 'tests/test_portable_release_transaction.py'
      - '.github/workflows/wp1207-portable-release-transaction-ci.yml'
      - 'workpackages/active/F2-WP-1207.json'
      - 'workpackages/deltas/F2-WP-1207/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-hostile-twin-transaction-core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile exact WP1207 surface
        run: python -m py_compile src/frankenstein2/portable_release_transaction.py tests/test_portable_release_transaction.py
      - name: Run fail-closed WP1207 transaction suite
        env:
          PYTHONPATH: src
        run: python tests/test_portable_release_transaction.py -v
