name: REVIEW WP803 G2 Generation/Coforge Falsifier

on:
  push:
    branches:
      - review/wp803-g2-posthoc-coforge-falsifier-20260829
    paths:
      - 'src/frankenstein2/cognitive_world_model_prediction_benchmark.py'
      - 'src/frankenstein2/cognitive_microworld.py'
      - 'tests/review/test_wp803_g2_generation_and_coforge_falsifier.py'
      - '.github/workflows/review-wp803-g2-generation-coforge-falsifier-ci.yml'
  pull_request:
    paths:
      - 'src/frankenstein2/cognitive_world_model_prediction_benchmark.py'
      - 'src/frankenstein2/cognitive_microworld.py'
      - 'tests/review/test_wp803_g2_generation_and_coforge_falsifier.py'
      - '.github/workflows/review-wp803-g2-generation-coforge-falsifier-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  negative-control:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile exact G2 source and review witness
        run: >-
          python -m py_compile
          src/frankenstein2/cognitive_microworld.py
          src/frankenstein2/cognitive_world_model_prediction_benchmark.py
          tests/review/test_wp803_g2_generation_and_coforge_falsifier.py
      - name: Reproduce generation self-attestation and co-forge controls
        env:
          PYTHONPATH: src
        run: >-
          python -m unittest discover
          -s tests/review
          -p 'test_wp803_g2_generation_and_coforge_falsifier.py'
          -v
