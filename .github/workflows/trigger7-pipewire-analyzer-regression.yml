name: Trigger7 PipeWire Analyzer Regression

on:
  push:
    paths:
      - "research/local_voice/tools/t7_pipewire_monitor_cancel_analyze.py"
      - "tests/test_t7_pipewire_monitor_cancel_analyze.py"
      - ".github/workflows/trigger7-pipewire-analyzer-regression.yml"
  pull_request:
    paths:
      - "research/local_voice/tools/t7_pipewire_monitor_cancel_analyze.py"
      - "tests/test_t7_pipewire_monitor_cancel_analyze.py"
      - ".github/workflows/trigger7-pipewire-analyzer-regression.yml"

permissions:
  contents: read

jobs:
  synthetic-measurement-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analyzer-only dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Run Trigger7 analyzer regression suite
        run: python tests/test_t7_pipewire_monitor_cancel_analyze.py
