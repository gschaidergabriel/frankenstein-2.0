name: REVIEW WP901 G4 persisted parent column falsifier

on:
  pull_request:
    paths:
      - 'src/frankenstein2/restart_recovery_persisted_row_attestation.py'
      - 'src/frankenstein2/persistent_agency_kernel.py'
      - 'tests/test_restart_recovery_persisted_row_attestation.py'
      - 'tests/review_wp901_g4_persisted_parent_column_falsifier.py'
      - '.github/workflows/review-wp901-g4-persisted-parent-column-falsifier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce-persisted-parent-column-gap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact review ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Compile exact-current G4 and falsifier
        run: >-
          python -m py_compile
          src/frankenstein2/restart_recovery_persisted_row_attestation.py
          src/frankenstein2/persistent_agency_kernel.py
          tests/test_restart_recovery_persisted_row_attestation.py
          tests/review_wp901_g4_persisted_parent_column_falsifier.py
      - name: Run current G4 baseline plus parent-column counterexample
        env:
          PYTHONPATH: src:.
        run: >-
          python -m unittest -v
          tests.test_restart_recovery_persisted_row_attestation
          tests.review_wp901_g4_persisted_parent_column_falsifier.WP901G4PersistedParentColumnFalsifier.test_counterexample_reproduced
      - name: Review-only credit fence
        run: |
          echo 'classification=REVIEW_ONLY_EXECUTABLE_COUNTEREVIDENCE'
          echo 'canonical_mutation_authority=NONE'
          echo 'target_runtime_credit=0'
          echo 'whole_system_credit=0'
