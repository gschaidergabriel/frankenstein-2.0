name: F2 WP401 World Maintenance CI

on:
  push:
    branches:
      - main
      - trigger4/wp401-world-maintenance-g1-gpt56sol-20260829
    paths:
      - 'src/frankenstein2/world_maintenance.py'
      - 'src/frankenstein2/sparse_world_basis.py'
      - 'tests/test_world_maintenance.py'
      - '.github/workflows/wp401-world-maintenance-ci.yml'
  pull_request:
    paths:
      - 'src/frankenstein2/world_maintenance.py'
      - 'src/frankenstein2/sparse_world_basis.py'
      - 'tests/test_world_maintenance.py'
      - '.github/workflows/wp401-world-maintenance-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  falsification:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile exact WP401 source and tests
        run: python -m py_compile src/frankenstein2/world_maintenance.py tests/test_world_maintenance.py
      - name: World maintenance falsification suite
        env:
          PYTHONPATH: src
        run: python tests/test_world_maintenance.py -v
