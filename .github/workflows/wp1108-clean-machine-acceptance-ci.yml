name: F2 WP1108 Clean Machine Acceptance CI

on:
  push:
    branches:
      - main
    paths:
      - 'src/frankenstein2/clean_machine_acceptance.py'
      - 'tests/test_clean_machine_acceptance.py'
      - '.github/workflows/wp1108-clean-machine-acceptance-ci.yml'
  pull_request:
    paths:
      - 'src/frankenstein2/clean_machine_acceptance.py'
      - 'tests/test_clean_machine_acceptance.py'
      - '.github/workflows/wp1108-clean-machine-acceptance-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-clean-machine-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile src/frankenstein2/clean_machine_acceptance.py tests/test_clean_machine_acceptance.py
      - name: Clean-machine acceptance falsification suite
        env:
          PYTHONPATH: src
        run: python tests/test_clean_machine_acceptance.py -v
