name: Trigger4 FDX7 FDX8 S2 Restart Identity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger4-fdx78-s2-restart.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trigger4-fdx78-s2-restart-singleton
  cancel-in-progress: false

jobs:
  fdx78-s2-restart:
    runs-on: clay-host
    timeout-minutes: 35
    env:
      F2_SANDBOX_ROOT: /var/tmp/frankenstein2-sandboxes
      F2_NSPAWN_BASE_ROOT: /var/lib/frankenstein2-sandbox-images/ubuntu-24.04-base
      F2_SANDBOX_MIN_FREE_KIB: '5242880'
      F2_SANDBOX_MIN_MEM_KIB: '1048576'
    steps:
      - name: Checkout exact F2 subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Verify owner VPS and S2 authority
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${RUNNER_NAME:-}" = "vps-clay-host"
          test "${RUNNER_OS:-}" = "Linux"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash -n tools/vps_sandbox/preflight.sh
          bash -n tools/vps_sandbox/host_prepare_ubuntu_nspawn.sh
          bash -n tools/vps_sandbox/run_ubuntu_sandbox.sh
          bash tools/vps_sandbox/host_prepare_ubuntu_nspawn.sh
          bash tools/vps_sandbox/preflight.sh | tee /tmp/fdx78-preflight.log

      - name: Execute FDX7 and FDX8 across real process restarts in S2
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > .fdx78_harness.py <<'PY'
          from __future__ import annotations
          import argparse, base64, hashlib, json, os, pathlib, subprocess, sys
          from frankenstein2.causal_identity import CausalIdentity
          from frankenstein2.voice_contract import VoiceIntent, VoiceSessionCapsule
          from frankenstein2.voice_packet_cortex import VoiceInputPacket, VoicePacketCortex
          from frankenstein2.voice_packet_cortex_recovery import export_packet_cortex_checkpoint, resume_packet_cortex

          SCHEMA = "T4_FDX78_S2_PROCESS_FILESYSTEM_RESTART/v1"

          def canon(value):
              return json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(",", ":"), allow_nan=False)
          def digest_json(value):
              return hashlib.sha256(canon(value).encode()).hexdigest()
          def digest_file(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          def proc_identity():
              stat = pathlib.Path('/proc/self/stat').read_text().split()
              return {"pid": os.getpid(), "start_ticks": int(stat[21])}
          def write_json(path, value):
              path.write_text(json.dumps(value, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          def read_json(path):
              return json.loads(path.read_text(encoding="utf-8"))

          def make_session(label):
              root = CausalIdentity(
                  session_id=f"session-fdx78-{label}", agent_id="frankenstein-2",
                  task_id=f"task-fdx78-{label}", turn_id=f"turn-root-{label}",
                  causal_id=f"causal-root-fdx78-{label}", generation=1,
              )
              intent = VoiceIntent.create(
                  causal_identity=root, input_ref=f"fdx78:{label}:input",
                  input_sha256=("a" if label == "open" else "b") * 64,
                  provenance_refs=(f"trigger4:fdx78:{label}",),
              )
              return VoiceSessionCapsule.create(
                  intent=intent,
                  session_causal_identity=root.derive(
                      causal_id=f"causal-session-fdx78-{label}", generation=2,
                      turn_id=f"turn-session-{label}",
                  ),
                  provenance_refs=(f"trigger4:fdx78:{label}:session",),
              )

          def final_input(cortex, turn_id, packet_id, at):
              return VoiceInputPacket(
                  session_id=cortex.session_id, turn_id=turn_id, packet_id=packet_id,
                  monotonic_ms=at, source_modality="asr_final", text="Weiter bitte",
                  language="de-DE", is_final=True, confidence=0.95,
                  speech_start=True, speech_end=True, vad_state="SPEECH",
                  endpoint_decision="END", overlap_state="NONE", barge_in=False,
                  source_duration_ms=160, sequence=0, fault_flags=(),
              )

          def seed_open(root):
              session = make_session("open")
              cortex = VoicePacketCortex(session)
              turn = "turn-open"
              cortex.accept_input(final_input(cortex, turn, "input-open-0", 100))
              cortex.emit_intent(turn_id=turn, monotonic_ms=110, voice_intent="ANSWER")
              cortex.queue_output(
                  turn_id=turn, packet_id="output-open-0", monotonic_ms=120,
                  text_segment="Antwort vor Neustart", expression_intent="neutral",
                  speech_act="ANSWER", planned_audio_duration_ms=1000, sequence=0,
              )
              cortex.advance_output("output-open-0", playback_state="started", monotonic_ms=130, heard_fraction=0.0)
              cp = export_packet_cortex_checkpoint(cortex)
              cp_path = root / "fdx7_open_checkpoint.json"
              write_json(cp_path, cp)
              result = {
                  "pass": cortex.is_open,
                  "process": proc_identity(), "session_id": session.voice_session_id,
                  "session_sha256": session.sha256(), "turn_id": turn,
                  "checkpoint_payload_sha256": cp["payload_sha256"],
                  "checkpoint_file_sha256": digest_file(cp_path),
                  "event_count": len(cortex.events),
                  "answer_intent_count": sum(e.event_kind == "VOICE_INTENT" and e.voice_intent == "ANSWER" for e in cortex.events),
                  "output_ids": [p.packet_id for p in cortex.outputs],
                  "output_sequences": [p.sequence for p in cortex.outputs],
              }
              assert result["pass"] and result["answer_intent_count"] == 1
              write_json(root / "seed_open.json", result)

          def resume_open(root):
              session = make_session("open")
              cp_path = root / "fdx7_open_checkpoint.json"
              loaded_file_sha = digest_file(cp_path)
              cp = read_json(cp_path)
              seed = read_json(root / "seed_open.json")
              assert loaded_file_sha == seed["checkpoint_file_sha256"]
              cortex = resume_packet_cortex(session, cp, monotonic_ms=200)
              assert cortex.is_open and cortex.session_id == seed["session_id"]
              old = next(p for p in cortex.outputs if p.packet_id == "output-open-0")
              assert old.playback_state == "interrupted" and not old.commit_eligible
              assert sum(e.event_kind == "RESTART_REENTRY" for e in cortex.events) == 1
              assert sum(e.event_kind == "VOICE_INTENT" and e.voice_intent == "ANSWER" for e in cortex.events) == 1
              cortex.queue_output(
                  turn_id="turn-open", packet_id="output-open-1", monotonic_ms=210,
                  text_segment="Fortsetzung nach Neustart", expression_intent="neutral",
                  speech_act="ANSWER", planned_audio_duration_ms=500, sequence=1,
              )
              cortex.advance_output("output-open-1", playback_state="started", monotonic_ms=220, heard_fraction=0.0)
              cortex.advance_output("output-open-1", playback_state="completed", monotonic_ms=230, heard_fraction=1.0)
              outputs = list(cortex.outputs)
              answer_count = sum(e.event_kind == "VOICE_INTENT" and e.voice_intent == "ANSWER" for e in cortex.events)
              assert answer_count == 1
              assert len({p.packet_id for p in outputs}) == len(outputs)
              assert [(p.packet_id, p.sequence) for p in outputs] == [("output-open-0", 0), ("output-open-1", 1)]
              after = export_packet_cortex_checkpoint(cortex)
              write_json(root / "fdx7_open_after.json", after)
              result = {
                  "pass": True, "process": proc_identity(),
                  "session_id_preserved": cortex.session_id == seed["session_id"],
                  "turn_id_preserved": all(p.turn_id == "turn-open" for p in outputs),
                  "loaded_checkpoint_file_sha256": loaded_file_sha,
                  "loaded_checkpoint_payload_sha256": cp["payload_sha256"],
                  "restart_reentry_count": sum(e.event_kind == "RESTART_REENTRY" for e in cortex.events),
                  "answer_intent_count": answer_count,
                  "old_output_state_after_restart": old.playback_state,
                  "old_output_commit_eligible": old.commit_eligible,
                  "output_ids": [p.packet_id for p in outputs],
                  "output_sequences": [p.sequence for p in outputs],
                  "post_continue_checkpoint_payload_sha256": after["payload_sha256"],
              }
              write_json(root / "resume_open.json", result)

          def closed_identity(session):
              return session.session_causal_identity.derive(
                  causal_id="causal-outcome-fdx78-closed", generation=3, turn_id="turn-closed"
              )

          def seed_closed(root):
              session = make_session("closed")
              cortex = VoicePacketCortex(session)
              turn = "turn-closed"
              cortex.accept_input(final_input(cortex, turn, "input-closed-0", 100))
              cortex.emit_intent(turn_id=turn, monotonic_ms=110, voice_intent="ANSWER")
              cortex.queue_output(
                  turn_id=turn, packet_id="output-closed-0", monotonic_ms=120,
                  text_segment="Abgeschlossene Antwort", expression_intent="neutral",
                  speech_act="ANSWER", planned_audio_duration_ms=300, sequence=0,
              )
              cortex.advance_output("output-closed-0", playback_state="started", monotonic_ms=130, heard_fraction=0.0)
              cortex.advance_output("output-closed-0", playback_state="completed", monotonic_ms=140, heard_fraction=1.0)
              outcome = cortex.close_session(
                  turn_id=turn, monotonic_ms=150, outcome_causal_identity=closed_identity(session),
                  outcome_kind="ENDED", result_ref="result:fdx8:closed",
                  result_sha256="e" * 64, provenance_refs=("trigger4:fdx8:closed",),
              )
              cp = export_packet_cortex_checkpoint(cortex)
              cp_path = root / "fdx8_closed_checkpoint.json"
              write_json(cp_path, cp)
              close_events = [e for e in cortex.events if e.event_kind == "SESSION_CLOSE"]
              output = cortex.outputs[0]
              result = {
                  "pass": (not cortex.is_open) and len(close_events) == 1 and output.commit_eligible,
                  "process": proc_identity(), "session_id": session.voice_session_id,
                  "checkpoint_payload_sha256": cp["payload_sha256"],
                  "checkpoint_file_sha256": digest_file(cp_path),
                  "outcome_id": outcome.outcome_id, "outcome_sha256": digest_json(outcome.as_dict()),
                  "outcome": outcome.as_dict(),
                  "output_id": output.packet_id, "output_sha256": digest_json(output.as_dict()),
                  "session_close_event_id": close_events[0].event_id,
                  "session_close_sha256": digest_json(close_events[0].as_dict()),
                  "session_close_count": 1,
              }
              assert result["pass"]
              write_json(root / "seed_closed.json", result)

          def resume_closed(root):
              session = make_session("closed")
              cp_path = root / "fdx8_closed_checkpoint.json"
              loaded_file_sha = digest_file(cp_path)
              cp = read_json(cp_path)
              seed = read_json(root / "seed_closed.json")
              assert loaded_file_sha == seed["checkpoint_file_sha256"]
              cortex = resume_packet_cortex(session, cp, monotonic_ms=200)
              assert not cortex.is_open
              close_events = [e for e in cortex.events if e.event_kind == "SESSION_CLOSE"]
              assert len(close_events) == 1
              assert close_events[0].event_id == seed["session_close_event_id"]
              assert digest_json(close_events[0].as_dict()) == seed["session_close_sha256"]
              outputs_before = [p.as_dict() for p in cortex.outputs]
              events_before = [e.as_dict() for e in cortex.events]
              outcome_before = cortex._closed_outcome
              assert outcome_before is not None
              assert outcome_before.outcome_id == seed["outcome_id"]
              assert digest_json(outcome_before.as_dict()) == seed["outcome_sha256"]
              replay = cortex.close_session(
                  turn_id="turn-closed", monotonic_ms=150,
                  outcome_causal_identity=closed_identity(session), outcome_kind="ENDED",
                  result_ref="result:fdx8:closed", result_sha256="e" * 64,
                  provenance_refs=("trigger4:fdx8:closed",),
              )
              assert replay.outcome_id == seed["outcome_id"]
              assert [p.as_dict() for p in cortex.outputs] == outputs_before
              assert [e.as_dict() for e in cortex.events] == events_before
              assert sum(e.event_kind == "SESSION_CLOSE" for e in cortex.events) == 1
              assert len(cortex.outputs) == 1 and cortex.outputs[0].packet_id == seed["output_id"]
              assert digest_json(cortex.outputs[0].as_dict()) == seed["output_sha256"]
              result = {
                  "pass": True, "process": proc_identity(),
                  "session_id_preserved": cortex.session_id == seed["session_id"],
                  "loaded_checkpoint_file_sha256": loaded_file_sha,
                  "loaded_checkpoint_payload_sha256": cp["payload_sha256"],
                  "outcome_id_preserved": replay.outcome_id == seed["outcome_id"],
                  "outcome_sha256_preserved": digest_json(replay.as_dict()) == seed["outcome_sha256"],
                  "commit_eligible_output_ids": [p.packet_id for p in cortex.outputs if p.commit_eligible],
                  "session_close_event_id": close_events[0].event_id,
                  "session_close_count": 1,
                  "duplicate_durable_result_count": 0,
                  "duplicate_output_count": 0,
                  "replay_close_mutated_state": False,
              }
              write_json(root / "resume_closed.json", result)

          def finalize(root):
              so, ro = read_json(root / "seed_open.json"), read_json(root / "resume_open.json")
              sc, rc = read_json(root / "seed_closed.json"), read_json(root / "resume_closed.json")
              open_restart = so["process"] != ro["process"]
              closed_restart = sc["process"] != rc["process"]
              fdx7 = bool(so["pass"] and ro["pass"] and open_restart and ro["session_id_preserved"] and ro["turn_id_preserved"] and ro["answer_intent_count"] == 1)
              fdx8 = bool(sc["pass"] and rc["pass"] and closed_restart and rc["outcome_id_preserved"] and rc["session_close_count"] == 1 and rc["duplicate_durable_result_count"] == 0 and rc["duplicate_output_count"] == 0)
              subject = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
              receipt = {
                  "schema": SCHEMA, "result": "NO_COUNTEREXAMPLE" if fdx7 and fdx8 else "COUNTEREXAMPLE",
                  "classification": "BOUNDED_S2_NSPAWN_PROCESS_FILESYSTEM_RESTART_EVIDENCE",
                  "source": {"f2_subject_sha": subject, "runner_name": os.environ.get("RUNNER_NAME", "vps-clay-host")},
                  "execution_surface": {"tier": "S2_NSPAWN", "network": "PRIVATE_OFFLINE", "filesystem": "SANDBOX_LOCAL_PERSISTENT_ACROSS_CHILD_PROCESSES"},
                  "cases": {
                      "FDX7_RESTART_MID_OPEN_TURN": {**ro, "pass": fdx7, "pre_restart_process": so["process"], "process_restart_observed": open_restart, "pre_restart_checkpoint_file_sha256": so["checkpoint_file_sha256"]},
                      "FDX8_CLOSED_RESTART_IDEMPOTENCE": {**rc, "pass": fdx8, "pre_restart_process": sc["process"], "process_restart_observed": closed_restart, "pre_restart_checkpoint_file_sha256": sc["checkpoint_file_sha256"], "pre_restart_outcome_id": sc["outcome_id"], "pre_restart_outcome_sha256": sc["outcome_sha256"], "pre_restart_output_sha256": sc["output_sha256"]},
                  },
                  "explicit_zero_credit": {
                      "service_manager_restart": 0, "host_reboot": 0, "physical_microphone": 0,
                      "physical_speaker": 0, "native_audio_device_enumeration": 0,
                      "os_audio_session_permissions": 0, "human_heard_output": 0,
                      "physical_cancellation_to_silence": 0, "physical_presence": 0,
                      "whole_voice_e2e": 0, "whole_product": 0, "training": 0,
                  },
              }
              raw = json.dumps(receipt, sort_keys=True).encode()
              print("FDX78_RECEIPT_B64=" + base64.b64encode(raw).decode())
              return 0 if receipt["result"] == "NO_COUNTEREXAMPLE" else 2

          def main():
              p = argparse.ArgumentParser(); p.add_argument("mode", choices=("seed-open","resume-open","seed-closed","resume-closed","finalize")); p.add_argument("--state-root", type=pathlib.Path, required=True); a=p.parse_args()
              a.state_root.mkdir(parents=True, exist_ok=True)
              try:
                  {"seed-open": seed_open, "resume-open": resume_open, "seed-closed": seed_closed, "resume-closed": resume_closed}[a.mode](a.state_root) if a.mode != "finalize" else None
                  return finalize(a.state_root) if a.mode == "finalize" else 0
              except Exception as exc:
                  write_json(a.state_root / f"failure_{a.mode}.json", {"mode":a.mode,"process":proc_identity(),"exception_type":type(exc).__name__,"error":str(exc)})
                  raise
          if __name__ == "__main__": raise SystemExit(main())
          PY
          harness_sha="$(sha256sum .fdx78_harness.py | awk '{print $1}')"
          printf 'FDX78_HARNESS_SHA256=%s\n' "$harness_sha" | tee /tmp/fdx78-harness-bind.log

          set +e
          bash tools/vps_sandbox/run_ubuntu_sandbox.sh --backend nspawn --network off -- \
            /bin/bash -lc '
              set -u -o pipefail
              export PYTHONPATH=/work/f2/src
              root=/var/tmp/t4-fdx78-restart
              rm -rf "$root"; mkdir -p "$root"
              rc=0
              python3 /work/f2/.fdx78_harness.py seed-open --state-root "$root" || rc=$?
              if [ "$rc" -eq 0 ]; then python3 /work/f2/.fdx78_harness.py resume-open --state-root "$root" || rc=$?; fi
              if [ "$rc" -eq 0 ]; then python3 /work/f2/.fdx78_harness.py seed-closed --state-root "$root" || rc=$?; fi
              if [ "$rc" -eq 0 ]; then python3 /work/f2/.fdx78_harness.py resume-closed --state-root "$root" || rc=$?; fi
              if [ "$rc" -eq 0 ]; then python3 /work/f2/.fdx78_harness.py finalize --state-root "$root" || rc=$?; fi
              if [ "$rc" -ne 0 ]; then
                printf "FDX78_STAGE_FAILURES_BEGIN\n"
                for f in "$root"/failure_*.json; do [ -f "$f" ] && cat "$f"; done
                printf "FDX78_STAGE_FAILURES_END\n"
              fi
              exit "$rc"
            ' | tee /tmp/fdx78-sandbox.log
          sandbox_rc=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$sandbox_rc" > /tmp/fdx78-sandbox-exit-code.txt

          if grep -q '^FDX78_RECEIPT_B64=' /tmp/fdx78-sandbox.log; then
            grep '^FDX78_RECEIPT_B64=' /tmp/fdx78-sandbox.log | tail -n1 | cut -d= -f2- | base64 -d > /tmp/fdx78-receipt.json
          else
            python3 - <<'PY'
          import json, os, pathlib
          log = pathlib.Path('/tmp/fdx78-sandbox.log').read_text(errors='replace') if pathlib.Path('/tmp/fdx78-sandbox.log').exists() else ''
          receipt = {
              'schema':'T4_FDX78_S2_PROCESS_FILESYSTEM_RESTART/v1',
              'result':'EXECUTION_DEFECT_REQUIRES_TRIAGE',
              'failure_class':'PRODUCT_NEGATIVE_OR_EVIDENCE_VALIDITY_REQUIRES_REVIEW',
              'source':{'f2_subject_sha':os.environ.get('GITHUB_SHA'),'runner_name':os.environ.get('RUNNER_NAME')},
              'sandbox_log_tail':log[-12000:],
              'explicit_zero_credit':{'fdx7':0,'fdx8':0,'physical_runtime':0,'whole_voice_e2e':0,'whole_product':0,'training':0},
          }
          pathlib.Path('/tmp/fdx78-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          fi
          cat /tmp/fdx78-receipt.json
          exit "$sandbox_rc"

      - name: Upload exact S2 receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trigger4-fdx78-s2-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/fdx78-receipt.json
            /tmp/fdx78-sandbox.log
            /tmp/fdx78-sandbox-exit-code.txt
            /tmp/fdx78-preflight.log
            /tmp/fdx78-harness-bind.log
          if-no-files-found: warn

      - name: Enforce bounded FDX7 FDX8 success
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/fdx78-receipt.json',encoding='utf-8'))
          assert r.get('result') == 'NO_COUNTEREXAMPLE', r
          assert r['cases']['FDX7_RESTART_MID_OPEN_TURN']['pass'] is True
          assert r['cases']['FDX7_RESTART_MID_OPEN_TURN']['process_restart_observed'] is True
          assert r['cases']['FDX8_CLOSED_RESTART_IDEMPOTENCE']['pass'] is True
          assert r['cases']['FDX8_CLOSED_RESTART_IDEMPOTENCE']['process_restart_observed'] is True
          assert r['cases']['FDX8_CLOSED_RESTART_IDEMPOTENCE']['session_close_count'] == 1
          assert r['cases']['FDX8_CLOSED_RESTART_IDEMPOTENCE']['duplicate_durable_result_count'] == 0
          assert r['cases']['FDX8_CLOSED_RESTART_IDEMPOTENCE']['duplicate_output_count'] == 0
          assert r['explicit_zero_credit']['whole_product'] == 0
          PY