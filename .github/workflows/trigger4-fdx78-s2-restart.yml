name: Trigger4 FDX7 FDX8 S2 Restart Identity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger4-fdx78-s2-restart.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trigger4-fdx78-s2-restart-singleton
  cancel-in-progress: false

jobs:
  fdx78-s2-restart:
    runs-on: clay-host
    timeout-minutes: 35
    env:
      F2_SANDBOX_ROOT: /var/tmp/frankenstein2-sandboxes
      F2_NSPAWN_BASE_ROOT: /var/lib/frankenstein2-sandbox-images/ubuntu-24.04-base
      F2_SANDBOX_MIN_FREE_KIB: '5242880'
      F2_SANDBOX_MIN_MEM_KIB: '1048576'
    steps:
      - name: Checkout exact F2 subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Verify owner VPS and S2 authority
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${RUNNER_NAME:-}" = "vps-clay-host"
          test "${RUNNER_OS:-}" = "Linux"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash -n tools/vps_sandbox/preflight.sh
          bash -n tools/vps_sandbox/host_prepare_ubuntu_nspawn.sh
          bash -n tools/vps_sandbox/run_ubuntu_sandbox.sh
          bash tools/vps_sandbox/host_prepare_ubuntu_nspawn.sh
          bash tools/vps_sandbox/preflight.sh | tee /tmp/fdx78-preflight.log

      - name: Bind existing canonical FDX7 FDX8 discriminator
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f trigger4/tools/local_voice/fdx_s2_persistence_restart.py
          python3 -m py_compile trigger4/tools/local_voice/fdx_s2_persistence_restart.py
          printf 'F2_SUBJECT_SHA=%s\n' "$(git rev-parse HEAD)" | tee /tmp/fdx78-tool-bind.log
          printf 'FDX78_TOOL_BLOB=%s\n' "$(git rev-parse HEAD:trigger4/tools/local_voice/fdx_s2_persistence_restart.py)" | tee -a /tmp/fdx78-tool-bind.log
          printf 'FDX78_TOOL_SHA256=%s\n' "$(sha256sum trigger4/tools/local_voice/fdx_s2_persistence_restart.py | awk '{print $1}')" | tee -a /tmp/fdx78-tool-bind.log

      - name: Execute existing FDX7 and FDX8 persistence restart discriminator in S2
        shell: bash
        run: |
          set -Eeuo pipefail
          subject="$(git rev-parse HEAD)"
          set +e
          bash tools/vps_sandbox/run_ubuntu_sandbox.sh --backend nspawn --network off -- \
            /bin/bash -lc "
              set -u -o pipefail
              export PYTHONPATH=/work/f2/src
              export F2_SUBJECT_SHA='$subject'
              python3 /work/f2/trigger4/tools/local_voice/fdx_s2_persistence_restart.py
              rc=\$?
              printf 'FDX78_EXIT=%s\\n' \"\$rc\"
              exit \"\$rc\"
            " | tee /tmp/fdx78-sandbox.log
          sandbox_rc=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$sandbox_rc" > /tmp/fdx78-sandbox-exit-code.txt

          if grep -q '^T4_FDX_S2_RECEIPT_B64=' /tmp/fdx78-sandbox.log; then
            grep '^T4_FDX_S2_RECEIPT_B64=' /tmp/fdx78-sandbox.log | tail -n1 | cut -d= -f2- | base64 -d > /tmp/fdx78-receipt.json
          else
            python3 - <<'PY'
          import json, os, pathlib
          log = pathlib.Path('/tmp/fdx78-sandbox.log').read_text(errors='replace') if pathlib.Path('/tmp/fdx78-sandbox.log').exists() else ''
          receipt = {
              'schema': 'T4_T7_S2_FDX7_FDX8_CONTROLLER_NO_RECEIPT/v1',
              'semantic_key': 'fdx7-fdx8-s2-persistence-restart-v1',
              'result': 'EXECUTION_DEFECT_REQUIRES_TRIAGE',
              'failure_class': 'EVIDENCE_INVALID',
              'source': {
                  'f2_subject_sha': os.environ.get('GITHUB_SHA'),
                  'tool_path': 'trigger4/tools/local_voice/fdx_s2_persistence_restart.py',
              },
              'sandbox_log_tail': log[-12000:],
              'explicit_zero_credit': {
                  'fdx7_s2_process_filesystem_restart': 0,
                  'fdx8_s2_closed_restart_idempotence': 0,
                  's3_kernel_reboot': 0,
                  's4_physical_local': 0,
                  'whole_voice_e2e': 0,
                  'whole_product': 0,
                  'training': 0,
              },
          }
          pathlib.Path('/tmp/fdx78-receipt.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          PY
          fi
          python3 -m json.tool /tmp/fdx78-receipt.json >/dev/null
          cat /tmp/fdx78-receipt.json
          exit "$sandbox_rc"

      - name: Upload exact S2 receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trigger4-fdx78-s2-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/fdx78-receipt.json
            /tmp/fdx78-sandbox.log
            /tmp/fdx78-sandbox-exit-code.txt
            /tmp/fdx78-preflight.log
            /tmp/fdx78-tool-bind.log
          if-no-files-found: warn

      - name: Enforce bounded FDX7 FDX8 success
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          r = json.load(open('/tmp/fdx78-receipt.json', encoding='utf-8'))
          assert r.get('schema') == 'T4_T7_S2_FDX7_FDX8_PERSISTENCE_RESTART/v1', r
          assert r.get('result') == 'NO_COUNTEREXAMPLE', r
          assert r['source']['f2_subject_sha'] == os.environ['GITHUB_SHA'], r['source']
          assert r['source']['tool_path'] == 'trigger4/tools/local_voice/fdx_s2_persistence_restart.py'
          assert r['sandbox']['positively_identified'] is True
          assert r['sandbox']['tier'] == 'S2_VPS'
          f7 = r['cases']['FDX7_RESTART_MID_OPEN_TURN']
          f8 = r['cases']['FDX8_CLOSED_RESTART_IDEMPOTENCE']
          assert f7['pass'] is True and f7['distinct_processes'] is True
          assert f7['session_id_preserved'] is True and f7['session_sha256_preserved'] is True
          assert f7['duplicate_output_id_count'] == 0 and f7['second_answer_authority_count'] == 0
          assert f8['pass'] is True and f8['distinct_processes'] is True
          assert f8['session_close_event_count'] == 1 and f8['duplicate_session_close_count'] == 0
          assert f8['duplicate_durable_result_output_count'] == 0 and f8['closed_state_preserved'] is True
          assert f8['closed_write_rejected'] is True
          assert r['credit_boundary']['fdx7_s2_process_filesystem_restart_candidate'] == 1
          assert r['credit_boundary']['fdx8_s2_closed_restart_idempotence_candidate'] == 1
          assert r['credit_boundary']['s3_kernel_reboot'] == 0
          assert r['credit_boundary']['s4_physical_local'] == 0
          assert r['explicit_zero_credit']['whole_voice_e2e'] == 0
          assert r['explicit_zero_credit']['whole_product'] == 0
          PY