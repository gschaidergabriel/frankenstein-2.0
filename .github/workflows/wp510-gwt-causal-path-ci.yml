name: F2 WP510 GWT Causal Path CI

on:
  push:
    branches:
      - trigger4/wp510-gwt-causal-path-20260829
      - main
    paths:
      - 'src/frankenstein2/gwt_causal_path.py'
      - 'tests/test_gwt_causal_path.py'
      - '.github/workflows/wp510-gwt-causal-path-ci.yml'
      - 'workpackages/deltas/F2-WP-510/**'
  pull_request:
    paths:
      - 'src/frankenstein2/gwt_causal_path.py'
      - 'tests/test_gwt_causal_path.py'
      - '.github/workflows/wp510-gwt-causal-path-ci.yml'
      - 'workpackages/deltas/F2-WP-510/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile
        run: python -m py_compile src/frankenstein2/gwt_causal_path.py tests/test_gwt_causal_path.py
      - name: WP510 causal-path falsification suite
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_gwt_causal_path.py
