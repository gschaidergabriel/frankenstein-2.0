name: WP206 G6 external SQLite revision fence CI

on:
  pull_request:
    paths:
      - 'src/frankenstein2/persistent_agency_kernel.py'
      - 'src/frankenstein2/wp206_legacy_authority_recovery.py'
      - 'tests/falsifier_wp206_g6_external_sqlite_revision_drift.py'
      - 'tests/test_wp206_g5_evidence_subject_binding.py'
      - 'tests/test_wp206_g4_repeat_provenance_binding.py'
      - 'tests/test_wp206_legacy_authority_recovery.py'
      - 'tests/test_persistent_agency_kernel.py'
      - '.github/workflows/wp206-g6-external-sqlite-revision-fence-ci.yml'
      - 'workpackages/active/F2-WP-206.json'
      - 'workpackages/state_events/F2-WP-206/**'
  push:
    branches:
      - 'chatgpt/trigger4-wp206-g6-external-sqlite-revision-fence-20260830'
    paths:
      - 'src/frankenstein2/persistent_agency_kernel.py'
      - 'src/frankenstein2/wp206_legacy_authority_recovery.py'
      - 'tests/falsifier_wp206_g6_external_sqlite_revision_drift.py'
      - 'tests/test_wp206_g5_evidence_subject_binding.py'
      - 'tests/test_wp206_g4_repeat_provenance_binding.py'
      - 'tests/test_wp206_legacy_authority_recovery.py'
      - 'tests/test_persistent_agency_kernel.py'
      - '.github/workflows/wp206-g6-external-sqlite-revision-fence-ci.yml'
      - 'workpackages/active/F2-WP-206.json'
      - 'workpackages/state_events/F2-WP-206/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance-and-predecessor-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile exact G6 and predecessor surfaces
        run: >-
          python -m py_compile
          src/frankenstein2/persistent_agency_kernel.py
          src/frankenstein2/wp206_legacy_authority_recovery.py
          tests/falsifier_wp206_g6_external_sqlite_revision_drift.py
          tests/test_wp206_g5_evidence_subject_binding.py
          tests/test_wp206_g4_repeat_provenance_binding.py
          tests/test_wp206_legacy_authority_recovery.py
          tests/test_persistent_agency_kernel.py
      - name: Verify external same-inode SQLite revisions fail closed
        env:
          PYTHONPATH: src
        run: python tests/falsifier_wp206_g6_external_sqlite_revision_drift.py
      - name: Execute predecessor regressions and capture exact failures
        id: predecessor
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: |
          mkdir -p .wp206-g6-diagnostics
          failed=0
          run_case() {
            name="$1"
            shift
            set +e
            "$@" >".wp206-g6-diagnostics/${name}.log" 2>&1
            rc=$?
            set -e
            cat ".wp206-g6-diagnostics/${name}.log"
            printf '%s\n' "$rc" >".wp206-g6-diagnostics/${name}.exit"
            if [ "$rc" -ne 0 ]; then failed=1; fi
          }
          run_case g5 python tests/test_wp206_g5_evidence_subject_binding.py -v
          run_case g4 python tests/test_wp206_g4_repeat_provenance_binding.py -v
          run_case g3 python tests/test_wp206_legacy_authority_recovery.py -v
          run_case kernel python tests/test_persistent_agency_kernel.py -v
          printf '%s\n' "$failed" > .wp206-g6-diagnostics/aggregate.exit
          exit "$failed"
      - name: Upload exact predecessor diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wp206-g6-predecessor-diagnostics
          path: .wp206-g6-diagnostics/
          retention-days: 1
          if-no-files-found: error
      - name: Preserve bounded evidence scope
        if: always()
        run: |
          echo 'CLASSIFICATION=WP206_G6_REPOSITORY_COMPONENT_ACCEPTANCE_CANDIDATE_ONLY'
          echo 'DATA_VERSION_SCOPE=ONE_LONG_LIVED_CONNECTION_ONLY'
          echo 'TARGET_RUNTIME_CREDIT=0'
          echo 'PHYSICAL_GRID10_CREDIT=0'
          echo 'GWT_JSPACE_RUNTIME_CREDIT=0'
          echo 'EFFECT_CREDIT=0'
          echo 'COMPLETION_CREDIT=0'
          echo 'TRAINING_CREDIT=0'
          echo 'WHOLE_SYSTEM_ACCEPTANCE=false'
      - name: Fail closed if any predecessor regression failed
        if: always()
        run: |
          test "$(cat .wp206-g6-diagnostics/aggregate.exit)" = "0"
