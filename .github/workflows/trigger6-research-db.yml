name: Trigger6 Research DB

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/trigger6_research_db.py'
      - 'research/tool_intelligence/SEED_MANIFEST_2026-08-29.json'
      - '.github/workflows/trigger6-research-db.yml'

permissions:
  contents: write

concurrency:
  group: trigger6-research-db
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize deterministic research database
        run: |
          set -euo pipefail
          python3 tools/trigger6_research_db.py bootstrap
          python3 tools/trigger6_research_db.py verify
          sqlite3 research/tool_intelligence/pending_research.sqlite 'PRAGMA quick_check; SELECT seed_id,repo,status,priority FROM seeds ORDER BY priority DESC;'
      - name: Persist database if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- research/tool_intelligence/pending_research.sqlite && git ls-files --error-unmatch research/tool_intelligence/pending_research.sqlite >/dev/null 2>&1; then
            echo 'DB unchanged'
            exit 0
          fi
          git config user.name 'trigger6-research-db'
          git config user.email 'trigger6-research-db@users.noreply.github.com'
          git add research/tool_intelligence/pending_research.sqlite
          git commit -m 'trigger6: materialize pending research database [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
