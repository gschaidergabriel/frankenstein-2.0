name: Candidate WP103 Post-BDF Readback Drift Recheck

on:
  push:
    branches:
      - 'review/wp103-post-bdf-readback-drift-recheck-20260902'
    paths:
      - 'tests/test_wp103_post_bdf_readback_drift_recheck.py'
      - '.github/workflows/candidate-wp103-post-bdf-readback-drift-recheck.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Execute post-BDF WP103 readback drift recheck only
        run: python -m unittest -v tests/test_wp103_post_bdf_readback_drift_recheck.py
