name: REVIEW WP803 G2 RunDescriptor Origin Falsifier

on:
  push:
    branches:
      - review/wp803-g2-rundescriptor-origin-falsifier-20260829
    paths:
      - 'src/frankenstein2/cognitive_microworld.py'
      - 'tests/review/test_wp803_g2_rundescriptor_origin_falsifier.py'
      - '.github/workflows/review-wp803-g2-rundescriptor-origin-falsifier-ci.yml'
  pull_request:
    paths:
      - 'src/frankenstein2/cognitive_microworld.py'
      - 'tests/review/test_wp803_g2_rundescriptor_origin_falsifier.py'
      - '.github/workflows/review-wp803-g2-rundescriptor-origin-falsifier-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  negative-control:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile exact WP800 source plus review witness
        run: >-
          python -m py_compile
          src/frankenstein2/cognitive_microworld.py
          tests/review/test_wp803_g2_rundescriptor_origin_falsifier.py
      - name: Reproduce factory-origin distinction
        env:
          PYTHONPATH: src
        run: >-
          python -m unittest discover
          -s tests/review
          -p 'test_wp803_g2_rundescriptor_origin_falsifier.py'
          -v
