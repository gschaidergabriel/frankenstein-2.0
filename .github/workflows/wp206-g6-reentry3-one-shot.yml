name: WP206 G6 exact-main one-shot owned-surface transplant

on:
  push:
    branches:
      - 'chatgpt/trigger4-wp206-g6-owned-surface-reentry3-20260830'
    paths:
      - 'tools/trigger4_wp206_g6_reentry3_patch.py'
      - 'tests/test_wp206_g6_owned_surface_witness.py'
      - 'tests/falsifier_wp206_g6_external_sqlite_revision_drift.py'
      - '.github/workflows/wp206-g6-reentry3-one-shot.yml'

permissions:
  contents: write

jobs:
  transplant-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Verify exact unpatched WP206 source anchor
        run: |
          test "$(git hash-object src/frankenstein2/persistent_agency_kernel.py)" = "7ba8bd55c788faa9eb9b96870c039cb5273e181d"
          echo 'EXACT_PREPATCH_KERNEL_BLOB=7ba8bd55c788faa9eb9b96870c039cb5273e181d'

      - name: Apply exact-main anchor-checked G6 transplant once
        run: python tools/trigger4_wp206_g6_reentry3_patch.py

      - name: Compile G6 and predecessor surfaces
        run: >-
          python -m py_compile
          src/frankenstein2/persistent_agency_kernel.py
          tests/test_wp206_g6_owned_surface_witness.py
          tests/falsifier_wp206_g6_external_sqlite_revision_drift.py
          tests/test_wp206_g5_evidence_subject_binding.py
          tests/test_wp206_g4_repeat_provenance_binding.py
          tests/test_wp206_legacy_authority_recovery.py
          tests/test_persistent_agency_kernel.py
          src/frankenstein2/causal_identity.py
          src/state/delivery_lifecycle.py
          src/state/delivery_store.py
          src/state/unifieddb_identity.py

      - name: Execute G6 owned-surface acceptance matrix
        env:
          PYTHONPATH: src
        run: python tests/test_wp206_g6_owned_surface_witness.py

      - name: Execute same-inode WP206-owned drift discriminator
        env:
          PYTHONPATH: src
        run: python tests/falsifier_wp206_g6_external_sqlite_revision_drift.py

      - name: Preserve accepted predecessor regressions
        env:
          PYTHONPATH: src
        run: |
          python tests/test_wp206_g5_evidence_subject_binding.py -v
          python tests/test_wp206_g4_repeat_provenance_binding.py -v
          python tests/test_wp206_legacy_authority_recovery.py -v
          python tests/test_persistent_agency_kernel.py -v

      - name: Commit measured product delta
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/frankenstein2/persistent_agency_kernel.py tests/test_wp206_legacy_authority_recovery.py
          test -n "$(git diff --cached --name-only)"
          git commit -m 'trigger4: apply WP206 G6 owned-surface guard on exact main'
          git push origin HEAD:chatgpt/trigger4-wp206-g6-owned-surface-reentry3-20260830

      - name: Preserve bounded evidence scope
        if: always()
        run: |
          echo 'CLASSIFICATION=WP206_G6_REPOSITORY_COMPONENT_CANDIDATE_ONLY'
          echo 'DATA_VERSION_ROLE=CONNECTION_LOCAL_DIRTY_HINT_ONLY'
          echo 'TARGET_RUNTIME_CREDIT=0'
          echo 'PHYSICAL_GRID10_CREDIT=0'
          echo 'GWT_JSPACE_RUNTIME_CREDIT=0'
          echo 'EFFECT_CREDIT=0'
          echo 'COMPLETION_CREDIT=0'
          echo 'TRAINING_CREDIT=0'
          echo 'WHOLE_SYSTEM_ACCEPTANCE=false'
