name: WP720 Integrated Policy Exact-Subject VPS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wp720-integrated-policy-vps.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-integrated-policy-sandbox:
    runs-on: clay-host
    timeout-minutes: 20
    env:
      WP720_ACCEPTED_SUBJECT: 470f6c9509fb5ab32f706b2ee52896073b1180b6
      WP720_REPOSITORY_CI_RUN: '33537134599'
      WP720_REPOSITORY_CI_JOB: '99954086126'
      F2_SANDBOX_ROOT: /var/tmp/frankenstein2-sandboxes
      F2_SANDBOX_MIN_FREE_KIB: '5242880'
      F2_SANDBOX_MIN_MEM_KIB: '1048576'
    steps:
      - name: Checkout exact repaired WP720 subject
        uses: actions/checkout@v4
        with:
          ref: 470f6c9509fb5ab32f706b2ee52896073b1180b6
          persist-credentials: false

      - name: Verify runner and exact subject identity
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '%s\n' \
            "RUNNER_NAME=${RUNNER_NAME:-UNKNOWN}" \
            "RUNNER_OS=${RUNNER_OS:-UNKNOWN}" \
            "RUNNER_ARCH=${RUNNER_ARCH:-UNKNOWN}" \
            "CONTROLLER_SHA=$GITHUB_SHA" \
            "SOURCE_SHA=$(git rev-parse HEAD)" \
            "GITHUB_RUN_ID=$GITHUB_RUN_ID" \
            "GITHUB_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
          test "${RUNNER_NAME:-}" = "vps-clay-host"
          test "${RUNNER_OS:-}" = "Linux"
          test "$(git rev-parse HEAD)" = "$WP720_ACCEPTED_SUBJECT"
          test -f src/frankenstein2/voice_packet_cortex.py
          test -f tests/test_voice_packet_cortex.py
          test -f tests/test_wp720_turn_policy_falsifiers.py
          test ! -e src/frankenstein2/voice_packet_turn_policy.py
          test ! -e tests/test_voice_packet_turn_policy.py

      - name: Host-health and isolation preflight
        shell: bash
        run: bash tools/vps_sandbox/preflight.sh | tee /tmp/wp720-integrated-preflight.txt

      - name: Execute repaired integrated subject in VPS sandbox
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tools/vps_sandbox/run_ubuntu_sandbox.sh --backend auto --network off -- \
            /bin/bash -lc '
              set +e
              PYTHONPATH=src python3 -m unittest discover -s tests -p "test_wp720_turn_policy_falsifiers.py" -v > /tmp/wp720-pfd67.log 2>&1
              pfd_status=$?
              PYTHONPATH=src python3 -m unittest discover -s tests -p "test_voice_packet_cortex.py" -v > /tmp/wp720-cortex.log 2>&1
              cortex_status=$?
              set -e
              cat /tmp/wp720-pfd67.log
              cat /tmp/wp720-cortex.log
              printf "PFD67_TESTS_EXIT=%s\n" "$pfd_status"
              printf "CORTEX_TESTS_EXIT=%s\n" "$cortex_status"
              exit 0
            ' | tee /tmp/wp720-integrated-sandbox.txt

      - name: Emit exact bounded runtime receipt
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re
          import subprocess

          expected_subject = os.environ['WP720_ACCEPTED_SUBJECT']

          def parse_status(text, name):
              match = re.search(rf'^{re.escape(name)}=(\d+)$', text, re.MULTILINE)
              return int(match.group(1)) if match else None

          try:
              source_sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          except Exception:
              source_sha = None

          sandbox_path = pathlib.Path('/tmp/wp720-integrated-sandbox.txt')
          preflight_path = pathlib.Path('/tmp/wp720-integrated-preflight.txt')
          sandbox = sandbox_path.read_text(errors='replace') if sandbox_path.exists() else ''
          preflight = preflight_path.read_text(errors='replace') if preflight_path.exists() else ''
          statuses = {
              'pfd6_pfd7_tests': parse_status(sandbox, 'PFD67_TESTS_EXIT'),
              'cortex_tests': parse_status(sandbox, 'CORTEX_TESTS_EXIT'),
          }
          runner_valid = os.environ.get('RUNNER_NAME') == 'vps-clay-host' and os.environ.get('RUNNER_OS') == 'Linux'
          sandbox_executed = 'F2_SANDBOX_RESULT=PASS' in sandbox
          subject_valid = source_sha == expected_subject

          if not runner_valid:
              result = 'INFRA_AUTH_TRANSPORT_QUOTA'
              failure_class = 'INFRA_AUTH_TRANSPORT_QUOTA'
          elif not subject_valid:
              result = 'EVIDENCE_INVALID'
              failure_class = 'EVIDENCE_INVALID'
          elif not sandbox_executed or any(value is None for value in statuses.values()):
              result = 'INFRA_AUTH_TRANSPORT_QUOTA'
              failure_class = 'INFRA_AUTH_TRANSPORT_QUOTA'
          elif any(value != 0 for value in statuses.values()):
              result = 'EXECUTED_PRODUCT_NEGATIVE'
              failure_class = 'PRODUCT_NEGATIVE'
          else:
              result = 'EXECUTED_NO_COUNTEREXAMPLE'
              failure_class = None

          promoted = int(result == 'EXECUTED_NO_COUNTEREXAMPLE')
          receipt = {
              'schema': 'F2_WP720_INTEGRATED_POLICY_VPS_RECEIPT/v1',
              'workpackage_id': 'F2-WP-720',
              'generation': 1,
              'claim_id': 'F2-WP-720-G1-GPT56SOL-PFD-TURN-POLICY-BINDING-20260902',
              'result': result,
              'failure_class': failure_class,
              'repository_ci_subject_sha': expected_subject,
              'repository_ci_run_id': int(os.environ['WP720_REPOSITORY_CI_RUN']),
              'repository_ci_job_id': int(os.environ['WP720_REPOSITORY_CI_JOB']),
              'source_sha': source_sha,
              'controller_sha': os.environ.get('GITHUB_SHA'),
              'workflow_run_id': int(os.environ.get('GITHUB_RUN_ID', '0')),
              'workflow_run_attempt': int(os.environ.get('GITHUB_RUN_ATTEMPT', '0')),
              'runner_name': os.environ.get('RUNNER_NAME', 'UNKNOWN'),
              'runner_os': os.environ.get('RUNNER_OS', 'UNKNOWN'),
              'runner_arch': os.environ.get('RUNNER_ARCH', 'UNKNOWN'),
              'execution_surface': 'OWNER_VPS_DISPOSABLE_UBUNTU_SANDBOX',
              'sandbox_tier': 'S1_OR_S2_AUTO',
              'network_mode': 'OFF',
              'step_statuses': statuses,
              'preflight_log': preflight,
              'sandbox_log': sandbox,
              'runtime_execution_observed': bool(sandbox_executed and all(value is not None for value in statuses.values())),
              'repository_component_ci_credit': 1,
              'target_environment_component_runtime_credit': promoted,
              'physical_audio_credit': 0,
              'asr_runtime_credit': 0,
              'tts_runtime_credit': 0,
              'gwt_runtime_credit': 0,
              'semantic_gwt_runtime_credit': 0,
              'jspace_runtime_credit': 0,
              'effect_credit': 0,
              'training_credit': 0,
              'completion_credit': 0,
              'whole_voice_e2e_credit': 0,
              'whole_system_acceptance': False,
          }
          pathlib.Path('/tmp/wp720-integrated-runtime-receipt.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print(json.dumps(receipt, sort_keys=True))
          PY

      - name: Upload bounded runtime receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp720-integrated-policy-vps-${{ github.run_id }}
          path: /tmp/wp720-integrated-runtime-receipt.json
          if-no-files-found: error

      - name: Enforce bounded runtime discriminator result
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('/tmp/wp720-integrated-runtime-receipt.json')
          if not path.exists():
              raise SystemExit('WP720_INTEGRATED_RUNTIME_RECEIPT_MISSING')
          receipt = json.loads(path.read_text())
          if receipt.get('result') != 'EXECUTED_NO_COUNTEREXAMPLE':
              raise SystemExit(f"WP720_INTEGRATED_RUNTIME_DISCRIMINATOR_NOT_PASS:{receipt.get('result')}:{receipt.get('failure_class')}")
          print('WP720_INTEGRATED_BOUNDED_TARGET_COMPONENT_RUNTIME_PASS')
          PY
