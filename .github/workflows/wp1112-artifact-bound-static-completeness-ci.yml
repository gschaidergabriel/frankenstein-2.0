name: WP1112 artifact-bound static completeness

on:
  push:
    paths:
      - 'src/frankenstein2/artifact_bound_static_completeness.py'
      - 'tests/test_artifact_bound_static_completeness.py'
      - '.github/workflows/wp1112-artifact-bound-static-completeness-ci.yml'
      - 'src/frankenstein2/portable_release_static_completeness.py'
      - 'src/frankenstein2/release_archive.py'
      - 'src/frankenstein2/release_artifact_subject.py'
      - 'AI_START_HERE_DO_NOT_SCAN_REPO/02_RELEASE_CONTRACT.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  component:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile owned composer and test
        run: |
          python -m py_compile src/frankenstein2/artifact_bound_static_completeness.py tests/test_artifact_bound_static_completeness.py
      - name: Run exact-artifact binding suite
        env:
          PYTHONPATH: src
        run: |
          python -m unittest -v tests.test_artifact_bound_static_completeness
