name: WP206 G3 authority migration CI

on:
  pull_request:
    paths:
      - 'src/frankenstein2/persistent_agency_authority_migration.py'
      - 'src/frankenstein2/persistent_agency_kernel.py'
      - 'tests/test_wp206_authority_migration.py'
      - 'tests/test_persistent_agency_kernel.py'
      - 'tests/wp206_restart_probe.py'
      - '.github/workflows/wp206-legacy-authority-migration-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-component-falsifiers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile exact WP206 G3 migration surface
        run: |
          python -m py_compile \
            src/frankenstein2/persistent_agency_kernel.py \
            src/frankenstein2/persistent_agency_authority_migration.py \
            tests/wp206_restart_probe.py \
            tests/test_persistent_agency_kernel.py \
            tests/test_wp206_authority_migration.py
      - name: Existing WP206 regression suite
        env:
          PYTHONPATH: src
        run: python tests/test_persistent_agency_kernel.py
      - name: Explicit G1 receipt migration falsifiers
        env:
          PYTHONPATH: src
        run: python tests/test_wp206_authority_migration.py
