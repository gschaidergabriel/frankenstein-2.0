name: Review WP506 d6b19573 Exact Suite

on:
  push:
    branches:
      - review/wp506-d6b19573-exact-suite
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind exact WP506 source and tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/frankenstein2/gwt_workspace.py)" = "ddf0cf623ad6d6571b10ba79dd237f7b6cc10335"
          test "$(git hash-object tests/test_gwt_workspace.py)" = "9d6896fb856639a0822d8697bad86fc797ca2217"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile
        run: python -m py_compile src/frankenstein2/gwt_workspace.py tests/test_gwt_workspace.py
      - name: Run complete WP506 regression suite
        run: python -m pytest -q tests/test_gwt_workspace.py
