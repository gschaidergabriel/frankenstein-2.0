name: F2 WP707 Retina Fan-In CI

on:
  push:
    branches:
      - main
      - trigger4/wp707-retina-fanin-20260829
    paths:
      - 'src/frankenstein2/retina_fanin.py'
      - 'tests/test_retina_fanin.py'
      - '.github/workflows/wp707-retina-fanin-ci.yml'
  pull_request:
    paths:
      - 'src/frankenstein2/retina_fanin.py'
      - 'tests/test_retina_fanin.py'
      - '.github/workflows/wp707-retina-fanin-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile src/frankenstein2/retina_fanin.py tests/test_retina_fanin.py
      - name: Permission and parallel fan-in falsification suite
        env:
          PYTHONPATH: src
        run: python tests/test_retina_fanin.py -v
