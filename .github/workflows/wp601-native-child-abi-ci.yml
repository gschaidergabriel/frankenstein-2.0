name: F2 WP601 Native Child ABI CI

on:
  push:
    branches:
      - main
      - trigger4/wp601-native-child-abi-20260829
    paths:
      - 'src/frankenstein2/native_child_abi.py'
      - 'src/frankenstein2/native_child_binding.py'
      - 'src/frankenstein2/causal_identity.py'
      - 'tests/test_native_child_abi.py'
      - '.github/workflows/wp601-native-child-abi-ci.yml'
  pull_request:
    paths:
      - 'src/frankenstein2/native_child_abi.py'
      - 'src/frankenstein2/native_child_binding.py'
      - 'src/frankenstein2/causal_identity.py'
      - 'tests/test_native_child_abi.py'
      - '.github/workflows/wp601-native-child-abi-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile src/frankenstein2/native_child_abi.py tests/test_native_child_abi.py
      - name: Native Child ABI falsification suite
        env:
          PYTHONPATH: src
        run: python tests/test_native_child_abi.py -v
