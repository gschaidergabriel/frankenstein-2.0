name: WP702 perception control

on:
  pull_request:
    paths:
      - 'src/frankenstein2/perception_control.py'
      - 'tests/test_perception_control.py'
      - '.github/workflows/wp702-perception-control-ci.yml'
      - 'workpackages/deltas/F2-WP-702/**'
  push:
    branches: [main]
    paths:
      - 'src/frankenstein2/perception_control.py'
      - 'tests/test_perception_control.py'
      - '.github/workflows/wp702-perception-control-ci.yml'
      - 'workpackages/deltas/F2-WP-702/**'

permissions:
  contents: read

jobs:
  wp702-component:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile G5 source and falsifiers
        run: python -m py_compile src/frankenstein2/perception_control.py tests/test_perception_control.py
      - name: Run WP702 G5 factory and consumer-revalidation falsifiers
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_perception_control -v
