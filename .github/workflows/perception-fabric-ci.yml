name: Perception Fabric core contracts

on:
  pull_request:
    paths:
      - 'src/frankenstein2/perception_fabric.py'
      - 'src/frankenstein2/perception_temporal.py'
      - 'src/frankenstein2/perception_bridge.py'
      - 'tests/test_perception_fabric.py'
      - 'tests/test_perception_temporal.py'
      - 'tests/test_perception_bridge.py'
      - 'architecture/PERCEPTION_FABRIC.md'
      - 'workpackages/PERCEPTION_FABRIC_PHASE.json'
      - '.github/workflows/perception-fabric-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/frankenstein2/perception_fabric.py'
      - 'src/frankenstein2/perception_temporal.py'
      - 'src/frankenstein2/perception_bridge.py'
      - 'tests/test_perception_fabric.py'
      - 'tests/test_perception_temporal.py'
      - 'tests/test_perception_bridge.py'
      - 'architecture/PERCEPTION_FABRIC.md'
      - 'workpackages/PERCEPTION_FABRIC_PHASE.json'
      - '.github/workflows/perception-fabric-ci.yml'

permissions:
  contents: read

jobs:
  perception-fabric-core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Perception Fabric core
        run: |
          python -m py_compile src/frankenstein2/perception_fabric.py
          python -m py_compile src/frankenstein2/perception_temporal.py
          python -m py_compile src/frankenstein2/perception_bridge.py
      - name: Run deterministic Perception Fabric falsifiers
        env:
          PYTHONPATH: src
        run: |
          python -m unittest tests.test_perception_fabric -v
          python -m unittest tests.test_perception_temporal -v
          python -m unittest tests.test_perception_bridge -v
