name: F2 WP306 Context Compiler CI

on:
  push:
    branches:
      - main
      - trigger4/wp306-g4-cost-witness-binding-impl-20260829-gpt56sol
    paths:
      - 'src/frankenstein2/context_compiler.py'
      - 'tests/test_context_compiler.py'
      - 'tests/test_wp306_renderer_tokenizer_cost_binding_falsifier.py'
      - '.github/workflows/wp306-context-compiler-ci.yml'
  pull_request:
    paths:
      - 'src/frankenstein2/context_compiler.py'
      - 'tests/test_context_compiler.py'
      - 'tests/test_wp306_renderer_tokenizer_cost_binding_falsifier.py'
      - '.github/workflows/wp306-context-compiler-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: >-
          python -m py_compile
          src/frankenstein2/context_compiler.py
          tests/test_context_compiler.py
          tests/test_wp306_renderer_tokenizer_cost_binding_falsifier.py
      - name: Context compiler and cost-witness falsification suite
        env:
          PYTHONPATH: src
        run: >-
          python -m unittest
          tests.test_context_compiler
          tests.test_wp306_renderer_tokenizer_cost_binding_falsifier
          -v
