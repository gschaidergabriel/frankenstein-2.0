name: F2 WP803 G2 Benchmark Generation Falsifier

on:
  push:
    branches:
      - review/f2-wp803-g2-benchmark-generation-falsifier-20260829
    paths:
      - 'tests/test_wp803_g2_benchmark_generation_falsifier.py'
      - '.github/workflows/wp803-g2-benchmark-generation-falsifier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  falsifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile candidate falsifier
        run: python -m py_compile tests/test_wp803_g2_benchmark_generation_falsifier.py
      - name: Require trusted benchmark generation binding
        env:
          PYTHONPATH: src
        run: python tests/test_wp803_g2_benchmark_generation_falsifier.py -v
