name: WP206 G2 one-shot stable authority binding repair

on:
  push:
    branches:
      - chatgpt/trigger4-wp206-g2-authority-receipt-fence-impl-20260830

permissions:
  contents: write

jobs:
  apply-verify-and-self-delete:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/trigger4-wp206-g2-authority-receipt-fence-impl-20260830
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Separate stable authority identity from mutable DB fingerprint evidence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/frankenstein2/persistent_agency_kernel.py')
          text = path.read_text(encoding='utf-8')

          helper_name = '_unifieddb_authority_binding_sha256'
          if f'def {helper_name}(' not in text:
              anchor = '''def _same_real_path(left: str, right: str) -> bool:
              return os.path.normcase(os.path.realpath(left)) == os.path.normcase(
                  os.path.realpath(right)
              )


          def _decode_goal_record_candidate(raw: Any) -> GoalRecord:
          '''
              replacement = '''def _same_real_path(left: str, right: str) -> bool:
              return os.path.normcase(os.path.realpath(left)) == os.path.normcase(
                  os.path.realpath(right)
              )


          def _unifieddb_authority_binding_sha256(
              *,
              resolution: UnifiedDBResolution,
              fingerprint: UnifiedDBFingerprint,
          ) -> str:
              """Restart-stable authority identity; mutable DB content stays fingerprint evidence."""
              if fingerprint.device is None or fingerprint.inode is None:
                  raise PersistentAgencyError("UNIFIEDDB_FINGERPRINT_FILE_IDENTITY_MISSING")
              return _sha256(
                  {
                      "schema": "FRANKENSTEIN2_UNIFIEDDB_AUTHORITY_BINDING/v1",
                      "resolution_schema": resolution.schema,
                      "fingerprint_schema": fingerprint.schema,
                      "canonical_db_path": os.path.realpath(fingerprint.real_path),
                      "db_device": int(fingerprint.device),
                      "db_inode": int(fingerprint.inode),
                  }
              )


          def _decode_goal_record_candidate(raw: Any) -> GoalRecord:
          '''
              count = text.count(anchor)
              if count != 1:
                  raise SystemExit(f'stable helper insertion anchor count={count}')
              text = text.replace(anchor, replacement, 1)

          old = '        self.authority_receipt_sha256 = fingerprint.receipt_sha256()\n'
          new = '''        self.authority_receipt_sha256 = _unifieddb_authority_binding_sha256(
              resolution=resolution,
              fingerprint=fingerprint,
          )
          '''
          if old in text:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'mutable receipt assignment count={count}')
              text = text.replace(old, new, 1)
          elif 'self.authority_receipt_sha256 = _unifieddb_authority_binding_sha256(' not in text:
              raise SystemExit('store authority binding assignment not found')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify exact semantic boundary
        shell: bash
        run: |
          grep -q 'FRANKENSTEIN2_UNIFIEDDB_AUTHORITY_BINDING/v1' src/frankenstein2/persistent_agency_kernel.py
          grep -q 'self.authority_receipt_sha256 = _unifieddb_authority_binding_sha256' src/frankenstein2/persistent_agency_kernel.py
          grep -q 'stored_authority_receipt_sha256 != self.authority_receipt_sha256' src/frankenstein2/persistent_agency_kernel.py
          if grep -q 'self.authority_receipt_sha256 = fingerprint.receipt_sha256()' src/frankenstein2/persistent_agency_kernel.py; then
            echo 'mutable full fingerprint is still used as replay authority' >&2
            exit 1
          fi

      - name: Prove prior restart invariants and exact G2 falsifier surface
        env:
          PYTHONPATH: src
        run: |
          python -m py_compile src/frankenstein2/persistent_agency_kernel.py tests/test_persistent_agency_kernel.py tests/test_wp206_unifieddb_authority_receipt_replay_falsifier.py tests/wp206_restart_probe.py
          python tests/test_persistent_agency_kernel.py -v
          python tests/test_wp206_unifieddb_authority_receipt_replay_falsifier.py -v

      - name: Commit only durable semantic repair and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/wp206-g2-stable-binding-one-shot.yml
          git config user.name 'GPT-5.6-Sol Trigger4'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/frankenstein2/persistent_agency_kernel.py .github/workflows/wp206-g2-stable-binding-one-shot.yml
          git diff --cached --check
          git commit -m 'trigger4: make WP206 replay authority restart-stable'
          git push origin HEAD:chatgpt/trigger4-wp206-g2-authority-receipt-fence-impl-20260830
