name: WP807 Family Provenance Repair CI

on:
  push:
    branches:
      - trigger4/wp807-family-provenance-repair-20260829
    paths:
      - 'src/frankenstein2/cognitive_agentic_core_falsifier.py'
      - 'tests/test_cognitive_agentic_core_falsifier.py'
      - '.github/workflows/wp807-family-provenance-repair-ci.yml'
  pull_request:
    paths:
      - 'src/frankenstein2/cognitive_agentic_core_falsifier.py'
      - 'tests/test_cognitive_agentic_core_falsifier.py'
      - '.github/workflows/wp807-family-provenance-repair-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile repaired WP807 gate and tests
        run: |
          python -m py_compile \
            src/frankenstein2/cognitive_agentic_core_falsifier.py \
            tests/test_cognitive_agentic_core_falsifier.py
      - name: Run WP807 family-provenance regressions
        env:
          PYTHONPATH: src
        run: python -m unittest -v tests.test_cognitive_agentic_core_falsifier
