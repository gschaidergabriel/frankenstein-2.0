name: Trigger4 WP900 G10 Private Selector Closure

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger4-wp900-g10-private-selector-closure.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trigger4-wp900-g10-private-selector-closure
  cancel-in-progress: false

jobs:
  close-private-selector:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact G10 repaired subject
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          active = json.loads(Path('workpackages/active/F2-WP-900.json').read_text())
          assert active['generation'] == 10
          assert active['claim_id'] == 'F2-WP-900-G10-GPT56SOL-INDEPENDENT-SEMANTIC-MEDIATOR-AUTHORITY-20260902'
          assert active['state'] == 'CLAIMED'
          PY
          test "$(git rev-parse HEAD:src/frankenstein2/gwt_independent_semantic_mediator.py)" = "42d544a217a338b3cd22b33cf34b94ef5eae5ef1"
          test "$(git rev-parse HEAD:tests/test_wp900_g10_trial_state_surface.py)" = "1da90e4078d02716bd2c31093ed251e919eba150"

      - name: Remove behavior-readable private digest selector
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path('src/frankenstein2/gwt_independent_semantic_mediator.py')
          source = source_path.read_text()

          replacements = [
              (
                  '    canonical_semantic_json: str\n    _factory_seal: object | None = field(default=None, init=False, repr=False, compare=False)\n    _factory_sha256: str | None = field(default=None, init=False, repr=False, compare=False)\n\n    schema = MEDIATED_SEMANTIC_STATE_SCHEMA',
                  '    canonical_semantic_json: str\n    _factory_seal: object | None = field(default=None, init=False, repr=False, compare=False)\n\n    schema = MEDIATED_SEMANTIC_STATE_SCHEMA',
              ),
              (
                  '    def as_dict(self) -> dict[str, Any]:\n        return {\n            "schema": self.schema,\n            "canonical_semantic_json": self.canonical_semantic_json,\n        }\n\n    def sha256(self) -> str:\n        return _digest(self.as_dict())\n\n\ndef admit_mediated_semantic_state(',
                  '    def as_dict(self) -> dict[str, Any]:\n        return {\n            "schema": self.schema,\n            "canonical_semantic_json": self.canonical_semantic_json,\n        }\n\n\ndef admit_mediated_semantic_state(',
              ),
              (
                  '    state = MediatedSemanticState(canonical_semantic_json=canonical)\n    return _seal(state, _STATE_FACTORY)\n\n\ndef validate_mediated_semantic_state(value: MediatedSemanticState) -> None:\n    _validate_seal(value, MediatedSemanticState, _STATE_FACTORY, "mediated semantic state")',
                  '    state = MediatedSemanticState(canonical_semantic_json=canonical)\n    object.__setattr__(state, "_factory_seal", _STATE_FACTORY)\n    return state\n\n\ndef validate_mediated_semantic_state(value: MediatedSemanticState) -> None:\n    if type(value) is not MediatedSemanticState or value._factory_seal is not _STATE_FACTORY:\n        raise G10MediatorError("mediated semantic state lacks valid factory origin")',
              ),
              (
                  '        state_sha256=semantic_state.sha256(),',
                  '        state_sha256=_digest(semantic_state.as_dict()),',
              ),
              (
                  '        if receipt.state_sha256 != state.sha256():',
                  '        if receipt.state_sha256 != _digest(state.as_dict()):',
              ),
          ]
          for old, new in replacements:
              count = source.count(old)
              assert count == 1, (old[:120], count)
              source = source.replace(old, new, 1)
          source_path.write_text(source)

          test_path = Path('tests/test_wp900_g10_trial_state_surface.py')
          tests = test_path.read_text()
          old = '    public_dataclass_fields = {item.name for item in fields(state) if not item.name.startswith("_")}\n    assert public_dataclass_fields == {"canonical_semantic_json"}\n'
          new = '    all_dataclass_fields = {item.name for item in fields(state)}\n    public_dataclass_fields = {name for name in all_dataclass_fields if not name.startswith("_")}\n    assert all_dataclass_fields == {"canonical_semantic_json", "_factory_seal"}\n    assert public_dataclass_fields == {"canonical_semantic_json"}\n    assert not hasattr(state, "_factory_sha256")\n    assert not hasattr(state, "sha256")\n'
          assert tests.count(old) == 1
          tests = tests.replace(old, new, 1)

          old = '    nonsemantic_views = []\n    for state in states:\n'
          new = '    assert len({id(state._factory_seal) for state in states}) == 1\n    assert all(not hasattr(state, "_factory_sha256") for state in states)\n    assert all(not hasattr(state, "sha256") for state in states)\n\n    nonsemantic_views = []\n    for state in states:\n'
          assert tests.count(old) == 1
          tests = tests.replace(old, new, 1)
          test_path.write_text(tests)
          PY

      - name: Execute G8 G9 G10 regression fence
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/tests
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -m py_compile src/frankenstein2/gwt_independent_semantic_mediator.py
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q \
            tests/test_wp900_g8_causal_admission_fence.py \
            tests/test_wp900_g9_semantic_content_causality.py \
            tests/test_wp900_g9_reentry_only_execution.py \
            tests/test_wp900_g10_independent_semantic_mediator.py \
            tests/test_wp900_g10_trial_state_surface.py

      - name: Commit coherent G10 private-selector closure and retire executor
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/trigger4-wp900-g10-private-selector-closure.yml
          git diff --check
          git config user.name 'GPT-5.6-Sol Trigger4'
          git config user.email 'actions@users.noreply.github.com'
          git add src/frankenstein2/gwt_independent_semantic_mediator.py tests/test_wp900_g10_trial_state_surface.py
          test -n "$(git diff --cached --name-only)"
          git commit -m 'wp900: remove private digest selector from G10 behavior state'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
