name: Candidate WP103 G2 Readback Drift Falsifier

on:
  push:
    branches:
      - 'review/wp103-g2-readback-drift-falsifier-20260902'
    paths:
      - 'tests/test_wp103_g2_readback_drift_falsifier.py'
      - '.github/workflows/candidate-wp103-g2-readback-drift-falsifier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  falsifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Execute WP103 G2 readback drift candidate falsifier only
        run: python -m unittest -v tests/test_wp103_g2_readback_drift_falsifier.py
