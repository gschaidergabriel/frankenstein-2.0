name: F2 WP504 Zero Budget Repair Once

on:
  push:
    branches:
      - chatgpt/wp504-zero-budget-repair-20260829
    paths:
      - '.github/workflows/wp504-zero-budget-repair-once.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'trigger4: remove temporary WP504 repair workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/wp504-zero-budget-repair-20260829
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact fail-closed repair and regressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('src/frankenstein2/epistemic_action_selection.py')
          source = source_path.read_text()
          old = '''        if candidate.work_units_requested > budget.max_work_units:\n            reason = "CELL_WORK_BUDGET_EXCEEDED"\n            is_eligible = False\n        elif candidate.work_units_requested > plan.max_total_work_units:\n            reason = "PLAN_TOTAL_WORK_BUDGET_EXCEEDED"\n            is_eligible = False\n        else:\n            reason = "ELIGIBLE"\n            is_eligible = True\n            eligible.append(candidate)\n'''
          new = '''        if plan.max_total_work_units == 0:\n            reason = "PLAN_TOTAL_WORK_BUDGET_UNAVAILABLE"\n            is_eligible = False\n        elif budget.max_work_units == 0:\n            reason = "CELL_WORK_BUDGET_UNAVAILABLE"\n            is_eligible = False\n        elif candidate.work_units_requested > budget.max_work_units:\n            reason = "CELL_WORK_BUDGET_EXCEEDED"\n            is_eligible = False\n        elif candidate.work_units_requested > plan.max_total_work_units:\n            reason = "PLAN_TOTAL_WORK_BUDGET_EXCEEDED"\n            is_eligible = False\n        else:\n            reason = "ELIGIBLE"\n            is_eligible = True\n            eligible.append(candidate)\n'''
          if source.count(old) != 1:
              raise SystemExit('expected exact WP504 budget block not found exactly once')
          source_path.write_text(source.replace(old, new))

          test_path = Path('tests/test_epistemic_action_selection.py')
          tests = test_path.read_text()
          marker = '''    def test_all_ineligible_returns_no_eligible_candidate_without_effect_authority(self):\n'''
          added = '''    def test_zero_plan_work_budget_is_unavailable_even_for_zero_work_candidate(self):\n        hp = hyperposition()\n        proposal = select(\n            hp,\n            grid_plan(cell_work=20, total_work=0),\n            (candidate(hp, "candidate:zero-plan", gain=1_000_000, cost=0, work=0),),\n        )\n        self.assertEqual(proposal.status, "NO_ELIGIBLE_CANDIDATE")\n        self.assertIsNone(proposal.selected_candidate_id)\n        self.assertEqual(\n            proposal.assessments[0].reason,\n            "PLAN_TOTAL_WORK_BUDGET_UNAVAILABLE",\n        )\n\n    def test_zero_cell_work_budget_is_unavailable_even_for_zero_work_candidate(self):\n        hp = hyperposition()\n        proposal = select(\n            hp,\n            grid_plan(cell_work=0, total_work=100),\n            (candidate(hp, "candidate:zero-cell", gain=1_000_000, cost=0, work=0),),\n        )\n        self.assertEqual(proposal.status, "NO_ELIGIBLE_CANDIDATE")\n        self.assertIsNone(proposal.selected_candidate_id)\n        self.assertEqual(\n            proposal.assessments[0].reason,\n            "CELL_WORK_BUDGET_UNAVAILABLE",\n        )\n\n'''
          if marker not in tests:
              raise SystemExit('WP504 test insertion marker not found')
          if 'test_zero_plan_work_budget_is_unavailable_even_for_zero_work_candidate' in tests:
              raise SystemExit('zero-budget repair tests already present')
          test_path.write_text(tests.replace(marker, added + marker, 1))
          PY
      - name: Compile exact WP504 surface
        run: python -m py_compile src/frankenstein2/epistemic_action_selection.py tests/test_epistemic_action_selection.py
      - name: Run repaired WP504 falsification suite
        env:
          PYTHONPATH: src
        run: python tests/test_epistemic_action_selection.py -v
      - name: Commit repair to isolated branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/frankenstein2/epistemic_action_selection.py tests/test_epistemic_action_selection.py
          git commit -m 'trigger4: repair WP504 unavailable zero GRID budget fence'
          git push origin HEAD:chatgpt/wp504-zero-budget-repair-20260829
