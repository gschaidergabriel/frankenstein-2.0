name: review-wp403-worldslice-subclass-falsifier

on:
  pull_request:
    paths:
      - 'src/frankenstein2/physics_projection.py'
      - 'src/frankenstein2/sparse_world_basis.py'
      - 'tests/review/test_wp403_worldslice_subclass_falsifier.py'
      - '.github/workflows/review-wp403-worldslice-subclass-falsifier-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  falsifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute exact review falsifier
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests/review -p 'test_wp403_worldslice_subclass_falsifier.py' -v
