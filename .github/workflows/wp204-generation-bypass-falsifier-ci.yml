name: F2 WP204 Generation Bypass Falsifier CI

on:
  push:
    branches:
      - chatgpt/trigger4-wp204-generation-bypass-falsifier-20260829
    paths:
      - 'src/frankenstein2/goal_lifecycle.py'
      - 'tests/test_goal_lifecycle_generation_falsifier.py'
      - '.github/workflows/wp204-generation-bypass-falsifier-ci.yml'
  pull_request:
    paths:
      - 'src/frankenstein2/goal_lifecycle.py'
      - 'tests/test_goal_lifecycle_generation_falsifier.py'
      - '.github/workflows/wp204-generation-bypass-falsifier-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  falsifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile candidate falsifier
        run: python -m py_compile src/frankenstein2/goal_lifecycle.py tests/test_goal_lifecycle_generation_falsifier.py
      - name: Generation-bypass discriminator
        env:
          PYTHONPATH: src
        run: python tests/test_goal_lifecycle_generation_falsifier.py -v
