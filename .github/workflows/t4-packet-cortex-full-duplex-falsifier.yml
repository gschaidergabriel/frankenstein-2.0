name: T4 Packet Cortex Full Duplex Falsifier

on:
  push:
    branches: [main]
    paths:
      - 'src/frankenstein2/voice_packet_cortex.py'
      - 'src/frankenstein2/voice_packet_cortex_recovery.py'
      - 'tests/test_voice_packet_cortex.py'
      - 'tests/test_voice_packet_cortex_recovery.py'
      - 'research/local_voice/tools/falsify_voice_packet_cortex.py'
      - 'research/local_voice/tools/falsify_voice_packet_cortex_recovery_bounds.py'
      - 'research/local_voice/tools/falsify_voice_packet_cortex_atomicity.py'
      - 'trigger4/tools/local_voice/fdx_s2_persistence_restart.py'
      - '.github/workflows/t4-packet-cortex-full-duplex-falsifier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-source-falsifier:
    runs-on: clay-host
    timeout-minutes: 30
    env:
      F2_SANDBOX_ROOT: /var/tmp/frankenstein2-sandboxes
      F2_SANDBOX_MIN_FREE_KIB: '5242880'
      F2_SANDBOX_MIN_MEM_KIB: '1048576'
      CLAY_HOST_ADMIN: /usr/local/sbin/clay-host-admin
      CLAY_HOST_ADMIN_SHA256: 064b1b775840aa270a9c61b672db5814d83b403dbf2e26abb270ed3ab103c5f4
      F2_NSPAWN_PREPARE_SHA256: d5dd0f2e9d7d476ae6537d8810b67b5930bab177cce999d364b64fb3bfafc472
      F2_NSPAWN_RUNNER_SHA256: 50d275e0c96e3d7e318918c9e890ce5a5c3e2d32a74b9fe5d0fcd32a729cdf24
    steps:
      - name: Checkout exact workflow subject
        uses: actions/checkout@v4

      - name: Verify exact VPS runner identity
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '%s\n' \
            "RUNNER_NAME=${RUNNER_NAME:-UNKNOWN}" \
            "RUNNER_OS=${RUNNER_OS:-UNKNOWN}" \
            "RUNNER_ARCH=${RUNNER_ARCH:-UNKNOWN}" \
            "GITHUB_SHA=$GITHUB_SHA" \
            "GITHUB_RUN_ID=$GITHUB_RUN_ID" \
            "GITHUB_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
          test "${RUNNER_NAME:-}" = "vps-clay-host"
          test "${RUNNER_OS:-}" = "Linux"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Verify admitted host-admin S2 ABI
        shell: bash
        run: |
          set -Eeuo pipefail
          test -x "$CLAY_HOST_ADMIN"
          test "$(sha256sum "$CLAY_HOST_ADMIN" | awk '{print $1}')" = "$CLAY_HOST_ADMIN_SHA256"
          test "$(sha256sum tools/vps_sandbox/host_prepare_ubuntu_nspawn.sh | awk '{print $1}')" = "$F2_NSPAWN_PREPARE_SHA256"
          test "$(sha256sum tools/vps_sandbox/run_ubuntu_sandbox.sh | awk '{print $1}')" = "$F2_NSPAWN_RUNNER_SHA256"
          sudo -n "$CLAY_HOST_ADMIN" sandbox prepare "$PWD/tools/vps_sandbox/host_prepare_ubuntu_nspawn.sh"

      - name: Record exact packet recovery subject
        shell: bash
        run: |
          set -Eeuo pipefail
          git rev-parse HEAD
          sha256sum \
            src/frankenstein2/voice_packet_cortex.py \
            src/frankenstein2/voice_packet_cortex_recovery.py \
            tests/test_voice_packet_cortex.py \
            tests/test_voice_packet_cortex_recovery.py \
            research/local_voice/tools/falsify_voice_packet_cortex.py \
            research/local_voice/tools/falsify_voice_packet_cortex_recovery_bounds.py \
            research/local_voice/tools/falsify_voice_packet_cortex_atomicity.py \
            trigger4/tools/local_voice/fdx_s2_persistence_restart.py

      - name: Host-health and isolation preflight
        shell: bash
        run: bash tools/vps_sandbox/preflight.sh | tee /tmp/t4-fd-preflight.txt

      - name: Execute packet recovery subject in admitted S2 Ubuntu sandbox
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n "$CLAY_HOST_ADMIN" sandbox run "$PWD/tools/vps_sandbox/run_ubuntu_sandbox.sh" \
            --backend nspawn --network off --source-root "$PWD" -- \
            /bin/bash -lc '
              set -u
              PYTHONPATH=src python3 -m unittest discover -s tests -p "test_voice_packet_cortex.py" -v > /tmp/t4-fd-packet-tests.log 2>&1
              packet_tests_status=$?
              PYTHONPATH=src python3 -m unittest discover -s tests -p "test_voice_packet_cortex_recovery.py" -v > /tmp/t4-fd-recovery-tests.log 2>&1
              recovery_tests_status=$?
              PYTHONPATH=src python3 research/local_voice/tools/falsify_voice_packet_cortex.py > /tmp/t4-fd-probe.json 2>&1
              packet_probe_status=$?
              PYTHONPATH=src python3 research/local_voice/tools/falsify_voice_packet_cortex_recovery_bounds.py > /tmp/t4-fd-recovery-bounds.json 2>&1
              recovery_bounds_status=$?
              PYTHONPATH=src python3 research/local_voice/tools/falsify_voice_packet_cortex_atomicity.py > /tmp/t4-fd-atomicity.json 2>&1
              atomicity_status=$?
              cat /tmp/t4-fd-packet-tests.log
              cat /tmp/t4-fd-recovery-tests.log
              cat /tmp/t4-fd-probe.json
              cat /tmp/t4-fd-recovery-bounds.json
              cat /tmp/t4-fd-atomicity.json
              printf "PACKET_TESTS_EXIT=%s\n" "$packet_tests_status"
              printf "RECOVERY_TESTS_EXIT=%s\n" "$recovery_tests_status"
              printf "PACKET_PROBE_EXIT=%s\n" "$packet_probe_status"
              printf "RECOVERY_BOUNDS_EXIT=%s\n" "$recovery_bounds_status"
              printf "ATOMICITY_EXIT=%s\n" "$atomicity_status"
              exit 0
            ' | tee /tmp/t4-fd-sandbox.txt

      - name: Execute canonical FDX7 and FDX8 persistence-restart discriminator in S2
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n "$CLAY_HOST_ADMIN" sandbox run "$PWD/tools/vps_sandbox/run_ubuntu_sandbox.sh" \
            --backend nspawn --network off --source-root "$PWD" -- \
            /bin/bash -lc '
              set -u
              export F2_SUBJECT_SHA="$1"
              PYTHONPATH=src python3 trigger4/tools/local_voice/fdx_s2_persistence_restart.py
              printf "FDX78_EXIT=%s\n" "$?"
              exit 0
            ' _ "$GITHUB_SHA" | tee /tmp/t4-fdx78-s2-sandbox.txt

      - name: Emit bounded execution receipt
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64, json, os, pathlib, re

          sandbox = pathlib.Path('/tmp/t4-fd-sandbox.txt').read_text(errors='replace') if pathlib.Path('/tmp/t4-fd-sandbox.txt').exists() else ''
          fdx78_sandbox = pathlib.Path('/tmp/t4-fdx78-s2-sandbox.txt').read_text(errors='replace') if pathlib.Path('/tmp/t4-fdx78-s2-sandbox.txt').exists() else ''
          preflight = pathlib.Path('/tmp/t4-fd-preflight.txt').read_text(errors='replace') if pathlib.Path('/tmp/t4-fd-preflight.txt').exists() else ''

          def parse_probe(schema):
              for line in sandbox.splitlines():
                  if line.startswith('{') and schema in line:
                      try:
                          return json.loads(line)
                      except json.JSONDecodeError:
                          return None
              return None

          def parse_status(name, text=sandbox):
              match = re.search(rf'^{re.escape(name)}=(\d+)$', text, re.MULTILINE)
              return int(match.group(1)) if match else None

          def parse_fdx78_receipt():
              match = re.search(r'^T4_FDX_S2_RECEIPT_B64=([A-Za-z0-9+/=]+)$', fdx78_sandbox, re.MULTILINE)
              if not match:
                  return None
              try:
                  return json.loads(base64.b64decode(match.group(1)).decode('utf-8'))
              except Exception:
                  return None

          packet_probe = parse_probe('F2_PACKET_CORTEX_FULL_DUPLEX_FALSIFIER/v1')
          recovery_bounds_probe = parse_probe('F2_PACKET_CORTEX_RECOVERY_BOUNDS_FALSIFIER/v1')
          atomicity_probe = parse_probe('F2_PACKET_CORTEX_ATOMICITY_FALSIFIER/v1')
          fdx78_receipt = parse_fdx78_receipt()
          statuses = {
              'packet_tests': parse_status('PACKET_TESTS_EXIT'),
              'recovery_tests': parse_status('RECOVERY_TESTS_EXIT'),
              'packet_probe': parse_status('PACKET_PROBE_EXIT'),
              'recovery_bounds': parse_status('RECOVERY_BOUNDS_EXIT'),
              'atomicity': parse_status('ATOMICITY_EXIT'),
              'fdx78_s2': parse_status('FDX78_EXIT', fdx78_sandbox),
          }
          sandbox_executed = 'F2_SANDBOX_RESULT=PASS' in sandbox
          fdx78_s2_executed = 'F2_SANDBOX_RESULT=PASS' in fdx78_sandbox
          exact_fdx_subject = (
              isinstance(fdx78_receipt, dict)
              and isinstance(fdx78_receipt.get('source'), dict)
              and fdx78_receipt['source'].get('f2_subject_sha') == os.environ.get('GITHUB_SHA')
          )
          complete = (
              sandbox_executed
              and fdx78_s2_executed
              and packet_probe is not None
              and recovery_bounds_probe is not None
              and atomicity_probe is not None
              and fdx78_receipt is not None
              and exact_fdx_subject
              and all(value is not None for value in statuses.values())
          )

          if not complete:
              result = 'EVIDENCE_INVALID'
              failure_class = 'EVIDENCE_INVALID'
          elif any(value not in (0, 1, 2) for value in statuses.values()):
              result = 'INFRA_AUTH_TRANSPORT_QUOTA'
              failure_class = 'INFRA_AUTH_TRANSPORT_QUOTA'
          elif (
              statuses['packet_tests'] != 0
              or statuses['recovery_tests'] != 0
              or packet_probe.get('result') == 'PRODUCT_NEGATIVE'
              or recovery_bounds_probe.get('result') == 'PRODUCT_NEGATIVE'
              or atomicity_probe.get('result') == 'PRODUCT_NEGATIVE'
          ):
              result = 'EXECUTED_PRODUCT_NEGATIVE'
              failure_class = 'PRODUCT_NEGATIVE'
          elif statuses['fdx78_s2'] != 0 or fdx78_receipt.get('result') not in ('PASS', 'EXECUTED_NO_COUNTEREXAMPLE', 'NO_COUNTEREXAMPLE'):
              result = 'EVIDENCE_INVALID_REQUIRES_FDX78_TRIAGE'
              failure_class = 'EVIDENCE_INVALID'
          elif (
              packet_probe.get('result') == 'PASS'
              and recovery_bounds_probe.get('result') == 'PASS'
              and atomicity_probe.get('result') == 'PASS'
              and fdx78_receipt.get('result') in ('PASS', 'EXECUTED_NO_COUNTEREXAMPLE', 'NO_COUNTEREXAMPLE')
          ):
              result = 'EXECUTED_NO_COUNTEREXAMPLE'
              failure_class = None
          else:
              result = 'EVIDENCE_INVALID'
              failure_class = 'EVIDENCE_INVALID'

          receipt = {
              'schema': 'F2_T4_PACKET_CORTEX_FULL_DUPLEX_FALSIFIER_RECEIPT/v5',
              'result': result,
              'failure_class': failure_class,
              'source_sha': os.environ.get('GITHUB_SHA'),
              'workflow_run_id': int(os.environ.get('GITHUB_RUN_ID', '0')),
              'workflow_run_attempt': int(os.environ.get('GITHUB_RUN_ATTEMPT', '0')),
              'runner_name': os.environ.get('RUNNER_NAME', 'UNKNOWN'),
              'runner_os': os.environ.get('RUNNER_OS', 'UNKNOWN'),
              'runner_arch': os.environ.get('RUNNER_ARCH', 'UNKNOWN'),
              'execution_surface': 'VPS_SANDBOX_REPRESENTABLE',
              'sandbox_tier': 'S2_NSPAWN_VIA_ADMITTED_CLAY_HOST_ADMIN_ABI',
              'network_mode': 'OFF',
              'semantic_key': 'af4da01da7ced3fa0bee3839adf7f4798e73399408fd29735c8a529a2ed2d9d9',
              'executed_scope': [
                  'voice_packet_cortex',
                  'voice_packet_cortex_recovery',
                  'packet_repository_suite',
                  'recovery_repository_suite',
                  'PN9_RESTART_CONTINUATION',
                  'PN10_SOURCE_BOUND_CAPS',
                  'PN14_TOOL_ONLY_BARGE_OWNERSHIP',
                  'PN15_REJECTED_NEAR_CAP_BARGE_ATOMICITY',
                  'EVENTSEQ_REJECT_ATOMICITY',
                  'FDX7_S2_PERSISTENCE_RESTART_IDENTITY',
                  'FDX8_S2_CLOSED_SESSION_RESTART_EXACT_ONCE',
              ],
              'step_statuses': statuses,
              'packet_probe': packet_probe,
              'recovery_bounds_probe': recovery_bounds_probe,
              'atomicity_probe': atomicity_probe,
              'fdx78_s2_receipt': fdx78_receipt,
              'preflight_log': preflight,
              'sandbox_log': sandbox,
              'fdx78_s2_sandbox_log': fdx78_sandbox,
              'outbound_model_asr_tts_calls': 0,
              'vps_sandbox_component_execution_observed': result in ('EXECUTED_NO_COUNTEREXAMPLE', 'EXECUTED_PRODUCT_NEGATIVE'),
              'acoustic_credit': 0,
              'target_runtime_credit': 0,
              'physical_device_credit': 0,
              'gwt_jspace_credit': 0,
              'effect_credit': 0,
              'training_credit': 0,
              'whole_voice_e2e_credit': 0,
              'whole_product_credit': 0,
          }
          pathlib.Path('/tmp/t4-fd-receipt.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print(json.dumps(receipt, sort_keys=True))
          if not complete:
              raise SystemExit(3)
          PY

      - name: Upload falsifier receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t4-packet-cortex-full-duplex-falsifier-${{ github.run_id }}
          path: /tmp/t4-fd-receipt.json
          if-no-files-found: error

      - name: Enforce executed sandbox boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -q '^F2_SANDBOX_RESULT=PASS$' /tmp/t4-fd-sandbox.txt
          grep -q '^PACKET_TESTS_EXIT=' /tmp/t4-fd-sandbox.txt
          grep -q '^RECOVERY_TESTS_EXIT=' /tmp/t4-fd-sandbox.txt
          grep -q '^PACKET_PROBE_EXIT=' /tmp/t4-fd-sandbox.txt
          grep -q '^RECOVERY_BOUNDS_EXIT=' /tmp/t4-fd-sandbox.txt
          grep -q '^ATOMICITY_EXIT=' /tmp/t4-fd-sandbox.txt
          grep -q '^F2_SANDBOX_RESULT=PASS$' /tmp/t4-fdx78-s2-sandbox.txt
          grep -q '^FDX78_EXIT=0$' /tmp/t4-fdx78-s2-sandbox.txt
          grep -q '^T4_FDX_S2_RECEIPT_B64=' /tmp/t4-fdx78-s2-sandbox.txt
