name: REVIEW WP510 G2 Detached Envelope Integration Falsifier

on:
  pull_request:
    paths:
      - 'tests/test_wp510_g2_detached_envelope_integration_falsifier.py'
      - '.github/workflows/review-wp510-g2-detached-envelope-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  falsifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile exact WP510 dependency surface and falsifier
        run: python -m py_compile src/frankenstein2/grid10_interface.py src/frankenstein2/gwt_workspace.py src/frankenstein2/gwt_uptake.py src/frankenstein2/gwt_reentry_provenance.py src/frankenstein2/gwt_reentry_uptake_binding.py src/frankenstein2/gwt_causal_path.py tests/test_gwt_causal_path.py tests/test_wp510_g2_detached_envelope_integration_falsifier.py
      - name: Detached-envelope integration falsifier
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_wp510_g2_detached_envelope_integration_falsifier.py
