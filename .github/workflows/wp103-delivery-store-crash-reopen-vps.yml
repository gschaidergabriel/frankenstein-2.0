name: WP103 Delivery Store Exact-Subject VPS Runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wp103-delivery-store-crash-reopen-vps.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-wp103-delivery-store-vps:
    runs-on: clay-host
    timeout-minutes: 20
    env:
      WP103_SUBJECT: 27919512c51b3b403869c35b8ff1ce77ae5c16fc
      WP103_SOURCE_BLOB: 5a30d2216e933c2ec653bfdd92fd885cc3409608
      WP103_TEST_BLOB: 36f9af2f3c2d175fbe2b21cb5281e1144cfae0d4
      F2_SANDBOX_ROOT: /var/tmp/frankenstein2-sandboxes
      F2_SANDBOX_MIN_FREE_KIB: '5242880'
      F2_SANDBOX_MIN_MEM_KIB: '1048576'
    steps:
      - name: Checkout exact accepted WP103 subject
        uses: actions/checkout@v4
        with:
          ref: 27919512c51b3b403869c35b8ff1ce77ae5c16fc
          persist-credentials: false

      - name: Verify exact runner and subject identities
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${RUNNER_NAME:-}" = "vps-clay-host"
          test "${RUNNER_OS:-}" = "Linux"
          test "$(git rev-parse HEAD)" = "$WP103_SUBJECT"
          test "$(git rev-parse HEAD:src/state/delivery_store.py)" = "$WP103_SOURCE_BLOB"
          test "$(git rev-parse HEAD:tests/test_delivery_store.py)" = "$WP103_TEST_BLOB"
          printf '%s\n' \
            "RUNNER_NAME=${RUNNER_NAME:-UNKNOWN}" \
            "RUNNER_OS=${RUNNER_OS:-UNKNOWN}" \
            "RUNNER_ARCH=${RUNNER_ARCH:-UNKNOWN}" \
            "CONTROLLER_SHA=$GITHUB_SHA" \
            "SOURCE_SHA=$(git rev-parse HEAD)" \
            "GITHUB_RUN_ID=$GITHUB_RUN_ID" \
            "GITHUB_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT" | tee /tmp/wp103-identity.txt

      - name: VPS sandbox preflight
        shell: bash
        run: bash tools/vps_sandbox/preflight.sh | tee /tmp/wp103-preflight.txt

      - name: Execute complete delivery-store regression in disposable Ubuntu sandbox
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tools/vps_sandbox/run_ubuntu_sandbox.sh --backend auto --network off -- \
            /bin/bash -lc '
              set +e
              PYTHONPATH=src python3 -m unittest discover -s tests -p "test_delivery_store.py" -v > /tmp/wp103-tests.log 2>&1
              status=$?
              set -e
              cat /tmp/wp103-tests.log
              printf "WP103_TEST_EXIT=%s\n" "$status"
              exit 0
            ' | tee /tmp/wp103-sandbox.txt

      - name: Emit exact bounded receipt
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path

          def git(*args):
              try:
                  return subprocess.check_output(['git', *args], text=True).strip()
              except Exception:
                  return None

          sandbox_path = Path('/tmp/wp103-sandbox.txt')
          preflight_path = Path('/tmp/wp103-preflight.txt')
          identity_path = Path('/tmp/wp103-identity.txt')
          sandbox = sandbox_path.read_text(errors='replace') if sandbox_path.exists() else ''
          preflight = preflight_path.read_text(errors='replace') if preflight_path.exists() else ''
          identity = identity_path.read_text(errors='replace') if identity_path.exists() else ''
          m = re.search(r'^WP103_TEST_EXIT=(\d+)$', sandbox, re.MULTILINE)
          test_exit = int(m.group(1)) if m else None
          source_sha = git('rev-parse', 'HEAD')
          source_blob = git('rev-parse', 'HEAD:src/state/delivery_store.py')
          test_blob = git('rev-parse', 'HEAD:tests/test_delivery_store.py')
          runner_ok = os.environ.get('RUNNER_NAME') == 'vps-clay-host' and os.environ.get('RUNNER_OS') == 'Linux'
          subject_ok = source_sha == os.environ['WP103_SUBJECT'] and source_blob == os.environ['WP103_SOURCE_BLOB'] and test_blob == os.environ['WP103_TEST_BLOB']
          sandbox_executed = 'F2_SANDBOX_RESULT=PASS' in sandbox and test_exit is not None
          if not runner_ok:
              result, failure = 'INFRA_AUTH_TRANSPORT_QUOTA', 'INFRA_AUTH_TRANSPORT_QUOTA'
          elif not subject_ok:
              result, failure = 'EVIDENCE_INVALID', 'EVIDENCE_INVALID'
          elif not sandbox_executed:
              result, failure = 'INFRA_AUTH_TRANSPORT_QUOTA', 'INFRA_AUTH_TRANSPORT_QUOTA'
          elif test_exit != 0:
              result, failure = 'EXECUTED_PRODUCT_NEGATIVE', 'PRODUCT_NEGATIVE'
          else:
              result, failure = 'EXECUTED_NO_COUNTEREXAMPLE', None
          promoted = int(result == 'EXECUTED_NO_COUNTEREXAMPLE')
          receipt = {
              'schema': 'F2_WP103_G4_TARGET_ENVIRONMENT_COMPONENT_RUNTIME_RECEIPT/v1',
              'workpackage_id': 'F2-WP-103',
              'generation': 4,
              'claim_id': 'F2-WP-103-G4-GPT56SOL-OWNER-VPS-PROCESS-EXIT-RUNTIME-20260902',
              'result': result,
              'failure_class': failure,
              'controller_sha': os.environ.get('GITHUB_SHA'),
              'workflow_run_id': int(os.environ.get('GITHUB_RUN_ID', '0')),
              'workflow_run_attempt': int(os.environ.get('GITHUB_RUN_ATTEMPT', '0')),
              'runner_name': os.environ.get('RUNNER_NAME', 'UNKNOWN'),
              'runner_os': os.environ.get('RUNNER_OS', 'UNKNOWN'),
              'runner_arch': os.environ.get('RUNNER_ARCH', 'UNKNOWN'),
              'exact_source_sha': source_sha,
              'delivery_store_blob_sha': source_blob,
              'delivery_store_test_blob_sha': test_blob,
              'execution_surface': 'OWNER_VPS_DISPOSABLE_UBUNTU_SANDBOX',
              'network_mode': 'OFF',
              'test_exit': test_exit,
              'runtime_execution_observed': bool(sandbox_executed),
              'repository_component_ci_credit': 1,
              'target_environment_component_runtime_credit': promoted,
              'wp103_process_exit_target_runtime_credit': promoted,
              'vps_runtime_credit': 0,
              'physical_host_credit': 0,
              'physical_grid10_credit': 0,
              'gwt_runtime_credit': 0,
              'semantic_gwt_runtime_credit': 0,
              'jspace_runtime_credit': 0,
              'effect_credit': 0,
              'training_credit': 0,
              'completion_credit': 0,
              'whole_system_acceptance': False,
              'identity_log': identity,
              'preflight_log': preflight,
              'sandbox_log': sandbox
          }
          Path('/tmp/wp103-g4-runtime-receipt.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print(json.dumps(receipt, sort_keys=True))
          PY

      - name: Upload bounded runtime receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp103-g4-target-runtime-${{ github.run_id }}
          path: /tmp/wp103-g4-runtime-receipt.json
          if-no-files-found: error

      - name: Enforce bounded discriminator
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('/tmp/wp103-g4-runtime-receipt.json')
          if not p.exists():
              raise SystemExit('WP103_G4_RECEIPT_MISSING')
          r = json.loads(p.read_text())
          if r.get('result') != 'EXECUTED_NO_COUNTEREXAMPLE':
              raise SystemExit(f"WP103_G4_NOT_PASS:{r.get('result')}:{r.get('failure_class')}")
          print('WP103_G4_TARGET_COMPONENT_RUNTIME_PASS')
          PY
