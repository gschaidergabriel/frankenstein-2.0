# Trigger4 controller-only runtime promotion for frozen WP103 subject.
name: WP103 Delivery Store Crash Reopen Exact-Subject VPS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wp103-delivery-store-crash-reopen-vps.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-delivery-store-crash-reopen-sandbox:
    runs-on: clay-host
    timeout-minutes: 20
    env:
      WP103_ACCEPTED_SUBJECT: 27919512c51b3b403869c35b8ff1ce77ae5c16fc
      WP103_DELIVERY_STORE_BLOB: 5a30d2216e933c2ec653bfdd92fd885cc3409608
      WP103_TEST_BLOB: 36f9af2f3c2d175fbe2b21cb5281e1144cfae0d4
      F2_SANDBOX_ROOT: /var/tmp/frankenstein2-sandboxes
      F2_SANDBOX_MIN_FREE_KIB: '5242880'
      F2_SANDBOX_MIN_MEM_KIB: '1048576'
    steps:
      - name: Checkout exact frozen WP103 subject
        uses: actions/checkout@v4
        with:
          ref: 27919512c51b3b403869c35b8ff1ce77ae5c16fc
          persist-credentials: false

      - name: Verify runner subject and component identities
        shell: bash
        run: |
          set -Eeuo pipefail
          source_sha="$(git rev-parse HEAD)"
          source_blob="$(git rev-parse HEAD:src/state/delivery_store.py)"
          test_blob="$(git rev-parse HEAD:tests/test_delivery_store.py)"
          printf '%s\n' \
            "RUNNER_NAME=${RUNNER_NAME:-UNKNOWN}" \
            "RUNNER_OS=${RUNNER_OS:-UNKNOWN}" \
            "RUNNER_ARCH=${RUNNER_ARCH:-UNKNOWN}" \
            "CONTROLLER_SHA=$GITHUB_SHA" \
            "SOURCE_SHA=$source_sha" \
            "DELIVERY_STORE_BLOB=$source_blob" \
            "DELIVERY_STORE_TEST_BLOB=$test_blob" \
            "GITHUB_RUN_ID=$GITHUB_RUN_ID" \
            "GITHUB_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
          test "${RUNNER_NAME:-}" = "vps-clay-host"
          test "${RUNNER_OS:-}" = "Linux"
          test "$source_sha" = "$WP103_ACCEPTED_SUBJECT"
          test "$source_blob" = "$WP103_DELIVERY_STORE_BLOB"
          test "$test_blob" = "$WP103_TEST_BLOB"
          test -f tools/vps_sandbox/preflight.sh
          test -f tools/vps_sandbox/run_ubuntu_sandbox.sh

      - name: Host-health and isolation preflight
        shell: bash
        run: bash tools/vps_sandbox/preflight.sh | tee /tmp/wp103-preflight.txt

      - name: Execute complete WP103 delivery-store regressions in network-off VPS sandbox
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tools/vps_sandbox/run_ubuntu_sandbox.sh --backend auto --network off -- \
            /bin/bash -lc '
              set +e
              PYTHONPATH=src python3 -m unittest discover -s tests -p "test_delivery_store.py" -v > /tmp/wp103-delivery-store.log 2>&1
              test_status=$?
              set -e
              cat /tmp/wp103-delivery-store.log
              printf "WP103_DELIVERY_STORE_EXIT=%s\n" "$test_status"
              exit 0
            ' | tee /tmp/wp103-sandbox.txt

      - name: Emit bounded runtime receipt
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          expected_subject = os.environ['WP103_ACCEPTED_SUBJECT']
          expected_source_blob = os.environ['WP103_DELIVERY_STORE_BLOB']
          expected_test_blob = os.environ['WP103_TEST_BLOB']

          def git(*args):
              try:
                  return subprocess.check_output(['git', *args], text=True).strip()
              except Exception:
                  return None

          def sha256_file(path):
              p = Path(path)
              return hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None

          sandbox_path = Path('/tmp/wp103-sandbox.txt')
          preflight_path = Path('/tmp/wp103-preflight.txt')
          sandbox = sandbox_path.read_text(errors='replace') if sandbox_path.exists() else ''
          preflight = preflight_path.read_text(errors='replace') if preflight_path.exists() else ''
          match = re.search(r'^WP103_DELIVERY_STORE_EXIT=(\d+)$', sandbox, re.MULTILINE)
          test_exit = int(match.group(1)) if match else None

          source_sha = git('rev-parse', 'HEAD')
          source_blob = git('rev-parse', 'HEAD:src/state/delivery_store.py')
          test_blob = git('rev-parse', 'HEAD:tests/test_delivery_store.py')
          runner_valid = os.environ.get('RUNNER_NAME') == 'vps-clay-host' and os.environ.get('RUNNER_OS') == 'Linux'
          subject_valid = (
              source_sha == expected_subject
              and source_blob == expected_source_blob
              and test_blob == expected_test_blob
          )
          sandbox_executed = 'F2_SANDBOX_RESULT=PASS' in sandbox and test_exit is not None

          if not runner_valid:
              result = 'INFRA_AUTH_TRANSPORT_QUOTA'
              failure_class = 'INFRA_AUTH_TRANSPORT_QUOTA'
          elif not subject_valid:
              result = 'EVIDENCE_INVALID'
              failure_class = 'EVIDENCE_INVALID'
          elif not sandbox_executed:
              result = 'INFRA_AUTH_TRANSPORT_QUOTA'
              failure_class = 'INFRA_AUTH_TRANSPORT_QUOTA'
          elif test_exit != 0:
              result = 'EXECUTED_PRODUCT_NEGATIVE'
              failure_class = 'PRODUCT_NEGATIVE'
          else:
              result = 'EXECUTED_NO_COUNTEREXAMPLE'
              failure_class = None

          promoted = int(result == 'EXECUTED_NO_COUNTEREXAMPLE')
          receipt = {
              'schema': 'F2_WP103_DELIVERY_STORE_CRASH_REOPEN_VPS_RECEIPT/v1',
              'workpackage_id': 'F2-WP-103',
              'generation': 3,
              'claim_id': 'F2-WP-103-G3-GPT56SOL-OWNER-VPS-CRASH-REOPEN-RUNTIME-20260902',
              'result': result,
              'failure_class': failure_class,
              'repository_subject_sha': expected_subject,
              'source_sha': source_sha,
              'controller_sha': os.environ.get('GITHUB_SHA'),
              'workflow_run_id': int(os.environ.get('GITHUB_RUN_ID', '0')),
              'workflow_run_attempt': int(os.environ.get('GITHUB_RUN_ATTEMPT', '0')),
              'runner_name': os.environ.get('RUNNER_NAME', 'UNKNOWN'),
              'runner_os': os.environ.get('RUNNER_OS', 'UNKNOWN'),
              'runner_arch': os.environ.get('RUNNER_ARCH', 'UNKNOWN'),
              'execution_surface': 'OWNER_VPS_DISPOSABLE_UBUNTU_SANDBOX',
              'sandbox_tier': 'S1_OR_S2_AUTO',
              'network_mode': 'OFF',
              'source_git_blob_sha': source_blob,
              'test_git_blob_sha': test_blob,
              'source_sha256': sha256_file('src/state/delivery_store.py'),
              'test_sha256': sha256_file('tests/test_delivery_store.py'),
              'delivery_store_test_exit': test_exit,
              'preflight_log': preflight,
              'sandbox_log': sandbox,
              'runtime_execution_observed': bool(sandbox_executed),
              'repository_component_ci_credit': 1,
              'target_environment_component_runtime_credit': promoted,
              'wp103_delivery_store_crash_reopen_target_runtime_credit': promoted,
              'power_loss_credit': 0,
              'storage_controller_credit': 0,
              'host_reboot_credit': 0,
              'vps_runtime_credit': 0,
              'physical_host_credit': 0,
              'physical_grid10_credit': 0,
              'gwt_runtime_credit': 0,
              'semantic_gwt_runtime_credit': 0,
              'jspace_runtime_credit': 0,
              'effect_credit': 0,
              'training_credit': 0,
              'completion_credit': 0,
              'whole_system_acceptance': False,
          }
          Path('/tmp/wp103-runtime-receipt.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print(json.dumps(receipt, sort_keys=True))
          PY

      - name: Upload bounded runtime receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp103-delivery-store-crash-reopen-vps-${{ github.run_id }}
          path: /tmp/wp103-runtime-receipt.json
          if-no-files-found: error

      - name: Enforce bounded runtime discriminator result
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('/tmp/wp103-runtime-receipt.json')
          if not path.exists():
              raise SystemExit('WP103_RUNTIME_RECEIPT_MISSING')
          receipt = json.loads(path.read_text())
          if receipt.get('result') != 'EXECUTED_NO_COUNTEREXAMPLE':
              raise SystemExit(f"WP103_RUNTIME_DISCRIMINATOR_NOT_PASS:{receipt.get('result')}:{receipt.get('failure_class')}")
          print('WP103_BOUNDED_TARGET_COMPONENT_RUNTIME_PASS')
          PY
