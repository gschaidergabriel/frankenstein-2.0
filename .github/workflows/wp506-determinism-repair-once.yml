name: F2 WP506 Determinism Repair Once

on:
  push:
    branches:
      - 'trigger4/wp506-gwt-selection-broadcast-20260829'
    paths:
      - '.github/workflows/wp506-determinism-repair-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'trigger4/wp506-gwt-selection-broadcast-20260829'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Canonicalize source-candidate ordering
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/frankenstein2/gwt_workspace.py')
          source = path.read_text()
          old = '''    normalized_grid_plan_sha256 = _sha256("grid_plan_sha256", grid_plan_sha256)\n    _validate_candidate_origins(\n        candidates,\n        grid_plan_id=normalized_grid_plan_id,\n        grid_plan_generation=normalized_grid_plan_generation,\n        grid_plan_sha256=normalized_grid_plan_sha256,\n    )\n    selected, deferred = _rank_candidates(policy, candidates)\n'''
          new = '''    normalized_grid_plan_sha256 = _sha256("grid_plan_sha256", grid_plan_sha256)\n    canonical_candidates = tuple(sorted(candidates, key=lambda item: item.candidate_id))\n    _validate_candidate_origins(\n        canonical_candidates,\n        grid_plan_id=normalized_grid_plan_id,\n        grid_plan_generation=normalized_grid_plan_generation,\n        grid_plan_sha256=normalized_grid_plan_sha256,\n    )\n    selected, deferred = _rank_candidates(policy, canonical_candidates)\n'''
          if source.count(old) != 1:
              raise SystemExit('expected WP506 candidate-validation block not found exactly once')
          source = source.replace(old, new, 1)
          old_tail = '        source_candidates=candidates,\n'
          new_tail = '        source_candidates=canonical_candidates,\n'
          if source.count(old_tail) != 1:
              raise SystemExit('expected WP506 source_candidates assignment not found exactly once')
          path.write_text(source.replace(old_tail, new_tail, 1))
          PY
      - name: Compile
        run: python -m py_compile src/frankenstein2/gwt_workspace.py tests/test_gwt_workspace.py
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run full WP506 suite
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_gwt_workspace.py
      - name: Commit exact repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/frankenstein2/gwt_workspace.py
          git commit -m 'trigger4: canonicalize WP506 source candidate ordering'
          git push origin HEAD:trigger4/wp506-gwt-selection-broadcast-20260829
