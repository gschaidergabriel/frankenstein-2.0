name: WP901 G4 persisted parent repair CI

on:
  pull_request:
    paths:
      - 'src/frankenstein2/restart_recovery_persisted_row_attestation.py'
      - 'tests/test_wp901_g4_persisted_parent_column.py'
      - 'tests/test_restart_recovery_persisted_row_attestation.py'
      - 'src/frankenstein2/restart_recovery_source_authentication.py'
      - 'tests/test_wp901_g4_previous_checkpoint_lineage.py'
      - '.github/workflows/wp901-g4-persisted-parent-repair-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'src/frankenstein2/restart_recovery_persisted_row_attestation.py'
      - 'tests/test_wp901_g4_persisted_parent_column.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  close-pr715-persisted-parent-gap:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact workflow ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Compile repaired G4 and inherited boundaries
        run: >-
          python -m py_compile
          src/frankenstein2/restart_recovery_continuation.py
          src/frankenstein2/restart_recovery_source_authentication.py
          src/frankenstein2/restart_recovery_persisted_row_attestation.py
          tests/test_restart_recovery_continuation.py
          tests/test_restart_recovery_source_authentication.py
          tests/test_wp901_g4_previous_checkpoint_lineage.py
          tests/test_restart_recovery_persisted_row_attestation.py
          tests/test_wp901_g4_persisted_parent_column.py
      - name: Run G2 G3 G4 plus promoted PR715 regression
        env:
          PYTHONPATH: src:.
        run: >-
          python -m unittest -v
          tests.test_restart_recovery_continuation
          tests.test_restart_recovery_source_authentication
          tests.test_wp901_g4_previous_checkpoint_lineage
          tests.test_restart_recovery_persisted_row_attestation
          tests.test_wp901_g4_persisted_parent_column
      - name: Evidence scope fence
        run: |
          echo 'scope=WP901_G4_REPOSITORY_COMPONENT_ONLY'
          echo 'pr715_counterexample_expected=REJECTED'
          echo 'target_runtime_credit=0'
          echo 'whole_system_acceptance=false'
