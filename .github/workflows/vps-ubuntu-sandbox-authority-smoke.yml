name: F2 VPS Ubuntu Sandbox Authority Smoke

on:
  push:
    branches: [main]
    paths:
      - 'tools/vps_sandbox/**'
      - 'workpackages/VPS_SANDBOX_EXECUTION_AUTHORITY.md'
      - 'WORKER_PROTOCOL.md'
      - '.github/workflows/vps-ubuntu-sandbox-authority-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-target-sandbox-smoke:
    # Current verified owner-VPS routing authority. Generic self-hosted is stale/forbidden.
    runs-on: clay-host
    timeout-minutes: 35
    env:
      F2_SANDBOX_ROOT: /var/tmp/frankenstein2-sandboxes
      F2_NSPAWN_BASE_ROOT: /var/lib/frankenstein2-sandbox-images/ubuntu-24.04-base
      F2_SANDBOX_MIN_FREE_KIB: '5242880'
      F2_SANDBOX_MIN_MEM_KIB: '1048576'
    steps:
      - name: Checkout exact workflow subject
        uses: actions/checkout@v4

      - name: Verify exact VPS runner identity
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '%s\n' \
            "RUNNER_NAME=${RUNNER_NAME:-UNKNOWN}" \
            "RUNNER_OS=${RUNNER_OS:-UNKNOWN}" \
            "RUNNER_ARCH=${RUNNER_ARCH:-UNKNOWN}" \
            "GITHUB_SHA=$GITHUB_SHA" \
            "GITHUB_RUN_ID=$GITHUB_RUN_ID" \
            "GITHUB_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
          test "${RUNNER_NAME:-}" = "vps-clay-host"
          test "${RUNNER_OS:-}" = "Linux"

      - name: Static safety/syntax gate
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n tools/vps_sandbox/preflight.sh
          bash -n tools/vps_sandbox/host_prepare_ubuntu_nspawn.sh
          bash -n tools/vps_sandbox/run_ubuntu_sandbox.sh
          grep -q 'VPS SANDBOX FIRST' WORKER_PROTOCOL.md
          grep -q 'PHYSICAL_LOCAL_ONLY' workpackages/VPS_SANDBOX_EXECUTION_AUTHORITY.md

      - name: Prepare reusable Ubuntu 24.04 nspawn base
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tools/vps_sandbox/host_prepare_ubuntu_nspawn.sh

      - name: Host-health and isolation preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tools/vps_sandbox/preflight.sh | tee /tmp/f2-sandbox-preflight.txt

      - name: Destructive-in-sandbox Ubuntu smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tools/vps_sandbox/run_ubuntu_sandbox.sh --backend nspawn --network off -- \
            /bin/bash -lc '
              set -Eeuo pipefail
              . /etc/os-release
              test "$ID" = ubuntu
              test "$VERSION_ID" = 24.04
              test -d /work/f2
              test -d /f2-src
              test ! -w /f2-src
              mkdir -p /var/tmp/f2-destructive-smoke/a/b/c
              printf destructive-test > /var/tmp/f2-destructive-smoke/a/b/c/payload
              chmod 000 /var/tmp/f2-destructive-smoke/a/b/c/payload
              rm -rf /var/tmp/f2-destructive-smoke
              test ! -e /var/tmp/f2-destructive-smoke
              printf "SANDBOX_DESTRUCTIVE_MUTATION=PASS\\n"
            ' | tee /tmp/f2-sandbox-run.txt

      - name: Boot real systemd PID1 in disposable S2 clone
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tools/vps_sandbox/run_ubuntu_sandbox.sh --backend nspawn --network off --boot-systemd -- \
            /bin/bash -lc '
              set -Eeuo pipefail
              . /etc/os-release
              test "$ID" = ubuntu
              test "$VERSION_ID" = 24.04
              test "$(cat /proc/1/comm)" = systemd
              state="$(systemctl is-system-running 2>/dev/null || true)"
              case "$state" in
                running|degraded|starting|maintenance) ;;
                *) printf "unexpected-systemd-state=%s\\n" "$state" >&2; exit 81 ;;
              esac
              systemctl list-units --no-pager --no-legend >/dev/null
              test -d /work/f2
              test -d /f2-src
              test ! -w /f2-src
              printf "SANDBOX_SYSTEMD_PID1=PASS state=%s\\n" "$state"
            ' | tee /tmp/f2-sandbox-systemd-run.txt
          grep -q '^F2_SANDBOX_RESULT=PASS$' /tmp/f2-sandbox-systemd-run.txt
          grep -q '^systemd_boot=LIVE_PID1_MODE$' /tmp/f2-sandbox-systemd-run.txt
          grep -q 'SANDBOX_SYSTEMD_PID1=PASS' /tmp/f2-sandbox-systemd-run.txt

      - name: Emit bounded smoke receipt
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          def read(path):
              p = pathlib.Path(path)
              return p.read_text(errors='replace') if p.exists() else ''
          direct_log = read('/tmp/f2-sandbox-run.txt')
          systemd_log = read('/tmp/f2-sandbox-systemd-run.txt')
          direct_pass = 'F2_SANDBOX_RESULT=PASS' in direct_log
          systemd_pass = (
              'F2_SANDBOX_RESULT=PASS' in systemd_log
              and 'systemd_boot=LIVE_PID1_MODE' in systemd_log
              and 'SANDBOX_SYSTEMD_PID1=PASS' in systemd_log
          )
          result = 'PASS' if direct_pass and systemd_pass else 'FAIL'
          receipt = {
              'schema': 'F2_VPS_UBUNTU_SANDBOX_SMOKE/v2',
              'result': result,
              'source_sha': os.environ.get('GITHUB_SHA'),
              'workflow_run_id': int(os.environ.get('GITHUB_RUN_ID', '0')),
              'workflow_run_attempt': int(os.environ.get('GITHUB_RUN_ATTEMPT', '0')),
              'runner_name': os.environ.get('RUNNER_NAME', 'UNKNOWN'),
              'runner_os': os.environ.get('RUNNER_OS', 'UNKNOWN'),
              'runner_arch': os.environ.get('RUNNER_ARCH', 'UNKNOWN'),
              'target_userspace': 'Ubuntu 24.04 noble',
              'sandbox_tier': 'S2_NSPAWN',
              'checkout_mount': 'READ_ONLY',
              'sandbox_local_destructive_mutation': direct_pass,
              'systemd_pid1_boot_observed': systemd_pass,
              'host_survival_fence_observed': direct_pass and systemd_pass,
              'network_mode': 'PRIVATE_OFFLINE',
              'physical_local_credit': 0,
              'wp1202_target_twin_runtime_credit': 0,
              'whole_system_acceptance': False,
              'preflight_log': read('/tmp/f2-sandbox-preflight.txt'),
              'sandbox_log': direct_log,
              'systemd_sandbox_log': systemd_log,
              'evidence_boundary': 'S2 sandbox authority/systemd-PID1 prerequisite only; no WP1202 target-twin, physical-host, completion or whole-system promotion',
          }
          pathlib.Path('/tmp/f2-vps-ubuntu-sandbox-smoke.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print(json.dumps(receipt, sort_keys=True))
          PY

      - name: Upload sandbox receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f2-vps-ubuntu-sandbox-smoke-${{ github.run_id }}
          path: /tmp/f2-vps-ubuntu-sandbox-smoke.json
          if-no-files-found: warn

      - name: Enforce smoke success
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -q '^F2_SANDBOX_RESULT=PASS$' /tmp/f2-sandbox-run.txt
          grep -q '^F2_SANDBOX_RESULT=PASS$' /tmp/f2-sandbox-systemd-run.txt
          grep -q 'SANDBOX_SYSTEMD_PID1=PASS' /tmp/f2-sandbox-systemd-run.txt
