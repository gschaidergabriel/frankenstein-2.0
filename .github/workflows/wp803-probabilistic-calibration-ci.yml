name: WP803 probabilistic calibration candidate

on:
  pull_request:
    paths:
      - "src/frankenstein2/cognitive_world_model_probabilistic_scoring.py"
      - "tests/test_cognitive_world_model_probabilistic_scoring.py"
      - ".github/workflows/wp803-probabilistic-calibration-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run probabilistic scoring candidate tests
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_cognitive_world_model_probabilistic_scoring
