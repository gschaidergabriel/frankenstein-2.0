name: F2 WP801 Held-out Orientation CI

on:
  push:
    branches:
      - main
      - trigger4/wp801-g1-currenthead-repair-20260829
    paths:
      - 'src/frankenstein2/cognitive_microworld.py'
      - 'src/frankenstein2/cognitive_orientation_benchmark.py'
      - 'tests/test_cognitive_orientation_benchmark.py'
      - '.github/workflows/wp801-cognitive-orientation-ci.yml'
  pull_request:
    paths:
      - 'src/frankenstein2/cognitive_microworld.py'
      - 'src/frankenstein2/cognitive_orientation_benchmark.py'
      - 'tests/test_cognitive_orientation_benchmark.py'
      - '.github/workflows/wp801-cognitive-orientation-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: >-
          python -m py_compile
          src/frankenstein2/cognitive_microworld.py
          src/frankenstein2/cognitive_orientation_benchmark.py
          tests/test_cognitive_orientation_benchmark.py
      - name: Held-out orientation falsification suite
        env:
          PYTHONPATH: src
        run: python tests/test_cognitive_orientation_benchmark.py -v
