name: WP306 Renderer Tokenizer Cost Binding Falsifier

on:
  pull_request:
    paths:
      - 'src/frankenstein2/context_compiler.py'
      - 'tests/test_wp306_renderer_tokenizer_cost_binding_falsifier.py'
      - '.github/workflows/wp306-render-token-cost-binding-falsifier-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  falsify-cost-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile reviewed WP306 source and falsifier
        run: python -m py_compile src/frankenstein2/context_compiler.py tests/test_wp306_renderer_tokenizer_cost_binding_falsifier.py
      - name: Run preregistered renderer/tokenizer cost-binding discriminator
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_wp306_renderer_tokenizer_cost_binding_falsifier -v
