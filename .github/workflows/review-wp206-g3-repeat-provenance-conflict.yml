name: REVIEW_ONLY WP206 G3 Repeat Provenance Conflict

on:
  pull_request:
    paths:
      - 'src/frankenstein2/wp206_legacy_authority_recovery.py'
      - 'tests/test_wp206_legacy_authority_recovery.py'
      - 'tests/review_test_wp206_g3_repeat_provenance_conflict.py'
      - '.github/workflows/review-wp206-g3-repeat-provenance-conflict.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repeat-provenance-conflict-falsifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile review surface
        run: >-
          python -m py_compile
          src/frankenstein2/wp206_legacy_authority_recovery.py
          tests/test_wp206_legacy_authority_recovery.py
          tests/review_test_wp206_g3_repeat_provenance_conflict.py
      - name: Execute preregistered repeat-provenance falsifier
        env:
          PYTHONPATH: src
        run: python tests/review_test_wp206_g3_repeat_provenance_conflict.py -v
      - name: Preserve review-only credit fence
        if: always()
        run: |
          echo 'CLASSIFICATION=REVIEW_ONLY_EXECUTABLE_FALSIFIER'
          echo 'MUTATION_AUTHORITY=false'
          echo 'TARGET_RUNTIME_CREDIT=0'
          echo 'PHYSICAL_GRID10_CREDIT=0'
          echo 'GWT_RUNTIME_CREDIT=0'
          echo 'JSPACE_RUNTIME_CREDIT=0'
          echo 'EFFECT_CREDIT=0'
          echo 'COMPLETION_CREDIT=0'
          echo 'TRAINING_CREDIT=0'
          echo 'WHOLE_SYSTEM_ACCEPTANCE=false'
