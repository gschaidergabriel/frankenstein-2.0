name: WP802 Novelty-Not-Value Candidate CI

on:
  push:
    branches:
      - trigger4/wp802-novelty-not-value-candidate-gpt56sol-20260829
    paths:
      - 'src/frankenstein2/cognitive_information_seeking_benchmark.py'
      - 'src/frankenstein2/cognitive_microworld.py'
      - 'tests/test_cognitive_information_seeking_benchmark.py'
      - 'tests/test_wp802_novelty_not_value_candidate.py'
      - '.github/workflows/wp802-novelty-not-value-candidate-ci.yml'
  pull_request:
    paths:
      - 'src/frankenstein2/cognitive_information_seeking_benchmark.py'
      - 'src/frankenstein2/cognitive_microworld.py'
      - 'tests/test_cognitive_information_seeking_benchmark.py'
      - 'tests/test_wp802_novelty_not_value_candidate.py'
      - '.github/workflows/wp802-novelty-not-value-candidate-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-falsifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile exact candidate perimeter
        run: |
          python -m py_compile \
            src/frankenstein2/cognitive_microworld.py \
            src/frankenstein2/cognitive_information_seeking_benchmark.py \
            tests/test_cognitive_information_seeking_benchmark.py \
            tests/test_wp802_novelty_not_value_candidate.py
      - name: Run canonical WP802 plus candidate falsifier
        env:
          PYTHONPATH: src
        run: |
          python -m unittest -v \
            tests.test_cognitive_information_seeking_benchmark \
            tests.test_wp802_novelty_not_value_candidate
