name: Review WP506 Canonical Main Selection Lineage Falsifier

on:
  push:
    branches:
      - review/wp506-canonical-main-selection-lineage-falsifier-20260829
  workflow_dispatch:

permissions:
  contents: read

jobs:
  falsify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Bind exact reviewed canonical WP506 source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/frankenstein2/gwt_workspace.py)" = "7949c2981c502526291538af49c29e8703b23a23"
      - name: Compile falsifier
        run: python -m py_compile tests/falsifiers/test_wp506_canonical_main_selection_lineage_falsifier.py
      - name: Require canonical-main direct-constructor rejection
        run: python -m pytest -q tests/falsifiers/test_wp506_canonical_main_selection_lineage_falsifier.py
