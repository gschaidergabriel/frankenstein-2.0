name: REVIEW ONLY WP510 G2 Downstream Status Falsifier

on:
  pull_request:
    paths:
      - 'tests/test_wp510_g2_downstream_status_falsifier.py'
      - '.github/workflows/review-wp510-g2-downstream-status-falsifier.yml'
      - 'workpackages/deltas/F2-WP-510/**'
      - 'src/frankenstein2/gwt_causal_path.py'
      - 'src/frankenstein2/gwt_uptake.py'
      - 'src/frankenstein2/gwt_reentry_uptake_binding.py'
      - 'src/frankenstein2/grid10_interface.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-falsifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile exact review surface
        run: >-
          python -m py_compile
          src/frankenstein2/grid10_interface.py
          src/frankenstein2/gwt_workspace.py
          src/frankenstein2/gwt_uptake.py
          src/frankenstein2/gwt_reentry_provenance.py
          src/frankenstein2/gwt_reentry_uptake_binding.py
          src/frankenstein2/gwt_causal_path.py
          tests/test_gwt_causal_path.py
          tests/test_wp510_g2_downstream_status_falsifier.py
      - name: Execute preregistered candidate falsifier
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_wp510_g2_downstream_status_falsifier.py
