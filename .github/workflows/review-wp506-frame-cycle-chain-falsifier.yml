name: Review WP506 Frame Cycle Chain Falsifier

on:
  pull_request:
    paths:
      - 'tests/falsifiers/test_wp506_frame_cycle_chain_falsifier.py'
      - '.github/workflows/review-wp506-frame-cycle-chain-falsifier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  falsify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile discriminator
        run: python -m py_compile tests/falsifiers/test_wp506_frame_cycle_chain_falsifier.py
      - name: Require exact producer plan frame/cycle closure
        run: python -m pytest -q tests/falsifiers/test_wp506_frame_cycle_chain_falsifier.py
