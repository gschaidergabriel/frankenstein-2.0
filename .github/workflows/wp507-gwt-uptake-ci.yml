name: F2 WP507 GWT Uptake Causal Evidence CI

on:
  push:
    branches:
      - trigger4/wp507-gwt-uptake-g2-20260829
    paths:
      - 'src/frankenstein2/gwt_uptake.py'
      - 'tests/test_gwt_uptake.py'
      - 'tests/test_wp507_subset_recipient_falsifier.py'
      - 'tests/test_wp507_forged_summary_falsifier.py'
      - '.github/workflows/wp507-gwt-uptake-ci.yml'
  pull_request:
    paths:
      - 'src/frankenstein2/gwt_uptake.py'
      - 'tests/test_gwt_uptake.py'
      - 'tests/test_wp507_subset_recipient_falsifier.py'
      - 'tests/test_wp507_forged_summary_falsifier.py'
      - '.github/workflows/wp507-gwt-uptake-ci.yml'

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile
        run: python -m py_compile src/frankenstein2/gwt_uptake.py src/frankenstein2/gwt_workspace.py src/frankenstein2/grid10_interface.py
      - name: WP507 uptake and causal-evidence falsification suite
        run: >-
          python -m pytest -q
          tests/test_gwt_uptake.py
          tests/test_wp507_subset_recipient_falsifier.py
          tests/test_wp507_forged_summary_falsifier.py
