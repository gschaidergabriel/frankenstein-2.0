name: F2 Workpackage State Consistency CI

on:
  push:
    paths:
      - 'tools/validate_workpackage_state.py'
      - 'tools/rebuild_workpackage_state_projection.py'
      - 'tests/test_validate_workpackage_state.py'
      - 'tests/test_wp002_aggregate_projection_gate.py'
      - 'tests/test_wp002_reconciliation_chain.py'
      - 'workpackages/STATE_CONSISTENCY_CONTRACT.md'
      - 'workpackages/WORKPACKAGE_STATE_CONSISTENCY_CONTRACT_V1.json'
      - 'workpackages/STATE.json'
      - 'workpackages/active/**'
      - 'workpackages/claims/**'
      - 'workpackages/reconciliations/**'
      - '.github/workflows/workpackage-state-consistency-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/validate_workpackage_state.py'
      - 'tools/rebuild_workpackage_state_projection.py'
      - 'tests/test_validate_workpackage_state.py'
      - 'tests/test_wp002_aggregate_projection_gate.py'
      - 'tests/test_wp002_reconciliation_chain.py'
      - 'workpackages/STATE_CONSISTENCY_CONTRACT.md'
      - 'workpackages/WORKPACKAGE_STATE_CONSISTENCY_CONTRACT_V1.json'
      - 'workpackages/STATE.json'
      - 'workpackages/active/**'
      - 'workpackages/claims/**'
      - 'workpackages/reconciliations/**'
      - '.github/workflows/workpackage-state-consistency-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deterministic:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile projection tooling
        run: python -m py_compile tools/validate_workpackage_state.py tools/rebuild_workpackage_state_projection.py
      - name: Deterministic state consistency regressions
        run: python -m unittest -v tests.test_validate_workpackage_state tests.test_wp002_aggregate_projection_gate tests.test_wp002_reconciliation_chain
      - name: Build conservative current aggregate projection candidate
        run: python tools/rebuild_workpackage_state_projection.py . --output /tmp/STATE.generated.json --report /tmp/STATE.projection-report.json
      - name: Upload projection candidate
        uses: actions/upload-artifact@v4
        with:
          name: wp002-g5-projection-candidate
          path: |
            /tmp/STATE.generated.json
            /tmp/STATE.projection-report.json
          if-no-files-found: error
          retention-days: 1
      - name: Diagnose aggregate projection drift
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          state = json.loads(Path("workpackages/STATE.json").read_text())["workpackages"]
          for pointer_path in sorted(Path("workpackages/active").glob("*.json")):
              pointer = json.loads(pointer_path.read_text())
              wp = pointer.get("workpackage_id")
              pointer_state = pointer.get("state")
              entry = state.get(wp)
              if entry is None:
                  print(f"MISSING_FROM_STATE {wp} pointer_state={pointer_state} pointer={pointer_path}")
                  continue
              broad = entry.get("status")
              if pointer_state == "ACTIVE" and broad in {"NOT_STARTED", "ACCEPTED_AT_SCOPE"}:
                  print(f"STALE_ACTIVE_PROJECTION {wp} pointer_state={pointer_state} broad={broad} pointer={pointer_path}")
              if pointer_state == "ACCEPTED" and broad == "NOT_STARTED":
                  print(f"STALE_ACCEPTED_PROJECTION {wp} pointer_state={pointer_state} broad={broad} pointer={pointer_path}")
          PY
      - name: Diagnose terminal reconciliation credit boundaries
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          terminals = {"ACCEPTED", "FAILED_TERMINAL", "RETIRED_STALE", "SUPERSEDED"}
          for pointer_path in sorted(Path("workpackages/active").glob("*.json")):
              pointer = json.loads(pointer_path.read_text())
              if pointer.get("state") not in terminals:
                  continue
              wp = pointer.get("workpackage_id")
              matches = []
              for recon_path in sorted((Path("workpackages/reconciliations") / wp).glob("*.json")):
                  recon = json.loads(recon_path.read_text())
                  terminal = recon.get("terminal_state", recon.get("state"))
                  if (recon.get("schema") == "FRANKENSTEIN2_WORKPACKAGE_RECONCILIATION/v1"
                      and recon.get("workpackage_id") == wp
                      and recon.get("generation") == pointer.get("generation")
                      and recon.get("claim_id") == pointer.get("claim_id")
                      and terminal == pointer.get("state")):
                      matches.append((recon_path, recon))
              for recon_path, recon in matches:
                  explicit_zero = (recon.get("whole_system_acceptance") is False
                                   or recon.get("whole_system_credit") == 0)
                  if not explicit_zero:
                      print(f"MISSING_EXPLICIT_WHOLE_SYSTEM_ZERO pointer={pointer_path} reconciliation={recon_path}")
          PY
      - name: Validate checked-out repository state
        run: python tools/validate_workpackage_state.py .

  apply_projection_once:
    if: github.event_name == 'push' && github.ref == 'refs/heads/chatgpt/trigger4-wp002-g5-fresh-projection-20260829-2206'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild only STATE.json from checked-out granular evidence
        run: |
          python tools/rebuild_workpackage_state_projection.py . --output /tmp/STATE.generated.json --report /tmp/STATE.projection-report.json
          cp /tmp/STATE.generated.json workpackages/STATE.json
      - name: Commit projection iff changed
        shell: bash
        run: |
          if git diff --quiet -- workpackages/STATE.json; then
            echo 'STATE projection already current on this branch.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workpackages/STATE.json
          git commit -m 'trigger4(WP002 G5): apply conservative aggregate projection'
          git push origin HEAD:${GITHUB_REF_NAME}
