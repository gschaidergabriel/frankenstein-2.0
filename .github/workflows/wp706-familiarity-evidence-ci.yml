name: F2 WP706 Familiarity Evidence CI

on:
  push:
    branches:
      - main
      - trigger4/wp706-soft-familiarity-evidence-20260829
    paths:
      - 'src/frankenstein2/familiarity_evidence.py'
      - 'tests/test_familiarity_evidence.py'
      - '.github/workflows/wp706-familiarity-evidence-ci.yml'
  pull_request:
    paths:
      - 'src/frankenstein2/familiarity_evidence.py'
      - 'tests/test_familiarity_evidence.py'
      - '.github/workflows/wp706-familiarity-evidence-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile
        run: python -m py_compile src/frankenstein2/familiarity_evidence.py tests/test_familiarity_evidence.py
      - name: Familiarity evidence falsification suite
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_familiarity_evidence.py
