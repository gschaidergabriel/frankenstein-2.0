name: F2 WP105 PR430 UNKNOWN exact-head falsifier

on:
  push:
    branches:
      - chatgpt/trigger4-wp105-pr430-falsifier-20260829
    paths:
      - '.github/workflows/wp105-pr430-unknown-falsifier-ci.yml'
  pull_request:
    paths:
      - '.github/workflows/wp105-pr430-unknown-falsifier-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f2-wp105-pr430-unknown-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exact-head-falsifier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout F2 evidence host
        uses: actions/checkout@v4
      - name: Checkout retained PR430 exact head
        uses: actions/checkout@v4
        with:
          repository: gschaidergabriel/clay-global-research-entity
          ref: 2f99e400f1c0ea1b8598573ab0fab993885cba5e
          path: retained-pr430
      - name: Verify exact retained head
        working-directory: retained-pr430
        run: |
          test "$(git rev-parse HEAD)" = "2f99e400f1c0ea1b8598573ab0fab993885cba5e"
          test -z "$(git status --porcelain)"
          printf 'PR430_HEAD=%s\n' "$(git rev-parse HEAD)"
          printf 'PR430_TREE=%s\n' "$(git rev-parse HEAD^{tree})"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic test dependency
        run: python -m pip install --disable-pip-version-check --quiet 'pytest==8.4.2'
      - name: Compile candidate UNKNOWN lane
        working-directory: 'retained-pr430/the artefact'
        run: >-
          python -m py_compile
          clayverse/effects.py
          clayverse/effect_journal.py
          clayverse/entityos_bridge.py
          tests/test_effect_unknown_outcome.py
      - name: Run exact UNKNOWN outcome falsifier suite
        working-directory: 'retained-pr430/the artefact'
        run: python -m pytest -q tests/test_effect_unknown_outcome.py
      - name: Run adjacent effect authority regressions
        working-directory: 'retained-pr430/the artefact'
        run: >-
          python -m pytest -q
          tests/test_effect_journal.py
          tests/test_effect_pipeline.py
          tests/test_effect_policy.py
          tests/test_effect_adapter.py
