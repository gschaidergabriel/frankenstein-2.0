name: Review WP509 Decision Constructor Lineage Falsifier

on:
  push:
    branches:
      - review/wp509-decision-constructor-lineage-falsifier-20260829
    paths:
      - 'tests/test_wp509_decision_constructor_lineage_falsifier.py'
      - '.github/workflows/review-wp509-decision-constructor-lineage-falsifier.yml'
  pull_request:
    paths:
      - 'tests/test_wp509_decision_constructor_lineage_falsifier.py'
      - '.github/workflows/review-wp509-decision-constructor-lineage-falsifier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  falsifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile reviewed source and falsifier
        run: python -m py_compile src/frankenstein2/rumination_control.py tests/test_wp509_decision_constructor_lineage_falsifier.py
      - name: Require evaluated decision producer lineage
        env:
          PYTHONPATH: src
        run: python tests/test_wp509_decision_constructor_lineage_falsifier.py -v
