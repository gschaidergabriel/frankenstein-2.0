name: REVIEW ONLY WP206 G6 shared UnifiedDB writer counterexample

on:
  pull_request:
    paths:
      - 'tests/review_wp206_g6_legitimate_wp103_writer_counterexample.py'
      - 'src/frankenstein2/persistent_agency_kernel.py'
      - 'src/frankenstein2/causal_identity.py'
      - 'src/state/delivery_lifecycle.py'
      - 'src/state/delivery_store.py'
      - 'src/state/unifieddb_identity.py'
      - '.github/workflows/wp206-g6-shared-unifieddb-writer-review.yml'
  push:
    branches:
      - 'chatgpt/review-wp206-g6-shared-unifieddb-writer-20260830'
    paths:
      - 'tests/review_wp206_g6_legitimate_wp103_writer_counterexample.py'
      - '.github/workflows/wp206-g6-shared-unifieddb-writer-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce-cross-subsystem-false-positive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile exact review discriminator and imported surfaces
        run: >-
          python -m py_compile
          tests/review_wp206_g6_legitimate_wp103_writer_counterexample.py
          src/frankenstein2/persistent_agency_kernel.py
          src/frankenstein2/causal_identity.py
          src/state/delivery_lifecycle.py
          src/state/delivery_store.py
          src/state/unifieddb_identity.py
      - name: Reproduce legitimate WP103 writer counterexample
        env:
          PYTHONPATH: src
        run: python tests/review_wp206_g6_legitimate_wp103_writer_counterexample.py
      - name: Preserve review-only zero-credit scope
        if: always()
        run: |
          echo 'CLASSIFICATION=REVIEW_ONLY_COUNTEREXAMPLE'
          echo 'MUTATION_AUTHORITY=false'
          echo 'G6_ACCEPTANCE_CREDIT=0'
          echo 'TARGET_RUNTIME_CREDIT=0'
          echo 'PHYSICAL_GRID10_CREDIT=0'
          echo 'GWT_JSPACE_RUNTIME_CREDIT=0'
          echo 'EFFECT_CREDIT=0'
          echo 'COMPLETION_CREDIT=0'
          echo 'TRAINING_CREDIT=0'
          echo 'WHOLE_SYSTEM_ACCEPTANCE=false'
