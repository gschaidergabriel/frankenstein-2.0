name: WP717 G3 Runtime Reconciliation Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wp717-g3-runtime-reconcile-once.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: wp717-g3-runtime-reconcile-33369190762
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLAIM_ID: F2-WP-717-G3-GPT56SOL-MEMORY-GWT-LINEAGE-FENCES-20260831
      CI_RUN_ID: '33369009623'
      SUBJECT_SHA: a6a1ace9202413493c827cb74590d3edfa0ff74d
      SUBJECT_TREE: d87e7c14f7e285eb1b42378252b1d42c16dcb00f
      EXTERNAL_RUN_ID: '33369190762'
      EXTERNAL_RECEIPT_COMMIT: 608e0bddc7058c90cd0702cebc322570b008ef5e
      EXTERNAL_RECEIPT_URL: https://raw.githubusercontent.com/gschaidergabriel/Dr.-Unterweger/main/runtime/trigger4/wp717_g3_memory_fence/a6a1ace9202413493c827cb74590d3edfa0ff74d.json
      RECEIPT_PATH: workpackages/receipts/F2-WP-717_G3_MEMORY_PAYLOAD_FENCE_VPS_CONTROLLER_33369190762.json
      RECON_PATH: workpackages/reconciliations/F2-WP-717/3-F2-WP-717-G3-GPT56SOL-MEMORY-GWT-LINEAGE-FENCES-20260831.json

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Refresh main and verify sole G3 authority
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('workpackages/active/F2-WP-717.json')
          claim = json.loads(p.read_text())
          assert claim['generation'] == 3, claim
          assert claim['claim_id'] == os.environ['CLAIM_ID'], claim
          assert claim['state'] == 'ACTIVE', claim
          assert claim.get('runtime_execution_observed') is False, claim
          assert not Path(os.environ['RECON_PATH']).exists(), 'G3 reconciliation already exists'
          assert not Path(os.environ['RECEIPT_PATH']).exists(), 'G3 F2 receipt already exists'
          PY

      - name: Verify exact repository CI and external VPS receipt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}" \
            -o /tmp/wp717-ci.json
          curl -fsSL "$EXTERNAL_RECEIPT_URL" -o /tmp/wp717-external.json
          python - <<'PY'
          import json, os
          ci = json.load(open('/tmp/wp717-ci.json'))
          ext = json.load(open('/tmp/wp717-external.json'))
          assert str(ci['id']) == os.environ['CI_RUN_ID'], ci
          assert ci['head_sha'] == os.environ['SUBJECT_SHA'], ci
          assert ci['status'] == 'completed' and ci['conclusion'] == 'success', ci
          assert ext['schema'] == 'F2_WP717_G3_MEMORY_PAYLOAD_FENCE_TARGET_RECEIPT/v1', ext
          assert ext['status'] == 'PASS', ext
          assert ext['claim_id'] == os.environ['CLAIM_ID'], ext
          assert ext['accepted_source_sha'] == os.environ['SUBJECT_SHA'], ext
          assert ext['accepted_source_tree_sha'] == os.environ['SUBJECT_TREE'], ext
          assert str(ext['run_id']) == os.environ['EXTERNAL_RUN_ID'], ext
          assert ext['runtime_execution_observed'] is True, ext
          assert ext['external_gate_receipt']['executed_test_count'] == 17, ext
          assert ext['memory_payload_relation_fence_runtime_credit'] == 1, ext
          for key in ('canonical_memory_write_credit','gwt_runtime_credit','jspace_runtime_credit','causal_gwt_uptake_credit','effect_credit','physical_audio_credit','training_credit','completion_credit'):
              assert ext[key] == 0, (key, ext[key])
          assert ext['whole_system_acceptance'] is False, ext
          PY

      - name: Build bounded F2 receipt, reconciliation and terminal pointer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          active_path = Path('workpackages/active/F2-WP-717.json')
          active = json.loads(active_path.read_text())
          ext = json.load(open('/tmp/wp717-external.json'))
          ci = json.load(open('/tmp/wp717-ci.json'))

          receipt_path = Path(os.environ['RECEIPT_PATH'])
          recon_path = Path(os.environ['RECON_PATH'])
          receipt_path.parent.mkdir(parents=True, exist_ok=True)
          recon_path.parent.mkdir(parents=True, exist_ok=True)

          subject = {
              'source_sha': os.environ['SUBJECT_SHA'],
              'source_tree_sha': os.environ['SUBJECT_TREE'],
              'canonical_source': 'src/frankenstein2/voice_heard_result_reentry.py',
              'canonical_source_blob_sha': ext['adapter_blob_sha'],
              'g3_test': 'tests/test_voice_heard_result_reentry_g3_falsifiers.py',
              'g3_test_blob_sha': ext['g3_test_blob_sha'],
              'composition_test': 'tests/test_voice_heard_result_reentry_memory_context_composition.py',
              'composition_test_blob_sha': ext['composition_test_blob_sha'],
          }

          receipt = {
              'schema': 'FRANKENSTEIN2_RUNTIME_ACCEPTANCE_RECEIPT/v1',
              'workpackage_id': 'F2-WP-717',
              'generation': 3,
              'claim_id': os.environ['CLAIM_ID'],
              'status': 'PASS',
              'accepted_scope': 'VPS_VOICE_HEARD_RESULT_MEMORY_PAYLOAD_RELATION_FENCE_RUNTIME_ONLY',
              'subject': subject,
              'repository_ci': {
                  'run_id': int(os.environ['CI_RUN_ID']),
                  'head_sha': ci['head_sha'],
                  'conclusion': ci['conclusion'],
                  'executed_test_count': 17,
                  'zero_provider_surface': True,
              },
              'controller': {
                  'repository': 'gschaidergabriel/Dr.-Unterweger',
                  'controller_sha': ext['controller_sha'],
                  'workflow': '.github/workflows/trigger4-wp717-g3-memory-fence-target.yml',
                  'run_id': ext['run_id'],
                  'run_attempt': ext['run_attempt'],
                  'receipt_commit': os.environ['EXTERNAL_RECEIPT_COMMIT'],
                  'receipt_path': 'runtime/trigger4/wp717_g3_memory_fence/a6a1ace9202413493c827cb74590d3edfa0ff74d.json',
                  'external_gate_receipt_sha256': ext['external_gate_receipt_sha256'],
              },
              'runtime_identity': {
                  'runner_name': ext['runner_name'],
                  'runner_os': ext['runner_os'],
                  'runner_arch': ext['runner_arch'],
                  'runner_hostname': ext['runner_hostname'],
                  'runner_platform': ext['runner_platform'],
                  'container_runtime': ext['container_runtime'],
                  'target_environment': ext['target_environment'],
                  'container_python': ext['external_gate_receipt']['python'],
              },
              'invocation': ["unittest discovery: test_voice_heard_result_reentry*.py (17 tests)"],
              'observed_result': {
                  'executed_test_count': 17,
                  'discriminator': ext['external_gate_receipt']['discriminator'],
                  'runtime_execution_observed': True,
                  'memory_payload_relation_fence_runtime_credit': 1,
              },
              'file_sha256_trace': ext['external_gate_receipt']['file_sha256'],
              'credit': {
                  'memory_payload_relation_fence_runtime_credit': 1,
                  'canonical_memory_write_credit': 0,
                  'gwt_runtime_credit': 0,
                  'jspace_runtime_credit': 0,
                  'causal_gwt_uptake_credit': 0,
                  'effect_credit': 0,
                  'physical_audio_credit': 0,
                  'training_credit': 0,
                  'completion_credit': 0,
                  'whole_system_acceptance': False,
              },
              'post_runtime_successor_policy': {
                  'classification': 'EXACT_SUBJECT_CREDIT_ONLY__NO_LATER_MAIN_COMPOSITION_WITHOUT_INVARIANCE',
                  'reason': 'The runtime receipt promotes only exact subject a6a1ace and the measured WP717 G3 memory-payload relation fence. Later main commits are not composed into target-runtime credit merely because the WP717-owned source currently appears unchanged.',
              },
              'evidence_law': 'PASS demonstrates exact-source WP717 G3 VSR07 heard-result-to-memory lifecycle payload relation fencing in clay-direct-dev. GWT in this consumer remains reference-only metadata. It does not demonstrate canonical durable memory write/readback, semantic GWT/J-Space causal uptake/re-entry, effects, physical audio, training, completion or whole-system acceptance.',
          }
          receipt_path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')

          reconciliation = {
              'schema': 'FRANKENSTEIN2_WORKPACKAGE_RECONCILIATION/v1',
              'workpackage_id': 'F2-WP-717',
              'generation': 3,
              'claim_id': os.environ['CLAIM_ID'],
              'status': 'ACCEPTED_AT_BOUNDED_RUNTIME_SCOPE',
              'reconciliation_type': 'POST_REPAIR_RUNTIME_PROMOTION',
              'repository_component_scope_preserved': True,
              'repository_ci_run_id': int(os.environ['CI_RUN_ID']),
              'repository_ci_subject_sha': os.environ['SUBJECT_SHA'],
              'runtime_receipt': os.environ['RECEIPT_PATH'],
              'external_controller_receipt': {
                  'repository': 'gschaidergabriel/Dr.-Unterweger',
                  'commit': os.environ['EXTERNAL_RECEIPT_COMMIT'],
                  'path': 'runtime/trigger4/wp717_g3_memory_fence/a6a1ace9202413493c827cb74590d3edfa0ff74d.json',
                  'run_id': ext['run_id'],
                  'run_attempt': ext['run_attempt'],
              },
              'exact_subject': subject,
              'observed_runtime': {
                  'runner_name': ext['runner_name'],
                  'hostname': ext['runner_hostname'],
                  'target_environment': ext['target_environment'],
                  'container_runtime': ext['container_runtime'],
                  'python': ext['external_gate_receipt']['python'],
                  'executed_test_count': 17,
                  'discriminator': ext['external_gate_receipt']['discriminator'],
                  'runtime_execution_observed': True,
              },
              'runtime_subject_churn_resolution': {
                  'classification': 'EXACT_SUBJECT_ACCEPTED__LATER_MAIN_NOT_COMPOSED_WITHOUT_INVARIANCE',
                  'reason': 'a6a1ace itself passed repository CI and later executed on the admitted VPS route. The exact measured credit is durable for that subject only; successor-main runtime credit remains zero absent explicit invariance or re-execution.',
              },
              'credit_delta': {
                  'memory_payload_relation_fence_runtime_credit': 1,
                  'canonical_memory_write_credit': 0,
                  'gwt_runtime_credit': 0,
                  'jspace_runtime_credit': 0,
                  'causal_gwt_uptake_credit': 0,
                  'effect_credit': 0,
                  'physical_audio_credit': 0,
                  'training_credit': 0,
                  'completion_credit': 0,
                  'whole_system_acceptance': False,
              },
              'scope_guard': 'Run 33369190762 is real exact-subject target-component execution of the WP717 G3 memory-payload relation fence and its 17-regression set. GWT reference participation does not mint GWT/J-Space/causal runtime credit. Canonical memory write, effects, physical audio, training, completion and whole-system acceptance remain zero.',
              'duplicate_guard': 'Do not redispatch a6a1ace for the already-measured G3 memory-fence scope. Any deeper semantic GWT/J-Space gate must use its own current authority and exact runtime subject.',
              'next_exact_action': 'Treat WP717 G3 memory-payload relation runtime scope as closed. Refresh current project authority and select the next dependency-correct runtime/integration boundary; real GWT uptake/re-entry remains a separate zero-credit gate.',
          }
          recon_path.write_text(json.dumps(reconciliation, indent=2, sort_keys=True) + '\n')

          active['state'] = 'ACCEPTED'
          active['work_class'] = 'RUNTIME_CREDIT_CLOSURE'
          active['target_completion_tier'] = 'VOICE_HEARD_RESULT_MEMORY_PAYLOAD_FENCE_TARGET_COMPONENT_RUNTIME'
          active['execution_surface_class'] = 'VPS_SANDBOX_REPRESENTABLE__EXECUTED'
          active['blocking_deficit'] = 'CLOSED_AT_EXACT_G3_MEMORY_PAYLOAD_RELATION_FENCE_RUNTIME_SCOPE; deeper GWT/J-Space causal uptake and all broader product scopes remain separate zero-credit gates.'
          active['repository_ci_subject_sha'] = os.environ['SUBJECT_SHA']
          active['repository_ci_subject_tree_sha'] = os.environ['SUBJECT_TREE']
          active['repository_ci_run_id'] = int(os.environ['CI_RUN_ID'])
          active['repository_ci_result'] = 'SUCCESS_17_OF_17_PLUS_ZERO_PROVIDER_SURFACE'
          active['repository_component_ci_regression_credit'] = 1
          active['runtime_subject_sha'] = os.environ['SUBJECT_SHA']
          active['runtime_subject_status'] = 'EXECUTED_ACCEPTED_AT_BOUNDED_SCOPE'
          active['runtime_subject_churn_class'] = 'EXACT_SUBJECT_ACCEPTED__LATER_MAIN_NOT_COMPOSED_WITHOUT_INVARIANCE'
          active['runtime_run_id'] = ext['run_id']
          active['runtime_execution_observed'] = True
          active['vps_execution_observed'] = True
          active['memory_payload_relation_fence_credit'] = 1
          active['gwt_reference_scope_fence_credit'] = 0
          active['gwt_factory_lineage_fence_credit'] = 0
          active['canonical_memory_write_credit'] = 0
          active['gwt_runtime_credit'] = 0
          active['jspace_runtime_credit'] = 0
          active['effect_credit'] = 0
          active['physical_audio_credit'] = 0
          active['training_credit'] = 0
          active['completion_credit'] = 0
          active['whole_system_acceptance'] = False
          active['runtime_receipt_ref'] = os.environ['RECEIPT_PATH']
          active['reconciliation_ref'] = os.environ['RECON_PATH']
          active['failure_class'] = 'PRODUCT_NEGATIVE_REPAIRED_AND_RUNTIME_VERIFIED_AT_EXACT_SCOPE'
          active['next_exact_action'] = 'G3 bounded memory-payload relation runtime scope is terminal accepted. Refresh current main/authority and route the next dependency-correct boundary; do not redispatch this subject and do not promote GWT/J-Space from reference-only evidence.'
          active_path.write_text(json.dumps(active, indent=2) + '\n')
          PY

      - name: Commit one coherent bounded closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'GPT-5.6-Sol Trigger4'
          git config user.email 'trigger4@users.noreply.github.com'
          git rm .github/workflows/wp717-g3-runtime-reconcile-once.yml
          git add workpackages/active/F2-WP-717.json "$RECEIPT_PATH" "$RECON_PATH"
          git commit -m 'trigger4: reconcile WP717 G3 memory-fence VPS runtime'
          git pull --rebase origin main
          git push origin HEAD:main
