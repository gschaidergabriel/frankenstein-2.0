name: WP802 Cognitive Information-Seeking CI

on:
  push:
    branches:
      - trigger4/wp802-information-seeking-20260829
    paths:
      - 'src/frankenstein2/cognitive_information_seeking_benchmark.py'
      - 'src/frankenstein2/cognitive_microworld.py'
      - 'tests/test_cognitive_information_seeking_benchmark.py'
      - 'tests/test_cognitive_microworld.py'
      - '.github/workflows/wp802-cognitive-information-seeking-ci.yml'
  pull_request:
    paths:
      - 'src/frankenstein2/cognitive_information_seeking_benchmark.py'
      - 'src/frankenstein2/cognitive_microworld.py'
      - 'tests/test_cognitive_information_seeking_benchmark.py'
      - 'tests/test_cognitive_microworld.py'
      - '.github/workflows/wp802-cognitive-information-seeking-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wp802-component:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile WP800/WP802 modules
        run: |
          python -m py_compile \
            src/frankenstein2/cognitive_microworld.py \
            src/frankenstein2/cognitive_information_seeking_benchmark.py
      - name: Run canonical micro-world and information-seeking tests
        env:
          PYTHONPATH: src
        run: |
          python -m unittest -v \
            tests.test_cognitive_microworld \
            tests.test_cognitive_information_seeking_benchmark
