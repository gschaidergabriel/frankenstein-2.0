name: F2 WP203 G2 Item-Type Repair CI

on:
  push:
    branches:
      - chatgpt/trigger4-wp203-g2-item-type-repair-20260829
    paths:
      - 'src/frankenstein2/agency_state.py'
      - 'tests/test_agency_state.py'
      - 'tests/test_agency_state_item_types.py'
      - '.github/workflows/wp203-g2-item-type-repair-ci.yml'
  pull_request:
    paths:
      - 'src/frankenstein2/agency_state.py'
      - 'tests/test_agency_state.py'
      - 'tests/test_agency_state_item_types.py'
      - '.github/workflows/wp203-g2-item-type-repair-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile src/frankenstein2/agency_state.py tests/test_agency_state.py tests/test_agency_state_item_types.py
      - name: Generation-1 AgencyState regression suite
        env:
          PYTHONPATH: src
        run: python tests/test_agency_state.py -v
      - name: Generation-2 concrete-item admission regressions
        env:
          PYTHONPATH: src
        run: python tests/test_agency_state_item_types.py -v
