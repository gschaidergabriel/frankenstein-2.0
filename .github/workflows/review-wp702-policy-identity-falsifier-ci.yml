name: REVIEW WP702 policy identity falsifier

on:
  push:
    branches:
      - chatgpt/review-wp702-policy-identity-falsifier-20260829
    paths:
      - 'tests/review/test_wp702_policy_identity_falsifier.py'
      - '.github/workflows/review-wp702-policy-identity-falsifier-ci.yml'
  pull_request:
    paths:
      - 'tests/review/test_wp702_policy_identity_falsifier.py'
      - '.github/workflows/review-wp702-policy-identity-falsifier-ci.yml'

permissions:
  contents: read

jobs:
  policy-identity-falsifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run REVIEW_ONLY policy identity falsifier
        env:
          PYTHONPATH: src
        run: python -m unittest tests.review.test_wp702_policy_identity_falsifier -v
