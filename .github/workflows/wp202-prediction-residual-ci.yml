name: F2 WP202 Prediction Residual CI

on:
  push:
    branches:
      - main
      - chatgpt/trigger4-wp202-prediction-residual-20260829
      - chatgpt/trigger4-wp202-g2-statefingerprint-binding-20260829
    paths:
      - 'src/frankenstein2/prediction_contract.py'
      - 'src/frankenstein2/prediction_fingerprint_binding.py'
      - 'tests/test_prediction_contract.py'
      - 'tests/test_prediction_fingerprint_binding_provenance.py'
      - 'tests/test_prediction_fingerprint_binding_nested_classification.py'
      - '.github/workflows/wp202-prediction-residual-ci.yml'
  pull_request:
    paths:
      - 'src/frankenstein2/prediction_contract.py'
      - 'src/frankenstein2/prediction_fingerprint_binding.py'
      - 'tests/test_prediction_contract.py'
      - 'tests/test_prediction_fingerprint_binding_provenance.py'
      - 'tests/test_prediction_fingerprint_binding_nested_classification.py'
      - '.github/workflows/wp202-prediction-residual-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: >-
          python -m py_compile
          src/frankenstein2/prediction_contract.py
          src/frankenstein2/prediction_fingerprint_binding.py
          tests/test_prediction_contract.py
          tests/test_prediction_fingerprint_binding_provenance.py
          tests/test_prediction_fingerprint_binding_nested_classification.py
      - name: Prediction residual falsification suite
        env:
          PYTHONPATH: src
        run: |
          python tests/test_prediction_contract.py -v
          python tests/test_prediction_fingerprint_binding_provenance.py -v
          python tests/test_prediction_fingerprint_binding_nested_classification.py -v
