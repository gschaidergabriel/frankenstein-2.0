name: F2 WP206 Persistent Agency Integration CI

on:
  push:
    branches:
      - chatgpt/trigger4-wp206-persistent-agency-integration-20260829
    paths:
      - 'src/frankenstein2/persistent_agency_kernel.py'
      - 'src/frankenstein2/persistent_agency_change_policy.py'
      - 'tests/test_persistent_agency_kernel.py'
      - 'tests/test_persistent_agency_change_policy.py'
      - '.github/workflows/wp206-persistent-agency-integration-ci.yml'
  pull_request:
    paths:
      - 'src/frankenstein2/persistent_agency_kernel.py'
      - 'src/frankenstein2/persistent_agency_change_policy.py'
      - 'tests/test_persistent_agency_kernel.py'
      - 'tests/test_persistent_agency_change_policy.py'
      - '.github/workflows/wp206-persistent-agency-integration-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-restart-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile integration surface
        run: >-
          python -m py_compile
          src/frankenstein2/persistent_agency_kernel.py
          src/frankenstein2/persistent_agency_change_policy.py
          tests/test_persistent_agency_kernel.py
          tests/test_persistent_agency_change_policy.py
      - name: Persistent Agency restart integration suite
        env:
          PYTHONPATH: src
        run: |
          python tests/test_persistent_agency_kernel.py -v
          python tests/test_persistent_agency_change_policy.py -v
