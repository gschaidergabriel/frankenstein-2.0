name: Review Canonical WP506 Selection Constructor Falsifier

on:
  pull_request:
    paths:
      - 'tests/falsifiers/test_wp506_canonical_selection_constructor_falsifier.py'
      - 'workpackages/falsifiers/F2-WP-506/20260829_CANONICAL_SELECTION_CONSTRUCTOR_BYPASS_GPT56SOL.json'
      - '.github/workflows/review-wp506-canonical-selection-constructor-falsifier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  falsify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Bind exact canonical WP506 source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/frankenstein2/gwt_workspace.py)" = "7949c2981c502526291538af49c29e8703b23a23"
      - name: Compile falsifier
        run: python -m py_compile tests/falsifiers/test_wp506_canonical_selection_constructor_falsifier.py
      - name: Require forged selection rejection
        run: python -m pytest -q tests/falsifiers/test_wp506_canonical_selection_constructor_falsifier.py
