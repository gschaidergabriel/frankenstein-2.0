name: REVIEW ONLY WP206 post-G5 external SQLite revision fence

on:
  push:
    branches:
      - 'chatgpt/trigger4-wp206-g5-external-sqlite-revision-fence-20260830'
    paths:
      - 'src/frankenstein2/persistent_agency_kernel.py'
      - 'src/frankenstein2/wp206_legacy_authority_recovery.py'
      - 'tests/falsifier_wp206_g5_external_sqlite_revision_drift.py'
      - 'tests/test_wp206_g5_evidence_subject_binding.py'
      - 'tests/test_wp206_g4_repeat_provenance_binding.py'
      - 'tests/test_wp206_legacy_authority_recovery.py'
      - 'tests/test_persistent_agency_kernel.py'
      - '.github/workflows/wp206-g6-external-sqlite-revision-fence-review-ci.yml'
  pull_request:
    paths:
      - 'src/frankenstein2/persistent_agency_kernel.py'
      - 'src/frankenstein2/wp206_legacy_authority_recovery.py'
      - 'tests/falsifier_wp206_g5_external_sqlite_revision_drift.py'
      - 'tests/test_wp206_g5_evidence_subject_binding.py'
      - 'tests/test_wp206_g4_repeat_provenance_binding.py'
      - 'tests/test_wp206_legacy_authority_recovery.py'
      - 'tests/test_persistent_agency_kernel.py'
      - '.github/workflows/wp206-g6-external-sqlite-revision-fence-review-ci.yml'

permissions:
  contents: read

jobs:
  post-g5-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile exact post-G5 review surface
        run: >-
          python -m py_compile
          src/frankenstein2/persistent_agency_kernel.py
          src/frankenstein2/wp206_legacy_authority_recovery.py
          tests/falsifier_wp206_g5_external_sqlite_revision_drift.py
          tests/test_wp206_g5_evidence_subject_binding.py
          tests/test_wp206_g4_repeat_provenance_binding.py
          tests/test_wp206_legacy_authority_recovery.py
          tests/test_persistent_agency_kernel.py
      - name: Revalidate external same-inode SQLite revision discriminator
        env:
          PYTHONPATH: src
        run: python tests/falsifier_wp206_g5_external_sqlite_revision_drift.py
      - name: Preserve accepted G5 evidence-subject contract
        env:
          PYTHONPATH: src
        run: python tests/test_wp206_g5_evidence_subject_binding.py -v
      - name: Preserve accepted G4 repeat-provenance contract
        env:
          PYTHONPATH: src
        run: python tests/test_wp206_g4_repeat_provenance_binding.py -v
      - name: Preserve accepted G3 legacy-recovery contract
        env:
          PYTHONPATH: src
        run: python tests/test_wp206_legacy_authority_recovery.py -v
      - name: Preserve persistent-agency kernel regressions
        env:
          PYTHONPATH: src
        run: python tests/test_persistent_agency_kernel.py -v
      - name: Preserve review-only credit fence
        if: always()
        run: |
          echo 'CLASSIFICATION=REVIEW_ONLY_POST_G5_CANDIDATE_FALSIFIER'
          echo 'CANONICAL_WP206_MUTATION_AUTHORITY=false'
          echo 'TARGET_RUNTIME_CREDIT=0'
          echo 'PHYSICAL_HOST_CREDIT=0'
          echo 'VPS_RUNTIME_CREDIT=0'
          echo 'PHYSICAL_GRID10_CREDIT=0'
          echo 'GWT_RUNTIME_CREDIT=0'
          echo 'JSPACE_RUNTIME_CREDIT=0'
          echo 'PROVIDER_MODEL_CREDIT=0'
          echo 'EFFECT_CREDIT=0'
          echo 'COMPLETION_CREDIT=0'
          echo 'TRAINING_CREDIT=0'
          echo 'WHOLE_SYSTEM_ACCEPTANCE=false'
