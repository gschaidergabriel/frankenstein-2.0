name: F2 WP1202 Target Userspace Twin CI

on:
  push:
    branches:
      - main
    paths:
      - 'src/frankenstein2/target_userspace_twin.py'
      - 'tests/test_target_userspace_twin.py'
      - '.github/workflows/wp1202-target-userspace-twin-ci.yml'
      - 'workpackages/active/F2-WP-1202.json'
  pull_request:
    paths:
      - 'src/frankenstein2/target_userspace_twin.py'
      - 'tests/test_target_userspace_twin.py'
      - '.github/workflows/wp1202-target-userspace-twin-ci.yml'
      - 'workpackages/active/F2-WP-1202.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-t1-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile exact WP1202 surface
        run: python -m py_compile src/frankenstein2/target_userspace_twin.py tests/test_target_userspace_twin.py
      - name: Run fail-closed T1 planning suite
        env:
          PYTHONPATH: src
        run: python tests/test_target_userspace_twin.py -v
