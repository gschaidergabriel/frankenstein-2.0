name: F2 WP1202 Target Userspace Twin CI

on:
  push:
    branches:
      - main
    paths:
      - 'src/frankenstein2/target_host_profile.py'
      - 'src/frankenstein2/target_userspace_twin.py'
      - 'src/frankenstein2/target_userspace_runtime_readback.py'
      - 'tests/test_target_host_profile.py'
      - 'tests/test_target_userspace_twin.py'
      - 'tests/test_target_userspace_runtime_readback.py'
      - '.github/workflows/wp1201-target-host-profile-ci.yml'
      - '.github/workflows/wp1202-target-userspace-twin-ci.yml'
      - 'workpackages/active/F2-WP-1201.json'
      - 'workpackages/active/F2-WP-1202.json'
  pull_request:
    paths:
      - 'src/frankenstein2/target_host_profile.py'
      - 'src/frankenstein2/target_userspace_twin.py'
      - 'src/frankenstein2/target_userspace_runtime_readback.py'
      - 'tests/test_target_host_profile.py'
      - 'tests/test_target_userspace_twin.py'
      - 'tests/test_target_userspace_runtime_readback.py'
      - '.github/workflows/wp1201-target-host-profile-ci.yml'
      - '.github/workflows/wp1202-target-userspace-twin-ci.yml'
      - 'workpackages/active/F2-WP-1201.json'
      - 'workpackages/active/F2-WP-1202.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-t1-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile exact WP1201 to WP1202 surface
        run: python -m py_compile src/frankenstein2/target_host_profile.py src/frankenstein2/target_userspace_twin.py src/frankenstein2/target_userspace_runtime_readback.py tests/test_target_host_profile.py tests/test_target_userspace_twin.py tests/test_target_userspace_runtime_readback.py
      - name: Run WP1201 profile and WP1202 integration falsification suites
        env:
          PYTHONPATH: src
        run: |
          python tests/test_target_host_profile.py -v
          python tests/test_target_userspace_twin.py -v
          python tests/test_target_userspace_runtime_readback.py -v
