name: F2 WP704 Voice Contract CI

on:
  push:
    branches:
      - main
      - trigger4/wp704-voice-loop-contract-20260829
    paths:
      - 'src/frankenstein2/voice_contract.py'
      - 'src/frankenstein2/causal_identity.py'
      - 'tests/test_voice_contract.py'
      - 'workpackages/deltas/F2-WP-704/**'
      - '.github/workflows/wp704-voice-contract-ci.yml'
  pull_request:
    paths:
      - 'src/frankenstein2/voice_contract.py'
      - 'src/frankenstein2/causal_identity.py'
      - 'tests/test_voice_contract.py'
      - 'workpackages/deltas/F2-WP-704/**'
      - '.github/workflows/wp704-voice-contract-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile src/frankenstein2/voice_contract.py tests/test_voice_contract.py
      - name: Voice contract falsification suite
        env:
          PYTHONPATH: src
        run: python tests/test_voice_contract.py -v
