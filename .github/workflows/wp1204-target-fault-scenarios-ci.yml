name: F2 WP1204 Target Fault Scenarios CI

on:
  push:
    branches:
      - main
    paths:
      - 'src/frankenstein2/target_fault_scenarios.py'
      - 'tests/test_target_fault_scenarios.py'
      - '.github/workflows/wp1204-target-fault-scenarios-ci.yml'
  pull_request:
    paths:
      - 'src/frankenstein2/target_fault_scenarios.py'
      - 'tests/test_target_fault_scenarios.py'
      - '.github/workflows/wp1204-target-fault-scenarios-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile
        run: python -m py_compile src/frankenstein2/target_fault_scenarios.py tests/test_target_fault_scenarios.py
      - name: Fault scenario deterministic fail-closed suite
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_target_fault_scenarios.py
