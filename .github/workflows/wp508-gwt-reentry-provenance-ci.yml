name: F2 WP508 GWT Reentry Provenance CI

on:
  push:
    branches:
      - main
    paths:
      - 'src/frankenstein2/gwt_reentry_provenance.py'
      - 'tests/test_gwt_reentry_provenance.py'
      - '.github/workflows/wp508-gwt-reentry-provenance-ci.yml'
  pull_request:
    paths:
      - 'src/frankenstein2/gwt_reentry_provenance.py'
      - 'tests/test_gwt_reentry_provenance.py'
      - '.github/workflows/wp508-gwt-reentry-provenance-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile
        run: python -m py_compile src/frankenstein2/gwt_reentry_provenance.py tests/test_gwt_reentry_provenance.py
      - name: WP508 reentry/provenance falsification suite
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_gwt_reentry_provenance.py
