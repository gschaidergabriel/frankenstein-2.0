name: F2 WP506 Producer Envelope Repair Once

on:
  push:
    branches:
      - 'trigger4/wp506-gwt-selection-broadcast-20260829'
    paths:
      - '.github/workflows/wp506-producer-envelope-repair-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'trigger4/wp506-gwt-selection-broadcast-20260829'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind selection causal envelope to exact producer plan
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('src/frankenstein2/gwt_workspace.py')
          source = source_path.read_text()

          old_sig = '''def _validate_candidate_origins(\n    candidates: tuple[WorkspaceCandidate, ...],\n    *,\n    grid_plan_id: str,\n    grid_plan_generation: int,\n    grid_plan_sha256: str,\n) -> None:\n'''
          new_sig = '''def _validate_candidate_origins(\n    candidates: tuple[WorkspaceCandidate, ...],\n    *,\n    cycle_id: str,\n    frame_id: str,\n    frame_generation: int,\n    frame_sha256: str,\n    grid_plan_id: str,\n    grid_plan_generation: int,\n    grid_plan_sha256: str,\n) -> None:\n'''
          if source.count(old_sig) != 1:
              raise SystemExit('expected _validate_candidate_origins signature not found exactly once')
          source = source.replace(old_sig, new_sig, 1)

          old_check = '''        if (\n            admission.plan_id != grid_plan_id\n            or admission.plan_generation != grid_plan_generation\n            or admission.plan_sha256 != grid_plan_sha256\n        ):\n            raise GwtWorkspaceError("candidate producer GRID10 plan binding mismatch")\n        if item.payload_ref not in admission.output_refs:\n'''
          new_check = '''        if (\n            admission.plan_id != grid_plan_id\n            or admission.plan_generation != grid_plan_generation\n            or admission.plan_sha256 != grid_plan_sha256\n        ):\n            raise GwtWorkspaceError("candidate producer GRID10 plan binding mismatch")\n        if admission.plan.cycle_id != cycle_id:\n            raise GwtWorkspaceError("candidate producer cycle binding mismatch")\n        if (\n            admission.plan.frame_id != frame_id\n            or admission.plan.frame_generation != frame_generation\n            or admission.plan.frame_sha256 != frame_sha256\n        ):\n            raise GwtWorkspaceError("candidate producer SituationFrame binding mismatch")\n        if item.payload_ref not in admission.output_refs:\n'''
          if source.count(old_check) != 1:
              raise SystemExit('expected producer plan identity check not found exactly once')
          source = source.replace(old_check, new_check, 1)

          old_assert_call = '''    _validate_candidate_origins(\n        candidates,\n        grid_plan_id=selection.grid_plan_id,\n        grid_plan_generation=selection.grid_plan_generation,\n        grid_plan_sha256=selection.grid_plan_sha256,\n    )\n'''
          new_assert_call = '''    _validate_candidate_origins(\n        candidates,\n        cycle_id=selection.cycle_id,\n        frame_id=selection.frame_id,\n        frame_generation=selection.frame_generation,\n        frame_sha256=selection.frame_sha256,\n        grid_plan_id=selection.grid_plan_id,\n        grid_plan_generation=selection.grid_plan_generation,\n        grid_plan_sha256=selection.grid_plan_sha256,\n    )\n'''
          if source.count(old_assert_call) != 1:
              raise SystemExit('expected lineage validation call not found exactly once')
          source = source.replace(old_assert_call, new_assert_call, 1)

          old_build = '''    normalized_grid_plan_id = _text("grid_plan_id", grid_plan_id)\n    normalized_grid_plan_generation = _generation("grid_plan_generation", grid_plan_generation)\n    normalized_grid_plan_sha256 = _sha256("grid_plan_sha256", grid_plan_sha256)\n    canonical_candidates = tuple(sorted(candidates, key=lambda item: item.candidate_id))\n    _validate_candidate_origins(\n        canonical_candidates,\n        grid_plan_id=normalized_grid_plan_id,\n        grid_plan_generation=normalized_grid_plan_generation,\n        grid_plan_sha256=normalized_grid_plan_sha256,\n    )\n'''
          new_build = '''    normalized_cycle_id = _text("cycle_id", cycle_id)\n    normalized_frame_id = _text("frame_id", frame_id)\n    normalized_frame_generation = _generation("frame_generation", frame_generation)\n    normalized_frame_sha256 = _sha256("frame_sha256", frame_sha256)\n    normalized_grid_plan_id = _text("grid_plan_id", grid_plan_id)\n    normalized_grid_plan_generation = _generation("grid_plan_generation", grid_plan_generation)\n    normalized_grid_plan_sha256 = _sha256("grid_plan_sha256", grid_plan_sha256)\n    canonical_candidates = tuple(sorted(candidates, key=lambda item: item.candidate_id))\n    _validate_candidate_origins(\n        canonical_candidates,\n        cycle_id=normalized_cycle_id,\n        frame_id=normalized_frame_id,\n        frame_generation=normalized_frame_generation,\n        frame_sha256=normalized_frame_sha256,\n        grid_plan_id=normalized_grid_plan_id,\n        grid_plan_generation=normalized_grid_plan_generation,\n        grid_plan_sha256=normalized_grid_plan_sha256,\n    )\n'''
          if source.count(old_build) != 1:
              raise SystemExit('expected build normalization block not found exactly once')
          source = source.replace(old_build, new_build, 1)

          old_fields = '''        cycle_id=cycle_id,\n        generation=generation,\n        frame_id=frame_id,\n        frame_generation=frame_generation,\n        frame_sha256=frame_sha256,\n'''
          new_fields = '''        cycle_id=normalized_cycle_id,\n        generation=generation,\n        frame_id=normalized_frame_id,\n        frame_generation=normalized_frame_generation,\n        frame_sha256=normalized_frame_sha256,\n'''
          if source.count(old_fields) != 1:
              raise SystemExit('expected WorkspaceSelection causal fields not found exactly once')
          source_path.write_text(source.replace(old_fields, new_fields, 1))

          test_path = Path('tests/test_gwt_workspace.py')
          tests = test_path.read_text()
          marker = '''\ndef test_selected_candidate_retains_exact_producer_digest_binding():\n'''
          added = '''\n@pytest.mark.parametrize(\n    ("field", "foreign_value", "message"),\n    (\n        ("cycle_id", "cycle-foreign", "producer cycle binding mismatch"),\n        ("frame_id", "frame-foreign", "producer SituationFrame binding mismatch"),\n        ("frame_generation", 999, "producer SituationFrame binding mismatch"),\n        ("frame_sha256", "d" * 64, "producer SituationFrame binding mismatch"),\n    ),\n)\ndef test_selection_requires_exact_producer_cycle_and_situation_frame_binding(\n    field, foreign_value, message\n):\n    source = candidate("bound-envelope")\n    kwargs = dict(\n        selection_id="sel-envelope",\n        cycle_id=GRID_PLAN.cycle_id,\n        generation=7,\n        frame_id=GRID_PLAN.frame_id,\n        frame_generation=GRID_PLAN.frame_generation,\n        frame_sha256=GRID_PLAN.frame_sha256,\n        grid_plan_id=GRID_PLAN.plan_id,\n        grid_plan_generation=GRID_PLAN.generation,\n        grid_plan_sha256=GRID_PLAN.sha256(),\n        policy=policy(),\n        candidates=(source,),\n    )\n    kwargs[field] = foreign_value\n    with pytest.raises(GwtWorkspaceError, match=message):\n        build_workspace_selection(**kwargs)\n\n'''
          if marker not in tests:
              raise SystemExit('expected test insertion marker not found')
          if 'test_selection_requires_exact_producer_cycle_and_situation_frame_binding' in tests:
              raise SystemExit('producer envelope regression already present')
          test_path.write_text(tests.replace(marker, added + marker, 1))
          PY
      - name: Compile
        run: python -m py_compile src/frankenstein2/gwt_workspace.py tests/test_gwt_workspace.py
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run full WP506 suite
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_gwt_workspace.py
      - name: Commit exact repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/frankenstein2/gwt_workspace.py tests/test_gwt_workspace.py
          git commit -m 'trigger4: bind WP506 selection envelope to producer plan'
          git push origin HEAD:trigger4/wp506-gwt-selection-broadcast-20260829
