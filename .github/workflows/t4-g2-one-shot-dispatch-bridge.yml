name: Trigger4 G2 One Shot Dispatch Bridge

# One-shot control-plane bridge only. It exists on a disposable branch and
# dispatches the canonical manual G2 runtime workflow against an immutable
# subject branch that points at the exact refreshed main SHA.
on:
  push:
    branches:
      - chatgpt/t4-g2-dispatch-bridge-20260902
    paths:
      - ".github/workflows/t4-g2-one-shot-dispatch-bridge.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch-exact-subject:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_WORKFLOW: t4-g2-pipewire-monitor-cancel.yml
      TARGET_REF: chatgpt/t4-g2-runtime-subject-2c475ab
      TARGET_SHA: 2c475ab24668e1eca439b2597a5c47456a61b006
    steps:
      - name: Verify immutable target ref then dispatch once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          target_ref = os.environ['TARGET_REF']
          target_sha = os.environ['TARGET_SHA']
          workflow = os.environ['TARGET_WORKFLOW']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
          }

          branch_url = f'https://api.github.com/repos/{repo}/branches/{target_ref}'
          with urllib.request.urlopen(urllib.request.Request(branch_url, headers=headers), timeout=20) as response:
              branch = json.load(response)
          observed_sha = branch.get('commit', {}).get('sha')
          if observed_sha != target_sha:
              raise SystemExit(f'T4_G2_DISPATCH_SUBJECT_MISMATCH:{observed_sha}:{target_sha}')

          runs_url = f'https://api.github.com/repos/{repo}/actions/workflows/{workflow}/runs?status=in_progress&per_page=100'
          with urllib.request.urlopen(urllib.request.Request(runs_url, headers=headers), timeout=20) as response:
              running = json.load(response)
          if running.get('workflow_runs'):
              raise SystemExit('T4_G2_DISPATCH_BLOCKED_EXISTING_IN_PROGRESS')

          dispatch_url = f'https://api.github.com/repos/{repo}/actions/workflows/{workflow}/dispatches'
          payload = json.dumps({'ref': target_ref}).encode('utf-8')
          request = urllib.request.Request(dispatch_url, data=payload, headers=headers, method='POST')
          with urllib.request.urlopen(request, timeout=20) as response:
              status = response.status
          if status != 204:
              raise SystemExit(f'T4_G2_DISPATCH_UNEXPECTED_STATUS:{status}')
          print(f'T4_G2_DISPATCHED_REF={target_ref}')
          print(f'T4_G2_DISPATCHED_SHA={target_sha}')
          print('T4_G2_DISPATCH_CONTROL_PLANE=PASS')
          PY
