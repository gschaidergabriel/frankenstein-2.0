name: "[REVIEW_ONLY] WP1207 G3 Output Boundary Falsifier"

on:
  push:
    branches:
      - chatgpt/review-wp1207-g3-output-boundary-falsifier-20260830
    paths:
      - 'tests/review_test_wp1207_g3_output_boundary.py'
      - '.github/workflows/review-wp1207-g3-output-boundary-falsifier.yml'
  pull_request:
    paths:
      - 'tests/review_test_wp1207_g3_output_boundary.py'
      - '.github/workflows/review-wp1207-g3-output-boundary-falsifier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  positive-declared-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile review-only falsifier
        run: python -m py_compile tests/review_test_wp1207_g3_output_boundary.py
      - name: Prove declared reference is currently materialized
        env:
          PYTHONPATH: src:.
        run: >-
          python tests/review_test_wp1207_g3_output_boundary.py
          WP1207G3OutputBoundaryReviewTests.test_declared_receipt_is_materialized_at_declared_reference
          -v

  falsifier-parent-symlink-escape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run parent-symlink escape falsifier
        env:
          PYTHONPATH: src:.
        run: >-
          python tests/review_test_wp1207_g3_output_boundary.py
          WP1207G3OutputBoundaryReviewTests.test_preexisting_receipt_parent_symlink_escape_fails_closed
          -v

  falsifier-existing-receipt-overwrite:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run existing-receipt overwrite falsifier
        env:
          PYTHONPATH: src:.
        run: >-
          python tests/review_test_wp1207_g3_output_boundary.py
          WP1207G3OutputBoundaryReviewTests.test_preexisting_declared_receipt_different_bytes_is_not_overwritten
          -v
