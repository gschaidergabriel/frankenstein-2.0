name: F2-WP-900 Whole Persistent Loop CI

on:
  push:
    paths:
      - "src/frankenstein2/whole_persistent_loop.py"
      - "tests/test_whole_persistent_loop.py"
      - ".github/workflows/f2-wp900-whole-persistent-loop-ci.yml"
  pull_request:
    paths:
      - "src/frankenstein2/whole_persistent_loop.py"
      - "tests/test_whole_persistent_loop.py"
      - ".github/workflows/f2-wp900-whole-persistent-loop-ci.yml"

permissions:
  contents: read

jobs:
  whole-persistent-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Run WP900 bounded integration falsifiers
        run: python -m pytest -q tests/test_whole_persistent_loop.py
