name: REVIEW_ONLY WP206 G3 repeat provenance falsifier

on:
  pull_request:
    paths:
      - 'src/frankenstein2/wp206_legacy_authority_recovery.py'
      - 'src/frankenstein2/persistent_agency_kernel.py'
      - 'tests/test_wp206_legacy_authority_recovery.py'
      - 'tests/review_wp206_g3_repeat_provenance_falsifier.py'
      - '.github/workflows/review-wp206-g3-repeat-provenance-falsifier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce-repeat-provenance-ambiguity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile canonical G3 recovery and review witness
        run: |
          python -m py_compile src/frankenstein2/wp206_legacy_authority_recovery.py
          python -m py_compile src/frankenstein2/persistent_agency_kernel.py
          python -m py_compile tests/test_wp206_legacy_authority_recovery.py
          python -m py_compile tests/review_wp206_g3_repeat_provenance_falsifier.py
      - name: Preserve canonical WP206 G3 positive controls
        env:
          PYTHONPATH: src
        run: python tests/test_wp206_legacy_authority_recovery.py -v
      - name: Reproduce repeat-provenance identity ambiguity
        env:
          PYTHONPATH: src
        run: python tests/review_wp206_g3_repeat_provenance_falsifier.py
      - name: Preserve bounded negative-evidence fence
        if: always()
        run: |
          echo 'CLASSIFICATION=REVIEW_ONLY_EXECUTABLE_COUNTEREXAMPLE'
          echo 'GREEN_REVIEW_RUN_MEANS_COUNTEREXAMPLE_REPRODUCED=true'
          echo 'WP206_MUTATION_AUTHORITY=false'
          echo 'TARGET_RUNTIME_CREDIT=0'
          echo 'PHYSICAL_GRID10_CREDIT=0'
          echo 'GWT_JSPACE_CREDIT=0'
          echo 'EFFECT_COMPLETION_TRAINING_CREDIT=0'
          echo 'WHOLE_SYSTEM_ACCEPTANCE=false'
