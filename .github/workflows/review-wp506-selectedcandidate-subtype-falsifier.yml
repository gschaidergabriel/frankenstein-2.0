name: REVIEW WP506 SelectedCandidate Subtype Lineage Falsifier

on:
  pull_request:
    paths:
      - 'tests/test_wp506_selected_candidate_subtype_lineage_falsifier.py'
      - '.github/workflows/review-wp506-selectedcandidate-subtype-falsifier.yml'
      - 'src/frankenstein2/gwt_workspace.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  falsifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile review discriminator
        run: python -m py_compile src/frankenstein2/gwt_workspace.py tests/test_wp506_selected_candidate_subtype_lineage_falsifier.py
      - name: Run subtype-lineage discriminator
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_wp506_selected_candidate_subtype_lineage_falsifier.py
