name: Frankenstein 2.0 Run Package Verifier CI

on:
  pull_request:
    paths:
      - 'runpackages/verify_run_package.py'
      - 'runpackages/RUN_PACKAGE_SCHEMA_V1.json'
      - 'tests/test_verify_run_package.py'
      - '.github/workflows/run-package-verifier-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile verifier regression suite
        run: python -m py_compile runpackages/verify_run_package.py tests/test_verify_run_package.py
      - name: Run canonical run-package tamper tests
        run: python tests/test_verify_run_package.py -v
