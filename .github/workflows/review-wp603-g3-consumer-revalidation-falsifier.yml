name: REVIEW_ONLY WP603 G3 consumer revalidation falsifier

on:
  pull_request:
    branches:
      - trigger4/wp603-g3-consumer-revalidation-20260829
    paths:
      - src/frankenstein2/recursion_router.py
      - tests/test_recursion_router.py
      - tests/review_only/test_wp603_g3_consumer_revalidation_falsifier.py
      - .github/workflows/review-wp603-g3-consumer-revalidation-falsifier.yml

permissions:
  contents: read

jobs:
  need_content_drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Need generation/content drift must fail closed
        env:
          PYTHONPATH: src
        run: >-
          python -m unittest
          tests.review_only.test_wp603_g3_consumer_revalidation_falsifier.WP603G3ConsumerRevalidationFalsifier.test_need_generation_drift_is_rejected_before_consumption

  policy_content_drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Policy current-content invariant drift must fail closed
        env:
          PYTHONPATH: src
        run: >-
          python -m unittest
          tests.review_only.test_wp603_g3_consumer_revalidation_falsifier.WP603G3ConsumerRevalidationFalsifier.test_policy_invariant_drift_is_rejected_before_consumption
