name: F2 WP506 GWT Selection Broadcast CI

# The same workflow is installed on main so pull_request evaluation is base-authoritative.
on:
  push:
    branches:
      - chatgpt/f2-wp506-gwt-selection-broadcast-g1-20260829
    paths:
      - 'src/frankenstein2/gwt_workspace.py'
      - 'tests/test_gwt_workspace.py'
      - '.github/workflows/wp506-gwt-selection-broadcast-ci.yml'
  pull_request:
    paths:
      - 'src/frankenstein2/gwt_workspace.py'
      - 'tests/test_gwt_workspace.py'
      - '.github/workflows/wp506-gwt-selection-broadcast-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile src/frankenstein2/gwt_workspace.py tests/test_gwt_workspace.py
      - name: GWT selection broadcast falsification suite
        env:
          PYTHONPATH: src
        run: python tests/test_gwt_workspace.py -v
