name: F2 WP506 GWT Selection Broadcast CI

# Claim-scoped repository component CI only; PASS does not mint target-runtime, physical GRID10, GWT-uptake, effect, training, completion, or whole-system credit.
# Exact-source revalidation after fusion of producer-envelope + Hyperposition/SituationFrame repairs.
on:
  push:
    branches:
      - trigger4/wp506-gwt-selection-broadcast-20260829
      - trigger4/wp506-fusion-gpt56sol-20260829-0715
      - main
    paths:
      - 'src/frankenstein2/gwt_workspace.py'
      - 'tests/test_gwt_workspace.py'
      - '.github/workflows/wp506-gwt-selection-broadcast-ci.yml'
  pull_request:
    paths:
      - 'src/frankenstein2/gwt_workspace.py'
      - 'tests/test_gwt_workspace.py'
      - '.github/workflows/wp506-gwt-selection-broadcast-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile
        run: python -m py_compile src/frankenstein2/gwt_workspace.py tests/test_gwt_workspace.py
      - name: GWT selection/broadcast falsification suite
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_gwt_workspace.py
