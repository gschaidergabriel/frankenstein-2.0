name: F2 WP600 Direct Delegate Router CI

on:
  push:
    branches:
      - trigger4/wp600-direct-delegate-router-20260829
      - main
    paths:
      - 'src/frankenstein2/direct_delegate_router.py'
      - 'tests/test_direct_delegate_router.py'
      - '.github/workflows/wp600-direct-delegate-router-ci.yml'
  pull_request:
    paths:
      - 'src/frankenstein2/direct_delegate_router.py'
      - 'tests/test_direct_delegate_router.py'
      - '.github/workflows/wp600-direct-delegate-router-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile
        run: >-
          python -m py_compile
          src/frankenstein2/direct_delegate_router.py
          tests/test_direct_delegate_router.py
      - name: WP600 deterministic fail-closed suite
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_direct_delegate_router.py
