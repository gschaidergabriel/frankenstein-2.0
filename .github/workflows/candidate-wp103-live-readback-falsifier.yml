name: Candidate WP103 Live Readback Identity Falsifier

on:
  push:
    branches:
      - 'review/wp103-live-readback-falsifier-20260902'
    paths:
      - 'tests/test_wp103_live_readback_identity_falsifier.py'
      - '.github/workflows/candidate-wp103-live-readback-falsifier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  falsifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Execute candidate falsifier only
        run: python -m unittest -v tests/test_wp103_live_readback_identity_falsifier.py
