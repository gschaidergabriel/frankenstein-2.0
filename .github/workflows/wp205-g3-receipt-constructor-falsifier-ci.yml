name: F2 WP205 G3 Receipt Constructor Falsifier CI

on:
  push:
    branches:
      - chatgpt/trigger4-wp205-g3-receipt-constructor-falsifier-20260829
    paths:
      - 'src/frankenstein2/wake_hold.py'
      - 'tests/falsifiers/test_wp205_g3_receipt_constructor.py'
      - '.github/workflows/wp205-g3-receipt-constructor-falsifier-ci.yml'
  pull_request:
    paths:
      - 'src/frankenstein2/wake_hold.py'
      - 'tests/falsifiers/test_wp205_g3_receipt_constructor.py'
      - '.github/workflows/wp205-g3-receipt-constructor-falsifier-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  falsifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile falsifier
        run: python -m py_compile src/frankenstein2/wake_hold.py tests/falsifiers/test_wp205_g3_receipt_constructor.py
      - name: Receipt constructor falsifier
        env:
          PYTHONPATH: src
        run: python tests/falsifiers/test_wp205_g3_receipt_constructor.py -v
