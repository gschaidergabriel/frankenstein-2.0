# exact WP603 G3 consumer-boundary repair capsule; robust segmented insertion
name: F2 WP603 G3 Consumer Revalidation Patch

on:
  push:
    branches:
      - trigger4/wp603-g3-consumer-revalidation-20260829
    paths:
      - .github/workflows/wp603-g3-consumer-revalidation-patch.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: trigger4/wp603-g3-consumer-revalidation-20260829
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact WP603 G3 consumer-boundary repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("src/frankenstein2/recursion_router.py")
          test_path = Path("tests/test_recursion_router.py")
          source = source_path.read_text()
          tests = test_path.read_text()

          policy_method = r'''
              @classmethod
              def from_mapping(cls, value: Mapping[str, Any]) -> "RecursionPolicy":
                  if not isinstance(value, Mapping):
                      raise RecursionRouterError("recursion policy input must be a mapping")
                  expected = {
                      "schema", "policy_id", "generation", "admitted_modes",
                      "r3_preference_order", "max_nested_child_edges", "provenance_refs",
                  }
                  if set(value.keys()) != expected:
                      raise RecursionRouterError("recursion policy fields are not exact")
                  admitted_modes = value["admitted_modes"]
                  r3_preference_order = value["r3_preference_order"]
                  provenance_refs = value["provenance_refs"]
                  if type(admitted_modes) is list:
                      admitted_modes = tuple(admitted_modes)
                  if type(r3_preference_order) is list:
                      r3_preference_order = tuple(r3_preference_order)
                  if type(provenance_refs) is list:
                      provenance_refs = tuple(provenance_refs)
                  try:
                      return cls(
                          schema=value["schema"],
                          policy_id=value["policy_id"],
                          generation=value["generation"],
                          admitted_modes=admitted_modes,
                          r3_preference_order=r3_preference_order,
                          max_nested_child_edges=value["max_nested_child_edges"],
                          provenance_refs=provenance_refs,
                      )
                  except (TypeError, ValueError) as exc:
                      raise RecursionRouterError(f"invalid recursion policy: {exc}") from exc
          '''

          need_method = r'''
              @classmethod
              def from_mapping(cls, value: Mapping[str, Any]) -> "RecursionNeed":
                  if not isinstance(value, Mapping):
                      raise RecursionRouterError("recursion need input must be a mapping")
                  expected = {field.name for field in cls.__dataclass_fields__.values()}
                  if set(value.keys()) != expected:
                      raise RecursionRouterError("recursion need fields are not exact")
                  r3_available_modes = value["r3_available_modes"]
                  provenance_refs = value["provenance_refs"]
                  if type(r3_available_modes) is list:
                      r3_available_modes = tuple(r3_available_modes)
                  if type(provenance_refs) is list:
                      provenance_refs = tuple(provenance_refs)
                  try:
                      return cls(**{
                          **dict(value),
                          "r3_available_modes": r3_available_modes,
                          "provenance_refs": provenance_refs,
                      })
                  except (TypeError, ValueError) as exc:
                      raise RecursionRouterError(f"invalid recursion need: {exc}") from exc
          '''

          def insert_before_as_dict(text: str, class_start: str, class_end: str, method: str, sentinel: str) -> str:
              if sentinel in text:
                  return text
              start = text.index(class_start)
              end = text.index(class_end, start)
              segment = text[start:end]
              marker = "\n    def as_dict(self) -> dict[str, Any]:"
              rel = segment.find(marker)
              if rel < 0:
                  raise SystemExit(f"missing as_dict marker in {class_start}")
              pos = start + rel
              return text[:pos] + "\n" + method.rstrip() + "\n" + text[pos:]

          source = insert_before_as_dict(
              source,
              "class RecursionPolicy:",
              "class RecursionRouteCandidate:",
              policy_method,
              "def from_mapping(cls, value: Mapping[str, Any]) -> \"RecursionPolicy\"",
          )
          source = insert_before_as_dict(
              source,
              "class RecursionNeed:",
              "def _verify_parent_binding(",
              need_method,
              "def from_mapping(cls, value: Mapping[str, Any]) -> \"RecursionNeed\"",
          )

          consumer_anchor = '''    if type(policy) is not RecursionPolicy:\n        raise RecursionRouterError("policy must be exact concrete RecursionPolicy")\n'''
          consumer_insert = consumer_anchor + '''\n    # Reconstruct at the consumer boundary so post-init object drift cannot bypass\n    # RecursionNeed content binding or RecursionPolicy constructor invariants.\n    need = RecursionNeed.from_mapping(need.as_dict())\n    policy = RecursionPolicy.from_mapping(policy.as_dict())\n'''
          if "need = RecursionNeed.from_mapping(need.as_dict())" not in source:
              if source.count(consumer_anchor) != 1:
                  raise SystemExit(f"consumer anchor count={source.count(consumer_anchor)}")
              source = source.replace(consumer_anchor, consumer_insert, 1)

          regression_tests = r'''
              def test_consumer_revalidates_need_content_bound_identity_after_post_init_drift(self) -> None:
                  route = make_route(selected=DELEGATE_BUILD)
                  need = RecursionNeed.create(
                      route_candidate=route,
                      requested_mode=R1,
                      generation=1,
                      provenance_refs=("need:consumer-revalidation",),
                  )
                  object.__setattr__(need, "generation", 2)
                  with self.assertRaisesRegex(
                      RecursionRouterError,
                      "need_id does not bind exact recursion need content",
                  ):
                      route_recursion(route_candidate=route, need=need, policy=make_policy())

              def test_consumer_revalidates_policy_invariants_after_post_init_drift(self) -> None:
                  route = make_route(selected=DIRECT_SMALL)
                  need = RecursionNeed.create(
                      route_candidate=route,
                      requested_mode=R0,
                      generation=1,
                      provenance_refs=("need:policy-revalidation",),
                  )
                  policy = make_policy()
                  object.__setattr__(policy, "admitted_modes", (R0, R2, R1, R3))
                  with self.assertRaisesRegex(
                      RecursionRouterError,
                      "admitted_modes must be unique canonical",
                  ):
                      route_recursion(route_candidate=route, need=need, policy=policy)
          '''
          if "test_consumer_revalidates_need_content_bound_identity_after_post_init_drift" not in tests:
              footer = '\n\nif __name__ == "__main__":\n'
              if tests.count(footer) != 1:
                  raise SystemExit(f"test footer count={tests.count(footer)}")
              tests = tests.replace(footer, "\n" + regression_tests.rstrip() + footer, 1)

          source_path.write_text(source)
          test_path.write_text(tests)
          PY
      - name: Compile and run canonical WP603 suite
        run: |
          python -m py_compile src/frankenstein2/recursion_router.py tests/test_recursion_router.py
          PYTHONPATH=src python tests/test_recursion_router.py -v
      - name: Commit exact repair to G3 branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/frankenstein2/recursion_router.py tests/test_recursion_router.py
          git diff --cached --check
          git commit -m 'trigger4(WP603 G3): revalidate need and policy at consumer boundary'
          git push origin HEAD:trigger4/wp603-g3-consumer-revalidation-20260829
