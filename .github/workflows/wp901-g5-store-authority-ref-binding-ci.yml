name: WP901 G5/G6 restart admission CI

on:
  pull_request:
    paths:
      - 'src/frankenstein2/restart_recovery_persisted_row_attestation.py'
      - 'tests/test_restart_recovery_persisted_row_attestation.py'
      - 'tests/test_wp901_g5_store_authority_ref_binding.py'
      - 'src/frankenstein2/restart_recovery_source_authentication.py'
      - 'tests/test_restart_recovery_source_authentication.py'
      - 'src/frankenstein2/causal_authority_binding.py'
      - 'tests/test_causal_authority_binding.py'
      - 'src/frankenstein2/restart_recovery_continuation.py'
      - 'tests/test_restart_recovery_continuation.py'
      - 'src/frankenstein2/persistent_agency_kernel.py'
      - 'tests/test_persistent_agency_kernel.py'
      - '.github/workflows/wp901-g5-store-authority-ref-binding-ci.yml'
      - 'workpackages/active/F2-WP-901.json'
      - 'workpackages/receipts/F2-WP-100_G1_SOURCE_CI_ACCEPTANCE.json'
  push:
    branches:
      - main
    paths:
      - 'src/frankenstein2/restart_recovery_persisted_row_attestation.py'
      - 'tests/test_restart_recovery_persisted_row_attestation.py'
      - 'tests/test_wp901_g5_store_authority_ref_binding.py'
      - '.github/workflows/wp901-g5-store-authority-ref-binding-ci.yml'
      - 'workpackages/active/F2-WP-901.json'
      - 'workpackages/reconciliations/F2-WP-901/**'
      - 'workpackages/receipts/F2-WP-901*'
      - 'workpackages/state_events/F2-WP-901/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-authority-ref-rollback-head-and-inherited-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact workflow ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Compile G2 G3 G4 G5 G6 and authority surfaces
        run: >-
          python -m py_compile
          src/frankenstein2/restart_recovery_continuation.py
          src/frankenstein2/restart_recovery_source_authentication.py
          src/frankenstein2/restart_recovery_persisted_row_attestation.py
          src/frankenstein2/causal_authority_binding.py
          src/frankenstein2/persistent_agency_kernel.py
          tests/test_restart_recovery_continuation.py
          tests/falsifier_wp901_plan_semantic_consistency.py
          tests/falsifier_wp901_reason_code_consistency.py
          tests/test_restart_recovery_source_authentication.py
          tests/test_causal_authority_binding.py
          tests/test_restart_recovery_persisted_row_attestation.py
          tests/test_wp901_g5_store_authority_ref_binding.py
          tests/test_persistent_agency_kernel.py
      - name: Run accepted G2 G3 G4 G5 plus G6 rollback-head regressions
        env:
          PYTHONPATH: src
        run: >-
          python -m unittest -v
          tests.test_restart_recovery_continuation
          tests.falsifier_wp901_plan_semantic_consistency
          tests.falsifier_wp901_reason_code_consistency
          tests.test_restart_recovery_source_authentication
          tests.test_causal_authority_binding
          tests.test_persistent_agency_kernel
          tests.test_restart_recovery_persisted_row_attestation
          tests.test_wp901_g5_store_authority_ref_binding
      - name: Evidence scope fence
        run: |
          echo 'SCOPE=WP901_G6_ROLLBACK_LINEAGE_HEAD_ADMISSION_REPOSITORY_COMPONENT_CI_ONLY'
          echo 'ROLLBACK_STALE_ANCESTOR_ADMISSION_CLOSED_IF_GREEN=1'
          echo 'BROAD_FRESHNESS_ATTESTATION_CREDIT=0'
          echo 'TARGET_RUNTIME_CREDIT=0'
          echo 'VPS_RUNTIME_CREDIT=0'
          echo 'PHYSICAL_GRID10_CREDIT=0'
          echo 'GWT_JSPACE_CREDIT=0'
          echo 'EFFECT_CREDIT=0'
          echo 'TRAINING_CREDIT=0'
          echo 'WHOLE_SYSTEM_ACCEPTANCE=false'
