name: F2 WP806 Cognitive Lesion Rescue CI

on:
  push:
    branches:
      - main
      - chatgpt/wp806-cognitive-lesion-rescue-20260829
    paths:
      - 'src/frankenstein2/cognitive_lesion_rescue_benchmark.py'
      - 'src/frankenstein2/cognitive_microworld.py'
      - 'tests/test_cognitive_lesion_rescue_benchmark.py'
      - '.github/workflows/wp806-cognitive-lesion-rescue-ci.yml'
  pull_request:
    paths:
      - 'src/frankenstein2/cognitive_lesion_rescue_benchmark.py'
      - 'src/frankenstein2/cognitive_microworld.py'
      - 'tests/test_cognitive_lesion_rescue_benchmark.py'
      - '.github/workflows/wp806-cognitive-lesion-rescue-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: >-
          python -m py_compile
          src/frankenstein2/cognitive_microworld.py
          src/frankenstein2/cognitive_lesion_rescue_benchmark.py
          tests/test_cognitive_lesion_rescue_benchmark.py
      - name: Lesion rescue falsification suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_cognitive_lesion_rescue_benchmark.py' -v
