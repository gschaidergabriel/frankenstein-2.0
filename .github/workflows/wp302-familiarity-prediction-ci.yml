name: F2 WP302 Familiarity Prediction CI

on:
  push:
    branches:
      - trigger4/wp302-familiarity-prediction-g1-gpt56sol-20260829
    paths:
      - 'src/frankenstein2/familiarity_prediction.py'
      - 'src/frankenstein2/prediction_contract.py'
      - 'tests/test_familiarity_prediction.py'
      - '.github/workflows/wp302-familiarity-prediction-ci.yml'
  pull_request:
    paths:
      - 'src/frankenstein2/familiarity_prediction.py'
      - 'src/frankenstein2/prediction_contract.py'
      - 'tests/test_familiarity_prediction.py'
      - '.github/workflows/wp302-familiarity-prediction-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile exact WP302 surface
        run: >-
          python -m py_compile
          src/frankenstein2/prediction_contract.py
          src/frankenstein2/familiarity_prediction.py
          tests/test_familiarity_prediction.py
      - name: Familiarity prediction-error falsification suite
        env:
          PYTHONPATH: src
        run: python tests/test_familiarity_prediction.py -v
