name: WP717 Voice Heard Result Reentry CI

# Trigger4 G3 exact-main discriminator rerun marker: 2026-08-31T07:35Z
on:
  push:
    branches: [main]
    paths:
      - 'src/frankenstein2/voice_heard_result_reentry.py'
      - 'tests/test_voice_heard_result_reentry*.py'
      - 'src/frankenstein2/voice_packet_cortex.py'
      - 'src/frankenstein2/voice_contract.py'
      - 'src/frankenstein2/context_compiler.py'
      - 'src/frankenstein2/memory_lifecycle.py'
      - 'src/frankenstein2/typed_memory.py'
      - 'src/frankenstein2/gwt_reentry_uptake_binding.py'
      - '.github/workflows/wp717-voice-heard-result-reentry-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heard-result-reentry:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record exact subject
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python --version
          sha256sum \
            src/frankenstein2/voice_heard_result_reentry.py \
            tests/test_voice_heard_result_reentry.py \
            tests/test_voice_heard_result_reentry_falsifiers.py \
            tests/test_voice_heard_result_reentry_memory_context_composition.py \
            src/frankenstein2/voice_packet_cortex.py \
            src/frankenstein2/voice_contract.py \
            src/frankenstein2/context_compiler.py \
            src/frankenstein2/memory_lifecycle.py \
            src/frankenstein2/typed_memory.py \
            src/frankenstein2/gwt_reentry_uptake_binding.py
      - name: Compile WP717 adapter and regressions
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python -m py_compile \
            src/frankenstein2/voice_heard_result_reentry.py \
            tests/test_voice_heard_result_reentry.py \
            tests/test_voice_heard_result_reentry_falsifiers.py \
            tests/test_voice_heard_result_reentry_memory_context_composition.py
      - name: Run VSR01-VSR06 and composition discriminator
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_voice_heard_result_reentry*.py' -v
      - name: Assert zero provider surface in WP717 source
        run: |
          set -euo pipefail
          if grep -E -n 'requests\.|httpx\.|urllib\.|openai|anthropic|zai|glm|together|subprocess\.|socket\.' src/frankenstein2/voice_heard_result_reentry.py; then
            echo 'Unexpected provider/network/process surface in WP717 adapter' >&2
            exit 1
          fi
          echo 'WP717_ZERO_PROVIDER_SURFACE_PASS'

  g3-convergence-duplicate-guard:
    # The prior G3 runtime boundary is already ACCEPTED. Reuse the same concurrency group with
    # cancel-in-progress so any stale queued duplicate is cancelled rather than executed.
    if: "${{ github.event_name == 'push' && github.event.head_commit.message == 'trigger4: cancel duplicate WP717 G3 runtime queue' }}"
    runs-on: clay-host
    timeout-minutes: 5
    concurrency:
      group: wp717-g3-vps-memory-payload-fence-runtime
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Verify converged WP717 G3 state; do not redispatch runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${RUNNER_NAME:-}" = "vps-clay-host"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('workpackages/active/F2-WP-717.json').read_text())
          assert p['generation'] == 3
          assert p['state'] == 'ACCEPTED'
          assert p['runtime_execution_observed'] is True
          assert p['runtime_run_id'] == 33369190762
          assert p['memory_payload_relation_fence_credit'] == 1
          assert p['gwt_runtime_credit'] == 0
          assert p['jspace_runtime_credit'] == 0
          assert p['effect_credit'] == 0
          assert p['physical_audio_credit'] == 0
          assert p['training_credit'] == 0
          assert p['completion_credit'] == 0
          assert p['whole_system_acceptance'] is False
          print('WP717_G3_DUPLICATE_RUNTIME_AVOIDED=PASS')
          PY
