name: WP717 Voice Heard Result Reentry CI

on:
  push:
    branches: [main]
    paths:
      - 'src/frankenstein2/voice_heard_result_reentry.py'
      - 'tests/test_voice_heard_result_reentry.py'
      - 'src/frankenstein2/voice_packet_cortex.py'
      - 'src/frankenstein2/voice_contract.py'
      - 'src/frankenstein2/context_compiler.py'
      - 'src/frankenstein2/memory_lifecycle.py'
      - 'src/frankenstein2/typed_memory.py'
      - 'src/frankenstein2/gwt_reentry_uptake_binding.py'
      - '.github/workflows/wp717-voice-heard-result-reentry-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heard-result-reentry:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record exact subject
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python --version
          sha256sum \
            src/frankenstein2/voice_heard_result_reentry.py \
            tests/test_voice_heard_result_reentry.py \
            src/frankenstein2/voice_packet_cortex.py \
            src/frankenstein2/voice_contract.py \
            src/frankenstein2/context_compiler.py \
            src/frankenstein2/memory_lifecycle.py \
            src/frankenstein2/typed_memory.py \
            src/frankenstein2/gwt_reentry_uptake_binding.py
      - name: Compile WP717 adapter and regression module
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python -m py_compile \
            src/frankenstein2/voice_heard_result_reentry.py \
            tests/test_voice_heard_result_reentry.py
      - name: Run VSR01-VSR06 repository discriminators
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_voice_heard_result_reentry.py' -v
      - name: Assert zero provider surface in WP717 source
        run: |
          set -euo pipefail
          if grep -E -n 'requests\.|httpx\.|urllib\.|openai|anthropic|zai|glm|together|subprocess\.|socket\.' src/frankenstein2/voice_heard_result_reentry.py; then
            echo 'Unexpected provider/network/process surface in WP717 adapter' >&2
            exit 1
          fi
          echo 'WP717_ZERO_PROVIDER_SURFACE_PASS'
