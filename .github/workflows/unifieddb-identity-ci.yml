name: Frankenstein 2.0 UnifiedDB Identity CI

on:
  push:
    branches: [main]
    paths:
      - 'src/state/unifieddb_identity.py'
      - 'tests/test_unifieddb_identity.py'
      - '.github/workflows/unifieddb-identity-ci.yml'
  pull_request:
    paths:
      - 'src/state/unifieddb_identity.py'
      - 'tests/test_unifieddb_identity.py'
      - '.github/workflows/unifieddb-identity-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-unifieddb-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile identity primitive and regression
        run: python -m py_compile src/state/unifieddb_identity.py tests/test_unifieddb_identity.py
      - name: Run UnifiedDB identity regression suite
        run: python tests/test_unifieddb_identity.py
