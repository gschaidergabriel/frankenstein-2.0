name: REVIEW WP700 Assessment Producer Lineage Falsifier

on:
  pull_request:
    paths:
      - 'src/frankenstein2/retina_pipeline.py'
      - 'tests/test_wp700_assessment_producer_lineage_falsifier.py'
      - '.github/workflows/review-wp700-assessment-producer-lineage-falsifier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discriminator:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile exact WP700 source and review discriminator
        run: python -m py_compile src/frankenstein2/retina_pipeline.py tests/test_wp700_assessment_producer_lineage_falsifier.py
      - name: Require producer-bound RetinaAssessment
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_wp700_assessment_producer_lineage_falsifier.py
