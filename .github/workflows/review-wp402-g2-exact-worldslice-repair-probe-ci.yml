name: Review WP402 G2 Exact WorldSlice Repair Probe

on:
  pull_request:
    paths:
      - 'tests/test_wp402_g2_exact_worldslice_type_falsifier.py'
      - '.github/workflows/review-wp402-g2-exact-worldslice-repair-probe-ci.yml'

permissions:
  contents: read

jobs:
  accepted-g2-merge-context-repair-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact-type repairs ephemerally at both G2 WorldSlice admission boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/frankenstein2/qubo_projection.py')
          text = path.read_text(encoding='utf-8')
          old = '    if not isinstance(world_slice, WorldSlice):\n'
          new = '    if type(world_slice) is not WorldSlice:\n'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected exactly two accepted-G2 vulnerable WorldSlice boundaries, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Compile repaired accepted-G2 source and all relevant tests
        run: python -m py_compile src/frankenstein2/sparse_world_basis.py src/frankenstein2/qubo_projection.py tests/test_qubo_projection.py tests/test_wp402_g2_exact_worldslice_type_falsifier.py
      - name: Run canonical WP402 regression suite after ephemeral repair
        env:
          PYTHONPATH: src
        run: python tests/test_qubo_projection.py -v
      - name: Run exact WorldSlice subtype regressions after ephemeral repair
        env:
          PYTHONPATH: src
        run: python tests/test_wp402_g2_exact_worldslice_type_falsifier.py -v
