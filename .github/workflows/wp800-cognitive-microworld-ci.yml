name: F2 WP800 Cognitive Micro-World CI

on:
  push:
    branches:
      - main
      - trigger4/wp800-cognitive-microworld-20260829
    paths:
      - 'src/frankenstein2/cognitive_microworld.py'
      - 'tests/test_cognitive_microworld.py'
      - 'tests/test_cognitive_microworld_producer_lineage.py'
      - '.github/workflows/wp800-cognitive-microworld-ci.yml'
  pull_request:
    paths:
      - 'src/frankenstein2/cognitive_microworld.py'
      - 'tests/test_cognitive_microworld.py'
      - 'tests/test_cognitive_microworld_producer_lineage.py'
      - '.github/workflows/wp800-cognitive-microworld-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: >-
          python -m py_compile
          src/frankenstein2/cognitive_microworld.py
          tests/test_cognitive_microworld.py
          tests/test_cognitive_microworld_producer_lineage.py
      - name: Held-out harness falsification suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_cognitive_microworld*.py' -v
