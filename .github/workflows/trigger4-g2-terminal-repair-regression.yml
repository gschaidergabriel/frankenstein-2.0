name: Trigger4 G2 Terminal Repair Regression

on:
  pull_request:
    paths:
      - 'trigger4/tools/local_voice/g2_pipewire_s2_runtime.py'
      - 'trigger4/tools/local_voice/run_g2_pipewire_s2.sh'
      - 'tests/test_t4_g2_terminal_repair.py'
      - '.github/workflows/trigger4-g2-terminal-repair-regression.yml'
  push:
    branches: [main]
    paths:
      - 'trigger4/tools/local_voice/g2_pipewire_s2_runtime.py'
      - 'trigger4/tools/local_voice/run_g2_pipewire_s2.sh'
      - 'tests/test_t4_g2_terminal_repair.py'
      - '.github/workflows/trigger4-g2-terminal-repair-regression.yml'

permissions:
  contents: read

jobs:
  terminal-evidence-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check runtime and launcher
        run: |
          python -m py_compile trigger4/tools/local_voice/g2_pipewire_s2_runtime.py
          bash -n trigger4/tools/local_voice/run_g2_pipewire_s2.sh
      - name: Run focused Trigger4 G2 regressions
        run: python -m unittest tests/test_t4_g2_terminal_repair.py -v
