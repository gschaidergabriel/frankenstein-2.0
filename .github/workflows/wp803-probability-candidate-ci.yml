name: WP803 Probability Candidate CI

on:
  pull_request:
    paths:
      - "src/frankenstein2/cognitive_world_model_probability_evaluation.py"
      - "tests/test_cognitive_world_model_probability_evaluation.py"
      - ".github/workflows/wp803-probability-candidate-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run candidate probability evaluator tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_cognitive_world_model_probability_evaluation.py' -v
