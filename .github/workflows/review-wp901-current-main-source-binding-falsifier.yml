name: Review WP901 current-main source-binding falsifier

on:
  push:
    branches:
      - review/wp901-current-main-source-binding-falsifier-20260830
    paths:
      - 'src/frankenstein2/restart_recovery_continuation.py'
      - 'tests/falsifiers/falsifier_wp901_current_main_source_binding.py'
      - '.github/workflows/review-wp901-current-main-source-binding-falsifier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  falsifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile tests/falsifiers/falsifier_wp901_current_main_source_binding.py
      - name: Replay exact-current counterexample
        env:
          PYTHONPATH: src
        run: python tests/falsifiers/falsifier_wp901_current_main_source_binding.py
