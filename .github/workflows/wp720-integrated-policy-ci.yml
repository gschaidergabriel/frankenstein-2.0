name: WP720 Integrated Packet Turn Policy CI

on:
  push:
    branches: [main]
    paths:
      - 'src/frankenstein2/voice_packet_cortex.py'
      - 'tests/test_voice_packet_cortex.py'
      - 'tests/test_wp720_turn_policy_falsifiers.py'
      - '.github/workflows/wp720-integrated-policy-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrated-policy-discriminator:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record exact integrated policy subject
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python --version
          sha256sum \
            src/frankenstein2/voice_packet_cortex.py \
            tests/test_voice_packet_cortex.py \
            tests/test_wp720_turn_policy_falsifiers.py
      - name: Execute PFD6 and PFD7 current-subject discriminators
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_wp720_turn_policy_falsifiers.py' -v
      - name: Execute existing packet-cortex regressions
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_voice_packet_cortex.py' -v
