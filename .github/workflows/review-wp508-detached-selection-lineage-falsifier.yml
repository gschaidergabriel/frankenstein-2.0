name: REVIEW WP508 Detached Selection Lineage Falsifier

on:
  push:
    branches:
      - review/wp508-detached-selection-lineage-falsifier-20260829
    paths:
      - 'tests/test_wp508_detached_selection_lineage_falsifier.py'
      - '.github/workflows/review-wp508-detached-selection-lineage-falsifier.yml'
      - 'src/frankenstein2/gwt_reentry_provenance.py'
      - 'src/frankenstein2/gwt_workspace.py'
  pull_request:
    paths:
      - 'tests/test_wp508_detached_selection_lineage_falsifier.py'
      - '.github/workflows/review-wp508-detached-selection-lineage-falsifier.yml'
      - 'src/frankenstein2/gwt_reentry_provenance.py'
      - 'src/frankenstein2/gwt_workspace.py'

permissions:
  contents: read

jobs:
  falsifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile review target
        run: python -m py_compile src/frankenstein2/gwt_reentry_provenance.py src/frankenstein2/gwt_workspace.py tests/test_wp508_detached_selection_lineage_falsifier.py
      - name: Run detached selection-lineage falsifier
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_wp508_detached_selection_lineage_falsifier.py
