name: F2 WP803 Predeclared Run Admission CI

on:
  push:
    branches:
      - trigger4/wp803-g2-predeclared-run-admission-20260829
    paths:
      - 'src/frankenstein2/cognitive_microworld.py'
      - 'src/frankenstein2/cognitive_world_model_prediction_benchmark.py'
      - 'src/frankenstein2/cognitive_world_model_run_admission.py'
      - 'tests/test_cognitive_world_model_prediction_benchmark.py'
      - 'tests/test_cognitive_world_model_run_admission.py'
      - '.github/workflows/wp803-run-admission-ci.yml'
      - 'workpackages/deltas/F2-WP-803/**'
  pull_request:
    paths:
      - 'src/frankenstein2/cognitive_microworld.py'
      - 'src/frankenstein2/cognitive_world_model_prediction_benchmark.py'
      - 'src/frankenstein2/cognitive_world_model_run_admission.py'
      - 'tests/test_cognitive_world_model_prediction_benchmark.py'
      - 'tests/test_cognitive_world_model_run_admission.py'
      - '.github/workflows/wp803-run-admission-ci.yml'
      - 'workpackages/deltas/F2-WP-803/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: >-
          python -m py_compile
          src/frankenstein2/cognitive_microworld.py
          src/frankenstein2/cognitive_world_model_prediction_benchmark.py
          src/frankenstein2/cognitive_world_model_run_admission.py
          tests/test_cognitive_world_model_prediction_benchmark.py
          tests/test_cognitive_world_model_run_admission.py
      - name: WP803 prediction plus admission falsification suites
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_cognitive_world_model*.py' -v
