name: WP720 Turn Policy PFD CI

on:
  push:
    branches: [main]
    paths:
      - 'src/frankenstein2/voice_packet_turn_policy.py'
      - 'tests/test_voice_packet_turn_policy.py'
      - 'src/frankenstein2/voice_packet_cortex.py'
      - 'tests/test_voice_packet_cortex.py'
      - '.github/workflows/wp720-turn-policy-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pfd-policy-discriminator:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record exact subject
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python --version
          sha256sum \
            src/frankenstein2/voice_packet_cortex.py \
            src/frankenstein2/voice_packet_turn_policy.py \
            tests/test_voice_packet_cortex.py \
            tests/test_voice_packet_turn_policy.py
      - name: Fail closed on model or network imports in the PFD discriminator
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          forbidden = {'requests', 'httpx', 'socket', 'urllib', 'openai', 'anthropic', 'websockets'}
          paths = [
              Path('src/frankenstein2/voice_packet_turn_policy.py'),
              Path('tests/test_voice_packet_turn_policy.py'),
          ]
          observed = []
          for path in paths:
              tree = ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      observed.extend(alias.name.split('.')[0] for alias in node.names)
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      observed.append(node.module.split('.')[0])
          bad = sorted(set(observed) & forbidden)
          if bad:
              raise SystemExit(f'PFD_NETWORK_OR_MODEL_IMPORT_REJECTED:{bad}')
          print('PFD5_NO_NETWORK_MODEL_IMPORT_PASS')
          PY
      - name: Run WP720 PFD0-PFD5 matched-history regressions
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_voice_packet_turn_policy.py' -v
      - name: Re-run existing authoritative packet-cortex regressions
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_voice_packet_cortex.py' -v
      - name: Bounded scope marker
        run: |
          printf '%s\n' \
            'WP720_PFD_REPOSITORY_DISCRIMINATOR_COMPLETE' \
            'repository_component_ci_only=1' \
            'target_environment_component_runtime_credit=0' \
            'physical_audio_credit=0' \
            'asr_runtime_credit=0' \
            'tts_runtime_credit=0' \
            'semantic_gwt_jspace_credit=0' \
            'effect_credit=0' \
            'training_credit=0' \
            'whole_product_credit=0'
