name: WP719 Fresh Turn Successor CI

on:
  push:
    branches: [main]
    paths:
      - 'src/frankenstein2/fresh_turn_successor.py'
      - 'tests/test_fresh_turn_successor.py'
      - 'research/local_voice/tools/falsify_fresh_turn_successor.py'
      - '.github/workflows/wp719-fresh-turn-successor-ci.yml'
  pull_request:
    paths:
      - 'src/frankenstein2/fresh_turn_successor.py'
      - 'tests/test_fresh_turn_successor.py'
      - 'research/local_voice/tools/falsify_fresh_turn_successor.py'
      - '.github/workflows/wp719-fresh-turn-successor-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-turn-successor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: FRESH1-FRESH10 unit integration suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_fresh_turn_successor.py' -v
      - name: Bounded WP719 falsifier
        env:
          PYTHONPATH: src
        run: python research/local_voice/tools/falsify_fresh_turn_successor.py

  g1-vps-fresh-turn-successor:
    # One-shot promotion discriminator. The dispatch commit only schedules the run;
    # execution itself is pinned to the exact green repository subject below.
    if: "github.event_name == 'push' && github.event.head_commit.message == 'trigger4: dispatch WP719 G1 bound VPS fresh-turn discriminator'"
    runs-on: clay-host
    timeout-minutes: 30
    concurrency:
      group: wp719-g1-vps-fresh-turn-successor-runtime
      cancel-in-progress: false
    env:
      WP719_RUNTIME_SUBJECT_SHA: 32c6f3db988e7270fc62ec5f444f327f1ea2012b
      F2_SANDBOX_ROOT: /var/tmp/frankenstein2-sandboxes
      F2_NSPAWN_BASE_ROOT: /var/lib/frankenstein2-sandbox-images/ubuntu-24.04-base
      F2_SANDBOX_MIN_FREE_KIB: '5242880'
      F2_SANDBOX_MIN_MEM_KIB: '1048576'
    steps:
      - name: Checkout exact frozen WP719 G1 runtime subject
        uses: actions/checkout@v4
        with:
          ref: 32c6f3db988e7270fc62ec5f444f327f1ea2012b
          fetch-depth: 0

      - name: Verify exact VPS runner and frozen source identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${RUNNER_NAME:-}" = "vps-clay-host"
          test "${RUNNER_OS:-}" = "Linux"
          test "$(git rev-parse HEAD)" = "$WP719_RUNTIME_SUBJECT_SHA"
          printf '%s\n' \
            "WP719_RUNTIME_SUBJECT_SHA=$WP719_RUNTIME_SUBJECT_SHA" \
            "DISPATCH_SHA=$GITHUB_SHA" \
            "RUN_ID=$GITHUB_RUN_ID" \
            "RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT" \
            "RUNNER_NAME=$RUNNER_NAME" \
            "RUNNER_OS=$RUNNER_OS" \
            "RUNNER_ARCH=$RUNNER_ARCH" | tee /tmp/wp719-g1-runtime-identity.txt
          sha256sum \
            src/frankenstein2/fresh_turn_successor.py \
            tests/test_fresh_turn_successor.py \
            research/local_voice/tools/falsify_fresh_turn_successor.py \
            > /tmp/wp719-g1-runtime-hashes.txt
          cat /tmp/wp719-g1-runtime-hashes.txt

      - name: Prepare admitted Ubuntu 24.04 S2 sandbox
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tools/vps_sandbox/host_prepare_ubuntu_nspawn.sh
          bash tools/vps_sandbox/preflight.sh | tee /tmp/wp719-g1-preflight.txt

      - name: Execute FRESH1-FRESH10 in disposable offline S2
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tools/vps_sandbox/run_ubuntu_sandbox.sh --backend nspawn --network off -- \
            /bin/bash -lc '
              set -Eeuo pipefail
              test "$(git rev-parse HEAD)" = "32c6f3db988e7270fc62ec5f444f327f1ea2012b"
              . /etc/os-release
              test "$ID" = ubuntu
              test "$VERSION_ID" = 24.04
              export PYTHONPATH=src
              python3 --version
              python3 -m unittest discover -s tests -p "test_fresh_turn_successor.py" -v
              python3 research/local_voice/tools/falsify_fresh_turn_successor.py
              printf "WP719_G1_FRESH1_FRESH10=PASS\\n"
              printf "WP719_G1_PROVIDER_SURFACE=OFFLINE_ZERO\\n"
            ' 2>&1 | tee /tmp/wp719-g1-vps-discriminator.txt
          grep -q '^F2_SANDBOX_RESULT=PASS$' /tmp/wp719-g1-vps-discriminator.txt
          grep -q 'WP719_G1_FRESH1_FRESH10=PASS' /tmp/wp719-g1-vps-discriminator.txt
          grep -q 'WP719_G1_PROVIDER_SURFACE=OFFLINE_ZERO' /tmp/wp719-g1-vps-discriminator.txt

      - name: Emit exact bounded WP719 G1 runtime receipt
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          def read(path):
              p = pathlib.Path(path)
              return p.read_text(errors='replace') if p.exists() else ''
          log = read('/tmp/wp719-g1-vps-discriminator.txt')
          passed = (
              'F2_SANDBOX_RESULT=PASS' in log
              and 'WP719_G1_FRESH1_FRESH10=PASS' in log
              and 'WP719_G1_PROVIDER_SURFACE=OFFLINE_ZERO' in log
          )
          receipt = {
              'schema': 'F2_WP719_G1_FRESH_TURN_SUCCESSOR_VPS_RUNTIME/v1',
              'workpackage_id': 'F2-WP-719',
              'generation': 1,
              'claim_id': 'F2-WP-719-G1-GPT56SOL-FRESH-TURN-SUCCESSOR-COMPOSITION-20260901',
              'result': 'PASS' if passed else 'FAIL',
              'runtime_subject_sha': os.environ['WP719_RUNTIME_SUBJECT_SHA'],
              'dispatch_sha': os.environ.get('GITHUB_SHA'),
              'workflow_run_id': int(os.environ.get('GITHUB_RUN_ID', '0')),
              'workflow_run_attempt': int(os.environ.get('GITHUB_RUN_ATTEMPT', '0')),
              'runner_name': os.environ.get('RUNNER_NAME', 'UNKNOWN'),
              'runner_os': os.environ.get('RUNNER_OS', 'UNKNOWN'),
              'runner_arch': os.environ.get('RUNNER_ARCH', 'UNKNOWN'),
              'target_userspace': 'Ubuntu 24.04 noble',
              'sandbox_tier': 'S2_NSPAWN',
              'network_mode': 'PRIVATE_OFFLINE',
              'source_mount': 'READ_ONLY_TO_SANDBOX_COPY',
              'runtime_execution_observed': passed,
              'fresh_turn_successor_runtime_credit_candidate': 1 if passed else 0,
              'repository_component_ci_credit': 1,
              'target_environment_component_runtime_credit_candidate': 1 if passed else 0,
              'canonical_memory_write_credit': 0,
              'gwt_runtime_credit': 0,
              'jspace_runtime_credit': 0,
              'effect_credit': 0,
              'physical_audio_credit': 0,
              'training_credit': 0,
              'completion_credit': 0,
              'whole_system_acceptance': False,
              'identity_log': read('/tmp/wp719-g1-runtime-identity.txt'),
              'source_hashes': read('/tmp/wp719-g1-runtime-hashes.txt'),
              'preflight_log': read('/tmp/wp719-g1-preflight.txt'),
              'discriminator_log': log,
          }
          out = pathlib.Path('/tmp/F2-WP-719_G1_FRESH_TURN_SUCCESSOR_VPS_RUNTIME.json')
          out.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print(json.dumps(receipt, sort_keys=True))
          PY

      - name: Upload bounded runtime receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp719-g1-fresh-turn-successor-runtime-${{ github.run_id }}
          path: /tmp/F2-WP-719_G1_FRESH_TURN_SUCCESSOR_VPS_RUNTIME.json
          if-no-files-found: error

      - name: Enforce exact bounded runtime success
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -q '^F2_SANDBOX_RESULT=PASS$' /tmp/wp719-g1-vps-discriminator.txt
          grep -q 'WP719_G1_FRESH1_FRESH10=PASS' /tmp/wp719-g1-vps-discriminator.txt
          grep -q 'WP719_G1_PROVIDER_SURFACE=OFFLINE_ZERO' /tmp/wp719-g1-vps-discriminator.txt
