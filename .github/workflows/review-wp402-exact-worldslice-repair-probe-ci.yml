name: Review WP402 Exact WorldSlice Repair Probe

on:
  push:
    branches:
      - chatgpt/review-wp402-exact-worldslice-type-falsifier-20260829
    paths:
      - '.github/workflows/review-wp402-exact-worldslice-repair-probe-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ephemeral-repair-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply one-line exact-type repair ephemerally
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/frankenstein2/qubo_projection.py')
          text = path.read_text(encoding='utf-8')
          old = '    if not isinstance(source_slice, WorldSlice):\n'
          new = '    if type(source_slice) is not WorldSlice:\n'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one vulnerable source_slice isinstance boundary')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Compile repaired source and falsifier
        run: python -m py_compile src/frankenstein2/sparse_world_basis.py src/frankenstein2/qubo_projection.py tests/test_wp402_exact_worldslice_type_falsifier.py
      - name: Run exact-type provenance regression after ephemeral repair
        env:
          PYTHONPATH: src
        run: python tests/test_wp402_exact_worldslice_type_falsifier.py -v
