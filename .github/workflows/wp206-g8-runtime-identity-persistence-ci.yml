name: WP206 G8 Runtime Identity Persistence CI

on:
  pull_request:
    paths:
      - 'src/frankenstein2/whole_loop_persistence_integration.py'
      - 'tests/test_wp206_g8_runtime_bound_persistence_identity.py'
      - '.github/workflows/wp206-g8-runtime-identity-persistence-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/frankenstein2/whole_loop_persistence_integration.py'
      - 'tests/test_wp206_g8_runtime_bound_persistence_identity.py'
      - '.github/workflows/wp206-g8-runtime-identity-persistence-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile WP206 G8 boundary
        run: python -m py_compile src/frankenstein2/whole_loop_persistence_integration.py tests/test_wp206_g8_runtime_bound_persistence_identity.py
      - name: Execute WP206 G8 discriminator
        env:
          PYTHONPATH: src:.
        run: python -m pytest -q tests/test_wp206_g8_runtime_bound_persistence_identity.py
      - name: Re-run accepted dependencies
        env:
          PYTHONPATH: src:.
        run: python -m pytest -q tests/test_wp900_g5_runtime_bound_whole_loop.py tests/test_whole_persistent_loop.py
      - name: Preserve scope ceiling
        run: |
          echo WP206_G8_REPOSITORY_INTEGRATION_EXECUTED=1
          echo WP206_G8_TARGET_RUNTIME_CREDIT=0
          echo WP206_G8_SEMANTIC_GWT_RUNTIME_CREDIT=0
          echo WP206_G8_JSPACE_RUNTIME_CREDIT=0
          echo WP206_G8_EFFECT_CREDIT=0
          echo WP206_G8_TRAINING_CREDIT=0
          echo WP206_G8_WHOLE_SYSTEM_ACCEPTANCE=0
