name: WP712 PerceptionWorldBridge

on:
  pull_request:
    paths:
      - 'src/frankenstein2/perception_world_bridge.py'
      - 'tests/test_perception_world_bridge.py'
      - 'architecture/PERCEPTION_FABRIC.md'
      - 'architecture/PERCEPTION_FABRIC_HARDENING_20260829.md'
      - 'workpackages/PERCEPTION_FABRIC_PHASE.json'
      - '.github/workflows/wp712-perception-world-bridge-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/frankenstein2/perception_world_bridge.py'
      - 'tests/test_perception_world_bridge.py'
      - 'architecture/PERCEPTION_FABRIC.md'
      - 'architecture/PERCEPTION_FABRIC_HARDENING_20260829.md'
      - 'workpackages/PERCEPTION_FABRIC_PHASE.json'
      - '.github/workflows/wp712-perception-world-bridge-ci.yml'

permissions:
  contents: read

jobs:
  wp712-perception-world-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile PerceptionWorldBridge
        run: python -m py_compile src/frankenstein2/perception_world_bridge.py
      - name: Run deterministic WP712 falsifiers
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_perception_world_bridge -v
