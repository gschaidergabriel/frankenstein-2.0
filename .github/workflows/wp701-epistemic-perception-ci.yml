name: F2 WP701 Epistemic Perception CI

on:
  push:
    branches:
      - main
      - trigger4/f2-wp701-epistemic-perception-20260829
    paths:
      - 'src/frankenstein2/epistemic_perception.py'
      - 'tests/test_epistemic_perception.py'
      - '.github/workflows/wp701-epistemic-perception-ci.yml'
  pull_request:
    paths:
      - 'src/frankenstein2/epistemic_perception.py'
      - 'tests/test_epistemic_perception.py'
      - '.github/workflows/wp701-epistemic-perception-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile
        run: python -m py_compile src/frankenstein2/epistemic_perception.py tests/test_epistemic_perception.py
      - name: Epistemic perception falsification suite
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_epistemic_perception.py
