name: F2 WP204 G2 Fail-Closed CI

on:
  push:
    branches:
      - chatgpt/trigger4-wp204-g2-failclosed-repair-20260829
    paths:
      - 'src/frankenstein2/goal_lifecycle.py'
      - 'tests/test_goal_lifecycle.py'
      - 'tests/test_goal_lifecycle_g2_failclosed.py'
      - '.github/workflows/wp204-g2-failclosed-ci.yml'
  pull_request:
    paths:
      - 'src/frankenstein2/goal_lifecycle.py'
      - 'tests/test_goal_lifecycle.py'
      - 'tests/test_goal_lifecycle_g2_failclosed.py'
      - '.github/workflows/wp204-g2-failclosed-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile src/frankenstein2/goal_lifecycle.py tests/test_goal_lifecycle.py tests/test_goal_lifecycle_g2_failclosed.py
      - name: Canonical Goal lifecycle regression suite
        env:
          PYTHONPATH: src
        run: python tests/test_goal_lifecycle.py -v
      - name: Generation-2 fail-closed falsifier suite
        env:
          PYTHONPATH: src
        run: python tests/test_goal_lifecycle_g2_failclosed.py -v
