name: F2 WP508 G4 Broadcast Builder Lineage CI

on:
  push:
    branches:
      - main
    paths:
      - 'src/frankenstein2/gwt_reentry_uptake_binding.py'
      - 'src/frankenstein2/gwt_reentry_provenance.py'
      - 'src/frankenstein2/gwt_uptake.py'
      - 'src/frankenstein2/gwt_workspace.py'
      - 'src/frankenstein2/grid10_interface.py'
      - 'tests/test_gwt_reentry_uptake_binding.py'
      - '.github/workflows/wp508-g2-uptake-reentry-binding-ci.yml'
  pull_request:
    paths:
      - 'src/frankenstein2/gwt_reentry_uptake_binding.py'
      - 'src/frankenstein2/gwt_reentry_provenance.py'
      - 'src/frankenstein2/gwt_uptake.py'
      - 'src/frankenstein2/gwt_workspace.py'
      - 'src/frankenstein2/grid10_interface.py'
      - 'tests/test_gwt_reentry_uptake_binding.py'
      - '.github/workflows/wp508-g2-uptake-reentry-binding-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile exact WP508 G4 dependency surface
        run: >-
          python -m py_compile
          src/frankenstein2/grid10_interface.py
          src/frankenstein2/gwt_workspace.py
          src/frankenstein2/gwt_uptake.py
          src/frankenstein2/gwt_reentry_provenance.py
          src/frankenstein2/gwt_reentry_uptake_binding.py
          tests/test_gwt_reentry_uptake_binding.py
      - name: WP508 G4 broadcast builder lineage falsification suite
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_gwt_reentry_uptake_binding.py
