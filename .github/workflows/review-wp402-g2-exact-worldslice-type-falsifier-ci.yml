name: Review WP402 G2 Exact WorldSlice Type Falsifier

on:
  pull_request:
    paths:
      - 'tests/test_wp402_g2_exact_worldslice_type_falsifier.py'
      - '.github/workflows/review-wp402-g2-exact-worldslice-type-falsifier-ci.yml'

permissions:
  contents: read

jobs:
  accepted-g2-merge-context-falsifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile PR merge-context source and independent falsifier
        run: python -m py_compile src/frankenstein2/sparse_world_basis.py src/frankenstein2/qubo_projection.py tests/test_wp402_g2_exact_worldslice_type_falsifier.py
      - name: Run accepted-G2 exact WorldSlice subtype falsifiers
        env:
          PYTHONPATH: src
        run: python tests/test_wp402_g2_exact_worldslice_type_falsifier.py -v
