name: F2 WP804 G3 Public Signal Digest Binding CI

on:
  push:
    branches:
      - main
      - trigger4/wp804-g3-public-signal-digest-binding-20260829
    paths:
      - 'src/frankenstein2/cognitive_goal_inference_benchmark.py'
      - 'tests/test_cognitive_goal_inference_benchmark.py'
      - 'tests/test_wp804_g2_producer_lineage_repair.py'
      - 'tests/test_wp804_g3_public_signal_digest_binding.py'
      - '.github/workflows/wp804-g3-public-signal-digest-binding-ci.yml'
  pull_request:
    paths:
      - 'src/frankenstein2/cognitive_goal_inference_benchmark.py'
      - 'tests/test_cognitive_goal_inference_benchmark.py'
      - 'tests/test_wp804_g2_producer_lineage_repair.py'
      - 'tests/test_wp804_g3_public_signal_digest_binding.py'
      - '.github/workflows/wp804-g3-public-signal-digest-binding-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile exact generation-3 target
        run: >-
          python -m py_compile
          src/frankenstein2/cognitive_microworld.py
          src/frankenstein2/cognitive_goal_inference_benchmark.py
          tests/test_cognitive_goal_inference_benchmark.py
          tests/test_wp804_g2_producer_lineage_repair.py
          tests/test_wp804_g3_public_signal_digest_binding.py
      - name: Generation-1 WP804 regression suite
        env:
          PYTHONPATH: src:.
        run: python -m unittest -v tests.test_cognitive_goal_inference_benchmark
      - name: Generation-2 producer-lineage regression suite
        env:
          PYTHONPATH: src:.
        run: python -m unittest -v tests.test_wp804_g2_producer_lineage_repair
      - name: Generation-3 public-signal digest binding regressions
        env:
          PYTHONPATH: src:.
        run: python -m unittest -v tests.test_wp804_g3_public_signal_digest_binding
