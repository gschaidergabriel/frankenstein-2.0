name: F2 WP604 Child Lifecycle CI

on:
  push:
    branches:
      - main
      - trigger4/wp604-child-lifecycle-20260829
    paths:
      - 'src/frankenstein2/child_lifecycle.py'
      - 'src/frankenstein2/native_child_abi.py'
      - 'src/frankenstein2/native_child_binding.py'
      - 'src/frankenstein2/causal_identity.py'
      - 'tests/test_child_lifecycle.py'
      - '.github/workflows/wp604-child-lifecycle-ci.yml'
  pull_request:
    paths:
      - 'src/frankenstein2/child_lifecycle.py'
      - 'src/frankenstein2/native_child_abi.py'
      - 'src/frankenstein2/native_child_binding.py'
      - 'src/frankenstein2/causal_identity.py'
      - 'tests/test_child_lifecycle.py'
      - '.github/workflows/wp604-child-lifecycle-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile src/frankenstein2/child_lifecycle.py tests/test_child_lifecycle.py
      - name: Child lifecycle falsification suite
        env:
          PYTHONPATH: src
        run: python tests/test_child_lifecycle.py -v
