name: F2 WP507 G3 OFFERED State Regression

on:
  pull_request:
    paths:
      - 'src/frankenstein2/gwt_uptake.py'
      - 'tests/review/test_wp507_g3_offered_state_falsifier.py'
      - '.github/workflows/review-wp507-g3-offered-state-falsifier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offered-state-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile src/frankenstein2/gwt_uptake.py tests/review/test_wp507_g3_offered_state_falsifier.py
      - name: Run OFFERED-state regression
        env:
          PYTHONPATH: src
        run: python tests/review/test_wp507_g3_offered_state_falsifier.py -v
