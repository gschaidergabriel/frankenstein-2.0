name: WP717 G3 Memory Fence One Shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wp717-g3-memory-fence-once.yml'

permissions:
  contents: write

jobs:
  apply-bounded-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh main, verify G3 ownership, and repair receipt-scoped memory relation
        env:
          CLAIM_ID: F2-WP-717-G3-GPT56SOL-MEMORY-GWT-LINEAGE-FENCES-20260831
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          from pathlib import Path
          import json
          import os

          claim = json.loads(Path('workpackages/active/F2-WP-717.json').read_text())
          assert claim['generation'] == 3, claim
          assert claim['claim_id'] == os.environ['CLAIM_ID'], claim
          assert claim['state'] == 'ACTIVE', claim
          assert 'reference-only' in claim['claimed_scope'], claim['claimed_scope']

          source_path = Path('src/frankenstein2/voice_heard_result_reentry.py')
          source = source_path.read_text()

          old_sig = '''    bindings: Iterable[tuple[MemoryLifecycleState, TypedMemoryRecord]],\n    heard_result_ref: str,\n    heard_result_sha256: str,\n) -> tuple[MemoryReferenceEvidence, ...]:\n    if type(event) is not CortexEventPacket:\n        raise VoiceHeardResultReentryError("memory event must be exact CortexEventPacket")\n    _text("heard_result_ref", heard_result_ref)\n    _sha256("heard_result_sha256", heard_result_sha256)\n'''
          new_sig = '''    bindings: Iterable[tuple[MemoryLifecycleState, TypedMemoryRecord]],\n    heard_result_ref: str | None = None,\n    heard_result_sha256: str | None = None,\n) -> tuple[MemoryReferenceEvidence, ...]:\n    if type(event) is not CortexEventPacket:\n        raise VoiceHeardResultReentryError("memory event must be exact CortexEventPacket")\n    if (heard_result_ref is None) != (heard_result_sha256 is None):\n        raise VoiceHeardResultReentryError("partial heard-result memory payload identity is forbidden")\n    if heard_result_ref is not None:\n        _text("heard_result_ref", heard_result_ref)\n        _sha256("heard_result_sha256", heard_result_sha256)\n'''
          assert source.count(old_sig) == 1, 'WP717 memory signature anchor drifted'
          source = source.replace(old_sig, new_sig, 1)

          old_relation = '''        if state.payload_ref != heard_result_ref or state.payload_sha256 != heard_result_sha256:\n            raise VoiceHeardResultReentryError("heard-result memory payload relation mismatch")\n'''
          new_relation = '''        if heard_result_ref is not None and (\n            state.payload_ref != heard_result_ref or state.payload_sha256 != heard_result_sha256\n        ):\n            raise VoiceHeardResultReentryError("heard-result memory payload relation mismatch")\n'''
          assert source.count(old_relation) == 1, 'WP717 memory relation anchor drifted'
          source = source.replace(old_relation, new_relation, 1)
          source_path.write_text(source)

          unit_path = Path('tests/test_voice_heard_result_reentry.py')
          unit = unit_path.read_text()
          unit = unit.replace(
              '    def test_vsr03_gwt_ref_and_factory_lineage_both_fail_closed(self) -> None:\n',
              '    def test_vsr03_gwt_ref_is_reference_only_but_wrong_ref_fails_closed(self) -> None:\n',
              1,
          )
          old_unit_expectation = '''        with self.assertRaisesRegex(VoiceHeardResultReentryError, "factory|lineage"):\n            validate_gwt_event_binding(event=exact, binding=binding)\n'''
          assert unit.count(old_unit_expectation) == 1, 'WP717 VSR03 legacy expectation anchor drifted'
          unit = unit.replace(
              old_unit_expectation,
              '        validate_gwt_event_binding(event=exact, binding=binding)\n',
              1,
          )
          unit_path.write_text(unit)

          composition_path = Path('tests/test_voice_heard_result_reentry_memory_context_composition.py')
          composition = composition_path.read_text()
          old_composition = '''        with self.subTest("VSR08_DIRECT_GWT_BINDING_WITHOUT_LINEAGE"):\n            direct_unsealed_binding = replace(gwt_binding, _factory_seal=None)\n            with self.assertRaises(VoiceHeardResultReentryError):\n                bind_completed_reentry(\n                    session=session,\n                    outcome=outcome,\n                    output_packets=cortex.outputs,\n                    close_event=close_event,\n                    context_item=context_item,\n                    cost_witness=cost_witness,\n                    context_view=context_view,\n                    memory_event=memory_event,\n                    memory_bindings=((memory_state, typed_memory),),\n                    gwt_event=gwt_event,\n                    gwt_binding=direct_unsealed_binding,\n                    provenance_refs=("test:wp717-vsr08",),\n                )\n'''
          new_composition = '''        with self.subTest("VSR08_DIRECT_GWT_BINDING_IS_REFERENCE_ONLY_ZERO_CREDIT"):\n            direct_unsealed_binding = replace(gwt_binding, _factory_seal=None)\n            direct_receipt = bind_completed_reentry(\n                session=session,\n                outcome=outcome,\n                output_packets=cortex.outputs,\n                close_event=close_event,\n                context_item=context_item,\n                cost_witness=cost_witness,\n                context_view=context_view,\n                memory_event=memory_event,\n                memory_bindings=((memory_state, typed_memory),),\n                gwt_event=gwt_event,\n                gwt_binding=direct_unsealed_binding,\n                provenance_refs=("test:wp717-vsr08",),\n            )\n            self.assertEqual(direct_receipt.gwt_binding_id, direct_unsealed_binding.binding_id)\n            self.assertEqual(direct_receipt.as_dict()["gwt_runtime_credit"], 0)\n            self.assertFalse(direct_receipt.as_dict()["whole_system_acceptance"])\n'''
          assert composition.count(old_composition) == 1, 'WP717 VSR08 legacy composition anchor drifted'
          composition = composition.replace(old_composition, new_composition, 1)
          composition_path.write_text(composition)
          PY
      - name: Run full WP717 repository discriminator set before commit
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python -m py_compile \
            src/frankenstein2/voice_heard_result_reentry.py \
            tests/test_voice_heard_result_reentry.py \
            tests/test_voice_heard_result_reentry_falsifiers.py \
            tests/test_voice_heard_result_reentry_memory_context_composition.py \
            tests/test_voice_heard_result_reentry_g3_falsifiers.py
          python -m unittest discover -s tests -p 'test_voice_heard_result_reentry*.py' -v
      - name: Commit bounded repair and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name 'GPT-5.6-Sol Trigger4'
          git config user.email 'trigger4@users.noreply.github.com'
          git rm .github/workflows/wp717-g3-memory-fence-once.yml
          git add \
            src/frankenstein2/voice_heard_result_reentry.py \
            tests/test_voice_heard_result_reentry.py \
            tests/test_voice_heard_result_reentry_memory_context_composition.py
          git commit -m 'trigger4: reconcile WP717 receipt-scoped memory fence'
          git pull --rebase origin main
          git push origin HEAD:main

# Trigger-4 dispatch marker: bounded G3 repair requested from current main.
