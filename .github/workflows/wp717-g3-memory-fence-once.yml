name: WP717 G3 Memory Fence One Shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wp717-g3-memory-fence-once.yml'

permissions:
  contents: write

jobs:
  apply-bounded-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh main, verify G3 ownership, and repair receipt-scoped memory relation
        env:
          CLAIM_ID: F2-WP-717-G3-GPT56SOL-MEMORY-GWT-LINEAGE-FENCES-20260831
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          from pathlib import Path
          import json
          import os

          claim = json.loads(Path('workpackages/active/F2-WP-717.json').read_text())
          assert claim['generation'] == 3, claim
          assert claim['claim_id'] == os.environ['CLAIM_ID'], claim
          assert claim['state'] == 'ACTIVE', claim
          assert 'reference-only' in claim['claimed_scope'], claim['claimed_scope']

          source_path = Path('src/frankenstein2/voice_heard_result_reentry.py')
          source = source_path.read_text()

          old_sig = '''    bindings: Iterable[tuple[MemoryLifecycleState, TypedMemoryRecord]],\n    heard_result_ref: str,\n    heard_result_sha256: str,\n) -> tuple[MemoryReferenceEvidence, ...]:\n    if type(event) is not CortexEventPacket:\n        raise VoiceHeardResultReentryError("memory event must be exact CortexEventPacket")\n    _text("heard_result_ref", heard_result_ref)\n    _sha256("heard_result_sha256", heard_result_sha256)\n'''
          new_sig = '''    bindings: Iterable[tuple[MemoryLifecycleState, TypedMemoryRecord]],\n    heard_result_ref: str | None = None,\n    heard_result_sha256: str | None = None,\n) -> tuple[MemoryReferenceEvidence, ...]:\n    if type(event) is not CortexEventPacket:\n        raise VoiceHeardResultReentryError("memory event must be exact CortexEventPacket")\n    if (heard_result_ref is None) != (heard_result_sha256 is None):\n        raise VoiceHeardResultReentryError("partial heard-result memory payload identity is forbidden")\n    if heard_result_ref is not None:\n        _text("heard_result_ref", heard_result_ref)\n        _sha256("heard_result_sha256", heard_result_sha256)\n'''
          assert source.count(old_sig) == 1, 'WP717 memory signature anchor drifted'
          source = source.replace(old_sig, new_sig, 1)

          old_relation = '''        if state.payload_ref != heard_result_ref or state.payload_sha256 != heard_result_sha256:\n            raise VoiceHeardResultReentryError("heard-result memory payload relation mismatch")\n'''
          new_relation = '''        if heard_result_ref is not None and (\n            state.payload_ref != heard_result_ref or state.payload_sha256 != heard_result_sha256\n        ):\n            raise VoiceHeardResultReentryError("heard-result memory payload relation mismatch")\n'''
          assert source.count(old_relation) == 1, 'WP717 memory relation anchor drifted'
          source = source.replace(old_relation, new_relation, 1)

          source_path.write_text(source)
          PY
      - name: Run full WP717 repository discriminator set before commit
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python -m py_compile \
            src/frankenstein2/voice_heard_result_reentry.py \
            tests/test_voice_heard_result_reentry.py \
            tests/test_voice_heard_result_reentry_falsifiers.py \
            tests/test_voice_heard_result_reentry_memory_context_composition.py \
            tests/test_voice_heard_result_reentry_g3_falsifiers.py
          python -m unittest discover -s tests -p 'test_voice_heard_result_reentry*.py' -v
      - name: Commit bounded repair and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name 'GPT-5.6-Sol Trigger4'
          git config user.email 'trigger4@users.noreply.github.com'
          git rm .github/workflows/wp717-g3-memory-fence-once.yml
          git add src/frankenstein2/voice_heard_result_reentry.py
          git commit -m 'trigger4: preserve WP717 standalone memory validator contract'
          git pull --rebase origin main
          git push origin HEAD:main
