name: REVIEW WP600 Constant String Subtype Falsifier

on:
  push:
    branches:
      - review/wp600-constant-string-subtype-falsifier-20260829
    paths:
      - 'src/frankenstein2/direct_delegate_router.py'
      - 'tests/review/test_wp600_constant_string_subtype_falsifier.py'
      - '.github/workflows/review-wp600-constant-string-subtype-falsifier.yml'
  pull_request:
    paths:
      - 'src/frankenstein2/direct_delegate_router.py'
      - 'tests/review/test_wp600_constant_string_subtype_falsifier.py'
      - '.github/workflows/review-wp600-constant-string-subtype-falsifier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  falsifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile exact WP600 surface and review discriminator
        run: python -m py_compile src/frankenstein2/direct_delegate_router.py tests/review/test_wp600_constant_string_subtype_falsifier.py
      - name: Require fail-closed constant-string authority and schema boundaries
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/review/test_wp600_constant_string_subtype_falsifier.py
