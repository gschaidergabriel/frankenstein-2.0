name: F2 WP203 Item-Type Falsifier

on:
  push:
    branches:
      - chatgpt/trigger4-wp203-item-type-falsifier-20260829
    paths:
      - 'tests/test_agency_state.py'
      - '.github/workflows/wp203-item-type-falsifier-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  falsifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile exact candidate test and accepted source
        run: python -m py_compile src/frankenstein2/agency_state.py tests/test_agency_state.py
      - name: Run AgencyState suite with type-confusion falsifiers
        env:
          PYTHONPATH: src
        run: python tests/test_agency_state.py -v
