name: F2 WP405 World Multi-View CI

on:
  push:
    branches:
      - main
      - trigger4/wp405-multiview-disagreement-g1
    paths:
      - 'src/frankenstein2/world_multiview.py'
      - 'src/frankenstein2/sparse_world_basis.py'
      - 'tests/test_world_multiview.py'
      - '.github/workflows/wp405-world-multiview-ci.yml'
  pull_request:
    paths:
      - 'src/frankenstein2/world_multiview.py'
      - 'src/frankenstein2/sparse_world_basis.py'
      - 'tests/test_world_multiview.py'
      - '.github/workflows/wp405-world-multiview-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  falsification:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile exact WP405 source and tests
        run: python -m py_compile src/frankenstein2/world_multiview.py tests/test_world_multiview.py
      - name: Multi-view disagreement falsification suite
        env:
          PYTHONPATH: src
        run: python tests/test_world_multiview.py -v
