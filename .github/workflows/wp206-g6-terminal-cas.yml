name: WP206 G6 atomic terminal CAS

on:
  push:
    branches:
      - 'chatgpt/trigger4-wp206-g6-terminal-cas-20260830'
    paths:
      - '.github/workflows/wp206-g6-terminal-cas.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Fast-forward only atomic reconciliation loop
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in $(seq 1 40); do
            git fetch origin main
            git checkout -B wp206-g6-cas origin/main
            base_sha="$(git rev-parse HEAD)"

            if [ -f workpackages/state_events/F2-WP-206/000003.json ]; then
              if [ "$(git hash-object workpackages/active/F2-WP-206.json)" = "7e06b093e1833d7499be001fd68a3bc26c9e5d43" ] \
                 && [ "$(git hash-object workpackages/receipts/F2-WP-206_G6_OWNED_SQLITE_SURFACE_REVISION_FENCE.json)" = "5ddf981d0ec5e4220b5428d00411db21d00d38b9" ] \
                 && [ "$(git hash-object workpackages/reconciliations/F2-WP-206/6-F2-WP-206-G6-GPT56SOL-EXTERNAL-SQLITE-REVISION-FENCE-20260830.json)" = "3094c7d1624b56c0b440b48c1bcc827aa56abbc4" ]; then
                echo 'ALREADY_TERMINALIZED_IDENTICALLY=true'
                exit 0
              fi
              echo 'WP206_G6_TERMINAL_CONFLICT=true'
              exit 42
            fi

            test "$(git hash-object workpackages/active/F2-WP-206.json)" = "5ff9aad551864f578dcaa551b2ae57972c95167d"
            git merge-base --is-ancestor 2e1619183450b85eddddf87136e2cece9c8ebfed HEAD

            BASE_SHA="$base_sha" python - <<'PY'
          import base64, os, zlib
          from pathlib import Path

          blobs = {
            'workpackages/active/F2-WP-206.json': '',
            'workpackages/receipts/F2-WP-206_G6_OWNED_SQLITE_SURFACE_REVISION_FENCE.json': '',
            'workpackages/reconciliations/F2-WP-206/6-F2-WP-206-G6-GPT56SOL-EXTERNAL-SQLITE-REVISION-FENCE-20260830.json': '',
            'workpackages/state_events/F2-WP-206/000003.json': ''
          }
          base = os.environ['BASE_SHA']
          for path, payload in blobs.items():
              raw = zlib.decompress(base64.b64decode(payload)).decode('utf-8')
              if path.endswith('/000003.json'):
                  raw = raw.replace('__BASE_SHA__', base)
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(raw, encoding='utf-8')
          PY

            test "$(git hash-object workpackages/active/F2-WP-206.json)" = "7e06b093e1833d7499be001fd68a3bc26c9e5d43"
            test "$(git hash-object workpackages/receipts/F2-WP-206_G6_OWNED_SQLITE_SURFACE_REVISION_FENCE.json)" = "5ddf981d0ec5e4220b5428d00411db21d00d38b9"
            test "$(git hash-object workpackages/reconciliations/F2-WP-206/6-F2-WP-206-G6-GPT56SOL-EXTERNAL-SQLITE-REVISION-FENCE-20260830.json)" = "3094c7d1624b56c0b440b48c1bcc827aa56abbc4"

            git add \
              workpackages/active/F2-WP-206.json \
              workpackages/receipts/F2-WP-206_G6_OWNED_SQLITE_SURFACE_REVISION_FENCE.json \
              workpackages/reconciliations/F2-WP-206/6-F2-WP-206-G6-GPT56SOL-EXTERNAL-SQLITE-REVISION-FENCE-20260830.json \
              workpackages/state_events/F2-WP-206/000003.json
            test "$(git diff --cached --name-only | wc -l)" -eq 4
            git commit -m 'trigger4: reconcile WP206 G6 acceptance atomically'
            if git push origin HEAD:main; then
              echo "WP206_G6_ATOMIC_TERMINAL_COMMIT=$(git rev-parse HEAD)"
              echo "WP206_G6_ATOMIC_BASE=$base_sha"
              exit 0
            fi
            echo "CAS_RETRY=$attempt"
            sleep 1
          done
          echo 'WP206_G6_ATOMIC_RECONCILIATION_STARVED=true'
          exit 75

      - name: Evidence scope
        if: always()
        run: |
          echo 'SCOPE=WP206_G6_REPOSITORY_COMPONENT_ONLY'
          echo 'TARGET_RUNTIME_CREDIT=0'
          echo 'PHYSICAL_GRID10_CREDIT=0'
          echo 'GWT_JSPACE_RUNTIME_CREDIT=0'
          echo 'EFFECT_COMPLETION_TRAINING_CREDIT=0'
          echo 'WHOLE_SYSTEM_ACCEPTANCE=false'
