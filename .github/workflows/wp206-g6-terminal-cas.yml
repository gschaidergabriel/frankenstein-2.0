name: WP206 G6 atomic terminal CAS

on:
  push:
    branches:
      - 'chatgpt/trigger4-wp206-g6-terminal-cas-20260830'
    paths:
      - '.github/workflows/wp206-g6-terminal-cas.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Fast-forward only atomic reconciliation loop
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          donor='origin/chatgpt/trigger4-wp206-g6-terminal-donor-20260830'

          for attempt in $(seq 1 40); do
            git fetch origin main chatgpt/trigger4-wp206-g6-terminal-donor-20260830
            git checkout -B wp206-g6-cas origin/main
            base_sha="$(git rev-parse HEAD)"
            echo "CAS_ATTEMPT=$attempt BASE=$base_sha"

            if [ -f workpackages/state_events/F2-WP-206/000003.json ]; then
              if [ "$(git hash-object workpackages/active/F2-WP-206.json)" = "7e06b093e1833d7499be001fd68a3bc26c9e5d43" ] \
                 && [ "$(git hash-object workpackages/receipts/F2-WP-206_G6_OWNED_SQLITE_SURFACE_REVISION_FENCE.json)" = "5ddf981d0ec5e4220b5428d00411db21d00d38b9" ] \
                 && [ "$(git hash-object workpackages/reconciliations/F2-WP-206/6-F2-WP-206-G6-GPT56SOL-EXTERNAL-SQLITE-REVISION-FENCE-20260830.json)" = "3094c7d1624b56c0b440b48c1bcc827aa56abbc4" ]; then
                echo 'ALREADY_TERMINALIZED_IDENTICALLY=true'
                exit 0
              fi
              echo 'WP206_G6_TERMINAL_CONFLICT=true'
              exit 42
            fi

            active_blob="$(git hash-object workpackages/active/F2-WP-206.json)"
            echo "ACTIVE_PRE_BLOB=$active_blob"
            test "$active_blob" = "5ff9aad551864f578dcaa551b2ae57972c95167d"
            git merge-base --is-ancestor 2e1619183450b85eddddf87136e2cece9c8ebfed HEAD

            git checkout "$donor" -- \
              workpackages/active/F2-WP-206.json \
              workpackages/receipts/F2-WP-206_G6_OWNED_SQLITE_SURFACE_REVISION_FENCE.json \
              workpackages/reconciliations/F2-WP-206/6-F2-WP-206-G6-GPT56SOL-EXTERNAL-SQLITE-REVISION-FENCE-20260830.json

            test "$(git hash-object workpackages/active/F2-WP-206.json)" = "7e06b093e1833d7499be001fd68a3bc26c9e5d43"
            test "$(git hash-object workpackages/receipts/F2-WP-206_G6_OWNED_SQLITE_SURFACE_REVISION_FENCE.json)" = "5ddf981d0ec5e4220b5428d00411db21d00d38b9"
            test "$(git hash-object workpackages/reconciliations/F2-WP-206/6-F2-WP-206-G6-GPT56SOL-EXTERNAL-SQLITE-REVISION-FENCE-20260830.json)" = "3094c7d1624b56c0b440b48c1bcc827aa56abbc4"

            mkdir -p workpackages/state_events/F2-WP-206
            cat > workpackages/state_events/F2-WP-206/000003.json <<EOF
          {
            "schema": "FRANKENSTEIN2_WORKPACKAGE_STATE_EVENT/v1",
            "workpackage_id": "F2-WP-206",
            "sequence": 3,
            "parent_event": "workpackages/state_events/F2-WP-206/000002.json",
            "parent_event_sha256": "b7013882a0b16e1afb1fafd09d7a859788e2ac29884006213ce4f32ff472f921",
            "event_class": "GENERATION_ACCEPTED_AFTER_EXECUTABLE_RECONCILIATION",
            "observed_main_sha": "$base_sha",
            "claim_generation": 6,
            "claim_id": "F2-WP-206-G6-GPT56SOL-EXTERNAL-SQLITE-REVISION-FENCE-20260830",
            "broad_status": "ACCEPTED",
            "phase": 2,
            "title": "WP206-owned same-inode SQLite surface revision fence",
            "evidence": [
              "PR754 merged as 2e1619183450b85eddddf87136e2cece9c8ebfed",
              "run 33318343169 / job 99275781290 exact-source G6 one-shot PASS",
              "PR-head predecessor and persistence integrations PASS",
              "merged-main run 33318429820 / job 99276009712 persistent-agency integration PASS",
              "workpackages/receipts/F2-WP-206_G6_OWNED_SQLITE_SURFACE_REVISION_FENCE.json",
              "workpackages/reconciliations/F2-WP-206/6-F2-WP-206-G6-GPT56SOL-EXTERNAL-SQLITE-REVISION-FENCE-20260830.json"
            ],
            "active_pointer_state": "ACCEPTED",
            "active_pointer_blob_sha": "7e06b093e1833d7499be001fd68a3bc26c9e5d43",
            "reconciliation_ref": "workpackages/reconciliations/F2-WP-206/6-F2-WP-206-G6-GPT56SOL-EXTERNAL-SQLITE-REVISION-FENCE-20260830.json",
            "reconciliation_blob_sha": "3094c7d1624b56c0b440b48c1bcc827aa56abbc4",
            "acceptance_receipt_ref": "workpackages/receipts/F2-WP-206_G6_OWNED_SQLITE_SURFACE_REVISION_FENCE.json",
            "acceptance_receipt_blob_sha": "5ddf981d0ec5e4220b5428d00411db21d00d38b9",
            "runtime_credit": 0,
            "installer_runtime_credit": 0,
            "physical_host_credit": 0,
            "vps_runtime_credit": 0,
            "physical_grid10_credit": 0,
            "gwt_runtime_credit": 0,
            "jspace_runtime_credit": 0,
            "training_credit": 0,
            "effect_credit": 0,
            "completion_credit": 0,
            "whole_system_acceptance": false,
            "created_at_utc": "2026-08-30T15:03:00Z"
          }
          EOF

            git add \
              workpackages/active/F2-WP-206.json \
              workpackages/receipts/F2-WP-206_G6_OWNED_SQLITE_SURFACE_REVISION_FENCE.json \
              workpackages/reconciliations/F2-WP-206/6-F2-WP-206-G6-GPT56SOL-EXTERNAL-SQLITE-REVISION-FENCE-20260830.json \
              workpackages/state_events/F2-WP-206/000003.json
            test "$(git diff --cached --name-only | wc -l)" -eq 4
            git commit -m 'trigger4: reconcile WP206 G6 acceptance atomically'

            set +e
            push_output="$(git push origin HEAD:main 2>&1)"
            push_status=$?
            set -e
            printf '%s\n' "$push_output"
            if [ "$push_status" -eq 0 ]; then
              echo "WP206_G6_ATOMIC_TERMINAL_COMMIT=$(git rev-parse HEAD)"
              echo "WP206_G6_ATOMIC_BASE=$base_sha"
              exit 0
            fi
            if printf '%s' "$push_output" | grep -Eqi 'non-fast-forward|fetch first|failed to push some refs'; then
              echo "CAS_RETRY=$attempt"
              sleep 1
              continue
            fi
            echo 'WP206_G6_ATOMIC_PUSH_NON_RETRYABLE=true'
            exit "$push_status"
          done

          echo 'WP206_G6_ATOMIC_RECONCILIATION_STARVED=true'
          exit 75

      - name: Evidence scope
        if: always()
        run: |
          echo 'SCOPE=WP206_G6_REPOSITORY_COMPONENT_ONLY'
          echo 'TARGET_RUNTIME_CREDIT=0'
          echo 'PHYSICAL_GRID10_CREDIT=0'
          echo 'GWT_JSPACE_RUNTIME_CREDIT=0'
          echo 'EFFECT_COMPLETION_TRAINING_CREDIT=0'
          echo 'WHOLE_SYSTEM_ACCEPTANCE=false'
