name: F2 WP404 Cognitive Micro-Lab CI

on:
  push:
    branches:
      - main
      - chatgpt/trigger4-wp404-cognitive-micro-lab-20260829
    paths:
      - 'src/frankenstein2/cognitive_micro_lab.py'
      - 'src/frankenstein2/sparse_world_basis.py'
      - 'src/frankenstein2/qubo_projection.py'
      - 'src/frankenstein2/physics_projection.py'
      - 'tests/test_cognitive_micro_lab.py'
      - '.github/workflows/wp404-cognitive-micro-lab-ci.yml'
  pull_request:
    paths:
      - 'src/frankenstein2/cognitive_micro_lab.py'
      - 'src/frankenstein2/sparse_world_basis.py'
      - 'src/frankenstein2/qubo_projection.py'
      - 'src/frankenstein2/physics_projection.py'
      - 'tests/test_cognitive_micro_lab.py'
      - '.github/workflows/wp404-cognitive-micro-lab-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  falsification:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile exact WP404 source and dependencies
        run: python -m py_compile src/frankenstein2/sparse_world_basis.py src/frankenstein2/qubo_projection.py src/frankenstein2/physics_projection.py src/frankenstein2/cognitive_micro_lab.py tests/test_cognitive_micro_lab.py
      - name: Cognitive Micro-Lab falsification suite
        env:
          PYTHONPATH: src
        run: python tests/test_cognitive_micro_lab.py -v
