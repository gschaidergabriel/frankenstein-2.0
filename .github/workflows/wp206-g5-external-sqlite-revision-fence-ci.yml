name: WP206 G5 external SQLite revision fence CI

on:
  pull_request:
    paths:
      - 'src/frankenstein2/persistent_agency_kernel.py'
      - 'src/frankenstein2/wp206_legacy_authority_recovery.py'
      - 'tests/falsifier_wp206_g5_external_sqlite_revision_drift.py'
      - 'tests/wp206_restart_probe.py'
      - 'tests/test_wp206_g4_repeat_provenance_binding.py'
      - 'tests/test_persistent_agency_kernel.py'
      - '.github/workflows/wp206-g5-external-sqlite-revision-fence-ci.yml'
      - 'workpackages/active/F2-WP-206.json'
  push:
    branches:
      - 'chatgpt/trigger4-wp206-g5-external-sqlite-revision-fence-20260830'
    paths:
      - 'src/frankenstein2/persistent_agency_kernel.py'
      - 'src/frankenstein2/wp206_legacy_authority_recovery.py'
      - 'tests/falsifier_wp206_g5_external_sqlite_revision_drift.py'
      - 'tests/wp206_restart_probe.py'
      - 'tests/test_wp206_g4_repeat_provenance_binding.py'
      - 'tests/test_persistent_agency_kernel.py'
      - '.github/workflows/wp206-g5-external-sqlite-revision-fence-ci.yml'
      - 'workpackages/active/F2-WP-206.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance-and-predecessor-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile exact G5 acceptance and predecessor surfaces
        run: >-
          python -m py_compile
          src/frankenstein2/persistent_agency_kernel.py
          src/frankenstein2/wp206_legacy_authority_recovery.py
          tests/falsifier_wp206_g5_external_sqlite_revision_drift.py
          tests/wp206_restart_probe.py
          tests/test_wp206_g4_repeat_provenance_binding.py
          tests/test_persistent_agency_kernel.py
      - name: Verify external same-inode SQLite revisions fail closed
        env:
          PYTHONPATH: src
        run: python tests/falsifier_wp206_g5_external_sqlite_revision_drift.py
      - name: Preserve WP206 G4 repeat-provenance regression
        if: always()
        env:
          PYTHONPATH: src
        run: python -m unittest -v tests.test_wp206_g4_repeat_provenance_binding
      - name: Preserve persistent-agency kernel regressions
        if: always()
        env:
          PYTHONPATH: src
        run: python -m unittest -v tests.test_persistent_agency_kernel
      - name: Preserve bounded evidence scope
        if: always()
        run: |
          echo 'CLASSIFICATION=WP206_G5_REPOSITORY_COMPONENT_ACCEPTANCE_CANDIDATE_ONLY'
          echo 'TARGET_RUNTIME_CREDIT=0'
          echo 'PHYSICAL_GRID10_CREDIT=0'
          echo 'GWT_JSPACE_RUNTIME_CREDIT=0'
          echo 'EFFECT_CREDIT=0'
          echo 'COMPLETION_CREDIT=0'
          echo 'TRAINING_CREDIT=0'
          echo 'WHOLE_SYSTEM_ACCEPTANCE=false'
