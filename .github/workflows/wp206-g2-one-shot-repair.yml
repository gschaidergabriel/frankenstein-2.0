name: WP206 G2 one-shot replay authority receipt repair

on:
  push:
    branches:
      - chatgpt/trigger4-wp206-g2-db-authority-receipt-repair-20260830

permissions:
  contents: write

jobs:
  verify-and-self-delete:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/trigger4-wp206-g2-db-authority-receipt-repair-20260830
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify exact replay authority-receipt fence is already fused
        shell: bash
        run: |
          grep -q 'db_inode, unifieddb_authority_receipt_sha256' src/frankenstein2/persistent_agency_kernel.py
          grep -q 'stored_authority_receipt_sha256 != self.authority_receipt_sha256' src/frankenstein2/persistent_agency_kernel.py
          grep -q 'CHECKPOINT_DB_AUTHORITY_RECEIPT_MISMATCH' src/frankenstein2/persistent_agency_kernel.py
          grep -q 'test_checkpoint_db_authority_receipt_tamper_fails_closed' tests/test_persistent_agency_kernel.py

      - name: Prove compile and full WP206 regression suite
        env:
          PYTHONPATH: src
        run: |
          python -m py_compile src/frankenstein2/persistent_agency_kernel.py tests/test_persistent_agency_kernel.py tests/wp206_restart_probe.py tests/test_wp206_g2_db_authority_receipt.py
          python tests/test_persistent_agency_kernel.py -v
          python tests/test_wp206_g2_db_authority_receipt.py -v

      - name: Remove temporary one-shot workflow after successful verification
        shell: bash
        run: |
          rm .github/workflows/wp206-g2-one-shot-repair.yml
          git config user.name 'GPT-5.6-Sol Trigger4'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/wp206-g2-one-shot-repair.yml
          git diff --cached --check
          git commit -m 'trigger4: retire WP206 G2 one-shot verifier after green regression'
          git push origin HEAD:chatgpt/trigger4-wp206-g2-db-authority-receipt-repair-20260830
