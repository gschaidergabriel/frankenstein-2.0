name: F2 WP206 Persistent Agency Integration CI

on:
  push:
    branches:
      - main
      - chatgpt/trigger4-wp206-g1-persistent-agency-integration-20260829
      - chatgpt/trigger4-wp206-g2-authority-receipt-repair-20260830
    paths:
      - 'src/frankenstein2/persistent_agency_kernel.py'
      - 'src/frankenstein2/agency_state.py'
      - 'src/frankenstein2/goal_lifecycle.py'
      - 'src/frankenstein2/persistent_pulse.py'
      - 'src/frankenstein2/state_fingerprint.py'
      - 'src/frankenstein2/wake_hold.py'
      - 'src/state/unifieddb_identity.py'
      - 'tests/test_persistent_agency_kernel.py'
      - 'tests/test_wp206_unifieddb_authority_receipt_replay_falsifier.py'
      - 'tests/wp206_restart_probe.py'
      - '.github/workflows/wp206-persistent-agency-ci.yml'
  pull_request:
    paths:
      - 'src/frankenstein2/persistent_agency_kernel.py'
      - 'src/frankenstein2/agency_state.py'
      - 'src/frankenstein2/goal_lifecycle.py'
      - 'src/frankenstein2/persistent_pulse.py'
      - 'src/frankenstein2/state_fingerprint.py'
      - 'src/frankenstein2/wake_hold.py'
      - 'src/state/unifieddb_identity.py'
      - 'tests/test_persistent_agency_kernel.py'
      - 'tests/test_wp206_unifieddb_authority_receipt_replay_falsifier.py'
      - 'tests/wp206_restart_probe.py'
      - '.github/workflows/wp206-persistent-agency-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-subprocess-restart:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile exact WP206 G2 surface
        run: >-
          python -m py_compile
          src/frankenstein2/persistent_agency_kernel.py
          tests/test_persistent_agency_kernel.py
          tests/test_wp206_unifieddb_authority_receipt_replay_falsifier.py
          tests/wp206_restart_probe.py
      - name: Persistent Agency fresh-process regression suite
        env:
          PYTHONPATH: src
        run: python tests/test_persistent_agency_kernel.py -v
      - name: UnifiedDB authority receipt replay-fence regression
        env:
          PYTHONPATH: src
        run: python tests/test_wp206_unifieddb_authority_receipt_replay_falsifier.py -v
