name: Review WP508 Reentry Payload Binding Falsifier

on:
  pull_request:
    paths:
      - 'src/frankenstein2/gwt_reentry_provenance.py'
      - 'src/frankenstein2/gwt_workspace.py'
      - 'src/frankenstein2/grid10_interface.py'
      - 'tests/test_wp508_reentry_payload_binding_falsifier.py'
      - '.github/workflows/review-wp508-reentry-payload-binding-falsifier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  falsifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile exact review surface
        run: >-
          python -m py_compile
          src/frankenstein2/grid10_interface.py
          src/frankenstein2/gwt_workspace.py
          src/frankenstein2/gwt_reentry_provenance.py
          tests/test_wp508_reentry_payload_binding_falsifier.py
      - name: Execute preregistered payload-binding falsifier
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_wp508_reentry_payload_binding_falsifier.py
