name: Trigger4 WP900 G10 Minimal Behavior State Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger4-wp900-g10-minimal-state-repair.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: trigger4-wp900-g10-minimal-state-repair
  cancel-in-progress: false

jobs:
  repair-g10-minimal-state:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Refresh and verify repair subject
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B trigger4-g10-minimal-state origin/main
          test "$(git rev-parse HEAD:src/frankenstein2/gwt_independent_semantic_mediator.py)" = "6daa208be2d3da7688f7df5f05f0e7c66da98775"
          test "$(git rev-parse HEAD:tests/test_wp900_g10_independent_semantic_mediator.py)" = "e37018e7d5527adc030ffca2cd46689adb6357f1"

      - name: Remove nonsemantic topology from behavior-capable state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          src_path = Path('src/frankenstein2/gwt_independent_semantic_mediator.py')
          test_path = Path('tests/test_wp900_g10_independent_semantic_mediator.py')
          src = src_path.read_text()
          tests = test_path.read_text()

          state_block = '''@dataclass(frozen=True, slots=True, kw_only=True)
          class MediatedSemanticState:
              canonical_semantic_json: str
              _factory_seal: object | None = field(default=None, init=False, repr=False, compare=False)
              _factory_sha256: str | None = field(default=None, init=False, repr=False, compare=False)

              schema = MEDIATED_SEMANTIC_STATE_SCHEMA
              repository_ci_credit = 0
              target_environment_component_runtime_credit = 0
              semantic_gwt_runtime_credit = 0
              jspace_runtime_credit = 0
              whole_system_acceptance = False

              def __post_init__(self) -> None:
                  semantic = _strict_json(self.canonical_semantic_json.encode("utf-8"))
                  canonical = _canonical_json(semantic)
                  if canonical != self.canonical_semantic_json:
                      raise G10MediatorError("semantic JSON is not canonical")

              def as_dict(self) -> dict[str, Any]:
                  return {
                      "schema": self.schema,
                      "canonical_semantic_json": self.canonical_semantic_json,
                  }

              def sha256(self) -> str:
                  return _digest(self.as_dict())


          def admit_mediated_semantic_state(
              *,
              mediator: IndependentSemanticMediatorReceipt,
              wire: bytes,
              trial_process_identity: str,
          ) -> MediatedSemanticState:
              """Verifier-side admission.

              ``trial_process_identity`` is verifier-only compatibility input.  It is
              checked against the source identity but is deliberately not persisted in
              the behavior-capable state.  Topology authority belongs to external
              runtime/readback evidence, never to this logical label.
              """
              validate_semantic_mediator_receipt(mediator)
              expected_wire = mediator.to_wire()
              if wire != expected_wire:
                  raise G10MediatorError("trial wire was not emitted by the factory-valid semantic mediator")
              value = _strict_json(wire)
              if type(value) is not dict or set(value) != {"schema", "canonical_semantic_json"}:
                  raise G10MediatorError("invalid treatment-blind mediator wire envelope")
              if value["schema"] != SEMANTIC_MEDIATOR_WIRE_SCHEMA:
                  raise G10MediatorError("invalid treatment-blind mediator wire schema")
              canonical = _canonical_json(_strict_json(value["canonical_semantic_json"].encode("utf-8")))
              if canonical != value["canonical_semantic_json"]:
                  raise G10MediatorError("wire semantic JSON is not canonical")
              if canonical != mediator.canonical_semantic_json:
                  raise G10MediatorError("trial wire semantic state differs from source mediator")
              trial_identity = _text("trial_process_identity", trial_process_identity)
              if trial_identity == mediator.source_process_identity:
                  raise G10MediatorError("source and trial process identities must differ")
              state = MediatedSemanticState(canonical_semantic_json=canonical)
              return _seal(state, _STATE_FACTORY)


          def validate_mediated_semantic_state'''

          src, n = re.subn(
              r'@dataclass\(frozen=True, slots=True, kw_only=True\)\nclass MediatedSemanticState:.*?\n\ndef validate_mediated_semantic_state',
              state_block,
              src,
              count=1,
              flags=re.S,
          )
          assert n == 1, f'MediatedSemanticState replacement count={n}'

          old_loop = '''    for mediator, state, receipt in zip(mediators, states, execution_receipts):
                  source_wire = mediator.to_wire()
                  if hashlib.sha256(source_wire).hexdigest() != state.wire_sha256:
                      raise G10MediatorError("mediated state does not bind exact source-authority trial wire")
                  if state.canonical_semantic_json != mediator.canonical_semantic_json:
                      raise G10MediatorError("mediated state semantic bytes differ from source authority")
                  if state.semantic_sha256 != mediator.semantic_sha256:
                      raise G10MediatorError("mediated state semantic digest differs from source authority")
                  if state.trial_process_identity == mediator.source_process_identity:
                      raise G10MediatorError("source and trial process identities must differ")
                  if receipt.state_sha256 != state.sha256():
                      raise G10MediatorError("execution receipt does not bind corresponding mediated state")
                  if receipt.executor_plan_sha256 != execution_receipts[0].executor_plan_sha256:
                      raise G10MediatorError("executor plan changed across crossover")'''
          new_loop = '''    for mediator, state, receipt in zip(mediators, states, execution_receipts):
                  source_wire = mediator.to_wire()
                  if state.canonical_semantic_json != mediator.canonical_semantic_json:
                      raise G10MediatorError("mediated state semantic bytes differ from source authority")
                  if hashlib.sha256(state.canonical_semantic_json.encode("utf-8")).hexdigest() != mediator.semantic_sha256:
                      raise G10MediatorError("mediated state semantic digest differs from source authority")
                  if receipt.state_sha256 != state.sha256():
                      raise G10MediatorError("execution receipt does not bind corresponding mediated state")
                  if receipt.executor_plan_sha256 != execution_receipts[0].executor_plan_sha256:
                      raise G10MediatorError("executor plan changed across crossover")'''
          assert old_loop in src, 'crossover loop subject not found'
          src = src.replace(old_loop, new_loop, 1)

          old_candidate = '''        wire_sha256s=tuple(state.wire_sha256 for state in states),  # type: ignore[arg-type]
                  source_process_identities=tuple(mediator.source_process_identity for mediator in mediators),  # type: ignore[arg-type]
                  trial_process_identities=tuple(state.trial_process_identity for state in states),  # type: ignore[arg-type]
                  child_pids=tuple(receipt.child_pid for receipt in execution_receipts),  # type: ignore[arg-type]'''
          new_candidate = '''        wire_sha256s=tuple(hashlib.sha256(mediator.to_wire()).hexdigest() for mediator in mediators),  # type: ignore[arg-type]
                  source_process_identities=tuple(mediator.source_process_identity for mediator in mediators),  # type: ignore[arg-type]
                  trial_process_identities=tuple(f"executor-child-pid:{receipt.child_pid}" for receipt in execution_receipts),  # type: ignore[arg-type]
                  child_pids=tuple(receipt.child_pid for receipt in execution_receipts),  # type: ignore[arg-type]'''
          assert old_candidate in src, 'candidate construction subject not found'
          src = src.replace(old_candidate, new_candidate, 1)

          old_direct = '''    forged = MediatedSemanticState(
                  canonical_semantic_json=canonical,
                  semantic_sha256=hashlib.sha256(canonical.encode()).hexdigest(),
                  wire_sha256="f" * 64,
                  trial_process_identity="trial-process:g10:direct-forge",
              )'''
          new_direct = '''    forged = MediatedSemanticState(canonical_semantic_json=canonical)'''
          assert old_direct in tests, 'direct-state regression subject not found'
          tests = tests.replace(old_direct, new_direct, 1)

          anchor = '''    assert behavioral_input_keys().isdisjoint(FORBIDDEN_BEHAVIORAL_INPUT_KEYS)'''
          addition = '''    assert behavioral_input_keys().isdisjoint(FORBIDDEN_BEHAVIORAL_INPUT_KEYS)
              public_state_slots = {name for name in MediatedSemanticState.__slots__ if not name.startswith("_")}
              assert public_state_slots == {"canonical_semantic_json"}
              state = admit_mediated_semantic_state(
                  mediator=mediator,
                  wire=wire,
                  trial_process_identity="trial-process:g10:1",
              )
              assert not hasattr(state, "trial_process_identity")
              assert not hasattr(state, "wire_sha256")
              assert not hasattr(state, "semantic_sha256")'''
          assert anchor in tests, 'trial-surface anchor not found'
          tests = tests.replace(anchor, addition, 1)

          src_path.write_text(src)
          test_path.write_text(tests)
          PY

      - name: Run G8 G9 G10 regression gates
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$PWD/src:$PWD/tests:$PWD" python3 -m pytest -q \
            tests/test_wp900_g10_independent_semantic_mediator.py \
            tests/test_wp900_g9_semantic_content_causality.py \
            tests/test_wp900_g9_reentry_only_execution.py \
            tests/test_wp900_g8_reentry_observation_window.py \
            tests/test_wp900_g8_causal_admission_fence.py

      - name: Commit repair without creating a second authority
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Trigger4 G10 Repair'
          git config user.email 'trigger4-g10-repair@local.invalid'
          git rm .github/workflows/trigger4-wp900-g10-minimal-state-repair.yml
          git add src/frankenstein2/gwt_independent_semantic_mediator.py tests/test_wp900_g10_independent_semantic_mediator.py
          git commit -m 'trigger4(WP900 G10): remove trial metadata from behavior state'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          echo 'CONCURRENCY_RETRY: main kept moving; no force push attempted' >&2
          exit 75
