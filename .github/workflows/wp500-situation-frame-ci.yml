name: F2 WP500 SituationFrame CI

on:
  push:
    branches:
      - main
      - chatgpt/f2-wp500-situation-frame-g1-20260829
    paths:
      - 'src/frankenstein2/situation_frame.py'
      - 'tests/test_situation_frame.py'
      - '.github/workflows/wp500-situation-frame-ci.yml'
  pull_request:
    paths:
      - 'src/frankenstein2/situation_frame.py'
      - 'tests/test_situation_frame.py'
      - '.github/workflows/wp500-situation-frame-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile src/frankenstein2/situation_frame.py tests/test_situation_frame.py
      - name: SituationFrame falsification suite
        env:
          PYTHONPATH: src
        run: python tests/test_situation_frame.py -v
