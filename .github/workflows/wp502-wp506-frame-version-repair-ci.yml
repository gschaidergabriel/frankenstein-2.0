name: F2 WP502 WP506 Frame Version Repair CI

on:
  push:
    branches:
      - 'trigger4/wp502-wp506-frame-version-repair-20260829'
    paths:
      - 'src/frankenstein2/hyperposition.py'
      - 'src/frankenstein2/gwt_workspace.py'
      - 'tests/test_hyperposition.py'
      - 'tests/test_gwt_workspace.py'
      - '.github/workflows/wp502-wp506-frame-version-repair-ci.yml'
  pull_request:
    paths:
      - 'src/frankenstein2/hyperposition.py'
      - 'src/frankenstein2/gwt_workspace.py'
      - 'tests/test_hyperposition.py'
      - 'tests/test_gwt_workspace.py'
      - '.github/workflows/wp502-wp506-frame-version-repair-ci.yml'

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile repaired dependency boundary
        run: python -m py_compile src/frankenstein2/hyperposition.py src/frankenstein2/gwt_workspace.py tests/test_hyperposition.py tests/test_gwt_workspace.py
      - name: Run WP502 plus WP506 falsification suites
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_hyperposition.py tests/test_gwt_workspace.py
