name: Frankenstein 2.0 Effect Invocation Correlation CI

on:
  push:
    branches: [main]
    paths:
      - 'src/frankenstein2/causal_identity.py'
      - 'src/frankenstein2/native_child_binding.py'
      - 'src/frankenstein2/deferred_causal_return.py'
      - 'src/frankenstein2/deferred_execution_verification.py'
      - 'src/frankenstein2/effect_invocation_correlation.py'
      - 'src/frankenstein2/pre_dispatch_effect.py'
      - 'src/state/execution_completion.py'
      - 'tests/test_native_child_binding.py'
      - 'tests/test_deferred_causal_return.py'
      - 'tests/test_execution_completion.py'
      - 'tests/test_deferred_execution_verification.py'
      - 'tests/test_effect_invocation_correlation.py'
      - 'tests/test_pre_dispatch_effect.py'
      - '.github/workflows/effect-invocation-correlation-ci.yml'
  pull_request:
    paths:
      - 'src/frankenstein2/effect_invocation_correlation.py'
      - 'src/frankenstein2/pre_dispatch_effect.py'
      - 'tests/test_effect_invocation_correlation.py'
      - 'tests/test_pre_dispatch_effect.py'
      - '.github/workflows/effect-invocation-correlation-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  effect-invocation-correlation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile call-scoped effect correlation path
        run: >-
          python -m py_compile
          src/frankenstein2/causal_identity.py
          src/frankenstein2/native_child_binding.py
          src/frankenstein2/deferred_causal_return.py
          src/frankenstein2/deferred_execution_verification.py
          src/frankenstein2/effect_invocation_correlation.py
          src/frankenstein2/pre_dispatch_effect.py
          src/state/execution_completion.py
          tests/test_native_child_binding.py
          tests/test_deferred_causal_return.py
          tests/test_execution_completion.py
          tests/test_deferred_execution_verification.py
          tests/test_effect_invocation_correlation.py
          tests/test_pre_dispatch_effect.py
      - name: Run Stage-1 identity regressions
        run: >-
          python -m unittest
          tests.test_native_child_binding
          tests.test_deferred_causal_return
          tests.test_execution_completion
          tests.test_deferred_execution_verification
          -v
      - name: Run legacy result-bound effect correlation falsifier
        run: python tests/test_effect_invocation_correlation.py
      - name: Run true pre-dispatch temporal-causality falsifier
        run: python tests/test_pre_dispatch_effect.py
