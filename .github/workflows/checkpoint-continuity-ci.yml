name: F2 Checkpoint Continuity CI

on:
  push:
    branches: [main]
    paths:
      - 'tools/validate_current_checkpoint.py'
      - 'tests/test_validate_current_checkpoint.py'
      - 'tools/validate_checkpoint.py'
      - 'tests/test_validate_checkpoint.py'
      - 'checkpoints/CURRENT.json'
      - 'workpackages/STATE.json'
      - 'workpackages/active/**'
      - 'workpackages/claims/**'
      - 'workpackages/reconciliations/**'
      - '.github/workflows/checkpoint-continuity-ci.yml'
  pull_request:
    paths:
      - 'tools/validate_current_checkpoint.py'
      - 'tests/test_validate_current_checkpoint.py'
      - 'tools/validate_checkpoint.py'
      - 'tests/test_validate_checkpoint.py'
      - 'checkpoints/CURRENT.json'
      - 'workpackages/STATE.json'
      - 'workpackages/active/**'
      - 'workpackages/claims/**'
      - 'workpackages/reconciliations/**'
      - '.github/workflows/checkpoint-continuity-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile validators
        run: >-
          python -m py_compile
          tools/validate_current_checkpoint.py
          tests/test_validate_current_checkpoint.py
          tools/validate_checkpoint.py
          tests/test_validate_checkpoint.py
      - name: Core deterministic regression tests
        run: python tests/test_validate_current_checkpoint.py -v
      - name: Repository-bound deterministic regression tests
        run: python tests/test_validate_checkpoint.py -v
      - name: Validate canonical current checkpoint through successor-dynamic repository binding
        run: python tools/validate_checkpoint.py --repo-root . --json
