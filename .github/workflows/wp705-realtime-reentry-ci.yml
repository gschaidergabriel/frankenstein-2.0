name: F2 WP705 Realtime Re-entry CI

on:
  push:
    branches:
      - main
      - trigger4/wp705-realtime-reentry-g1
    paths:
      - 'src/frankenstein2/realtime_reentry.py'
      - 'tests/test_realtime_reentry.py'
      - '.github/workflows/wp705-realtime-reentry-ci.yml'
  pull_request:
    paths:
      - 'src/frankenstein2/realtime_reentry.py'
      - 'tests/test_realtime_reentry.py'
      - '.github/workflows/wp705-realtime-reentry-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile src/frankenstein2/realtime_reentry.py tests/test_realtime_reentry.py
      - name: Realtime re-entry falsification suite
        env:
          PYTHONPATH: src
        run: python tests/test_realtime_reentry.py -v
