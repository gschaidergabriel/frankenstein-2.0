name: Frankenstein 2.0 Causal Identity CI

on:
  push:
    branches: [main]
    paths:
      - 'src/frankenstein2/causal_identity.py'
      - 'src/frankenstein2/causal_authority_binding.py'
      - 'tests/test_causal_identity.py'
      - 'tests/test_causal_authority_binding.py'
      - '.github/workflows/causal-identity-ci.yml'
  pull_request:
    paths:
      - 'src/frankenstein2/causal_identity.py'
      - 'src/frankenstein2/causal_authority_binding.py'
      - 'tests/test_causal_identity.py'
      - 'tests/test_causal_authority_binding.py'
      - '.github/workflows/causal-identity-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  causal-identity-and-authority-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile current causal identity regressions
        run: >-
          python -m py_compile
          src/frankenstein2/causal_identity.py
          src/frankenstein2/causal_authority_binding.py
          tests/test_causal_identity.py
          tests/test_causal_authority_binding.py
      - name: Run causal identity unit regression
        run: python tests/test_causal_identity.py
      - name: Run causal authority cross-plane regression
        run: python tests/test_causal_authority_binding.py
