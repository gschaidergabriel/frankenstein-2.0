name: Trigger4 Deterministic Release Candidate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trigger4-release-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: '1'
      EXPECTED_SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact workflow source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prove checkout identity and tracked cleanliness
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}

      - name: Run accepted release, receipt-binding, evidence-ingest, and host-transition regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_release_archive.py' -v
          python -m unittest discover -s tests -p 'test_release_artifact_subject.py' -v
          python -m unittest discover -s tests -p 'test_receipt_content_binding.py' -v
          python -m unittest discover -s tests -p 'test_portable_release_static_completeness.py' -v
          python -m unittest discover -s tests -p 'test_artifact_bound_static_completeness.py' -v
          python -m unittest discover -s tests -p 'test_artifact_bound_clean_machine.py' -v
          python -m unittest discover -s tests -p 'test_artifact_bound_clean_machine_evidence.py' -v
          python -m unittest discover -s tests -p 'test_host_transition.py' -v

      - name: Exercise canonical effect-authority bridge before release construction
        shell: bash
        run: |
          set -euo pipefail
          python tests/test_canonical_effect_authority_bridge.py

      - name: Exercise accepted WP900-WP206 fresh-process persistence chain
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v \
            tests.test_wp900_wp206_two_process_restart \
            tests.test_whole_loop_persistence_integration \
            tests.test_restart_recovery_persisted_row_attestation

      - name: Exercise accepted WP900 G4 causal-readback regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q \
            tests/test_gwt_causal_runtime_readback.py \
            tests/test_gwt_causal_runtime_readback_context_gate.py \
            tests/test_gwt_runtime_witness.py \
            tests/test_gwt_uptake.py \
            tests/test_gwt_reentry_uptake_binding.py

      - name: Build candidate twice from exact Git tree through WP1112
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_release_candidate.py --output-dir dist/release-a > dist-a.json
          python tools/build_release_candidate.py --output-dir dist/release-b > dist-b.json

      - name: Prove shipped Frankenstein package import closure from exact archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist/import-closure
          mkdir -p dist/import-closure
          python - <<'PY'
          import compileall
          import os
          from pathlib import Path
          import subprocess
          import sys
          import zipfile

          archive = Path('dist/release-a/frankenstein-2.0.zip')
          root = Path('dist/import-closure')
          with zipfile.ZipFile(archive) as zf:
              zf.extractall(root)

          source_root = root / 'src'
          package_root = source_root / 'frankenstein2'
          assert package_root.is_dir(), package_root
          assert compileall.compile_dir(str(package_root), quiet=1, force=True)

          modules = []
          for path in sorted(package_root.rglob('*.py')):
              rel = path.relative_to(source_root).with_suffix('')
              parts = list(rel.parts)
              if parts[-1] == '__init__':
                  parts = parts[:-1]
              module = '.'.join(parts)
              if module and module not in modules:
                  modules.append(module)

          env = dict(os.environ)
          env['PYTHONPATH'] = str(source_root)
          env['PYTHONDONTWRITEBYTECODE'] = '1'
          for module in modules:
              subprocess.run(
                  [sys.executable, '-I', '-c', f'import sys; sys.path.insert(0, {str(source_root)!r}); __import__({module!r})'],
                  check=True,
                  env=env,
              )
          print(f'compiled_and_imported_modules={len(modules)}')
          PY

      - name: Prove byte-for-byte reproducibility and bounded credit
        shell: bash
        run: |
          set -euo pipefail
          diff -qr dist/release-a dist/release-b
          cmp dist/release-a/frankenstein-2.0.zip dist/release-b/frankenstein-2.0.zip
          cmp dist/release-a/frankenstein-2.0-prehandoff.json dist/release-b/frankenstein-2.0-prehandoff.json
          cmp dist/release-a/frankenstein-2.0-content-bound-prehandoff.json dist/release-b/frankenstein-2.0-content-bound-prehandoff.json
          cmp dist/release-a/frankenstein-2.0-artifact-bound-static-completeness.json dist/release-b/frankenstein-2.0-artifact-bound-static-completeness.json
          cmp dist/release-a/release-bundle-index.json dist/release-b/release-bundle-index.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          index = json.loads(Path('dist/release-a/release-bundle-index.json').read_text())
          static = index['artifact_bound_static_completeness']
          assert index['source_commit'] == os.environ['EXPECTED_SOURCE_SHA']
          assert index['artifact_subject']['status'] == 'READY_FOR_REAL_HOST_HANDOFF'
          assert index['artifact_subject']['static_status'] == 'READY_FOR_REAL_HOST_HANDOFF'
          assert index['artifact_subject']['static_violations'] == []
          assert index['prehandoff_receipt']['content_bound_status'] == 'READY_FOR_REAL_HOST_HANDOFF'
          assert static['status'] == 'STATIC_COMPLETE_FOR_REAL_HOST_ACCEPTANCE'
          assert static['static_status'] == 'STATIC_COMPLETE_FOR_REAL_HOST_ACCEPTANCE'
          assert static['static_violations'] == []
          assert static['artifact_sha256'] == index['archive']['sha256']
          assert static['release_manifest_sha256'] == index['archive']['manifest_sha256']
          assert static['artifact_subject_sha256'] == index['artifact_subject']['sha256']
          assert static['filename'] in index['files']
          assert index['files'][static['filename']]['sha256'] == static['sha256']
          assert index['credits']['repository_release_build_credit'] == 1
          for key in (
              'clean_machine_runtime_credit',
              'physical_host_credit',
              'vps_runtime_credit',
              'provider_model_credit',
              'effect_credit',
              'completion_credit',
          ):
              assert index['credits'][key] == 0, (key, index['credits'][key])
          assert index['credits']['whole_system_acceptance'] is False
          print(json.dumps(index, indent=2, sort_keys=True))
          PY

      - name: Upload exact release-candidate evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: frankenstein-2.0-release-candidate-${{ github.sha }}
          path: dist/release-a/
          if-no-files-found: error
          retention-days: 30
