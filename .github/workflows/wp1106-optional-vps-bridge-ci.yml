name: WP1106 Optional VPS Bridge CI

on:
  push:
    branches:
      - chatgpt/f2-wp1106-optional-vps-bridge-20260829
    paths:
      - 'src/frankenstein2/optional_vps_bridge.py'
      - 'tests/test_optional_vps_bridge.py'
      - '.github/workflows/wp1106-optional-vps-bridge-ci.yml'
      - 'workpackages/deltas/F2-WP-1106/**'
  pull_request:
    paths:
      - 'src/frankenstein2/optional_vps_bridge.py'
      - 'tests/test_optional_vps_bridge.py'
      - '.github/workflows/wp1106-optional-vps-bridge-ci.yml'
      - 'workpackages/deltas/F2-WP-1106/**'

permissions:
  contents: read

jobs:
  optional-vps-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile src/frankenstein2/optional_vps_bridge.py tests/test_optional_vps_bridge.py
      - name: Fail-closed optional bridge suite
        env:
          PYTHONPATH: src
        run: python tests/test_optional_vps_bridge.py -v
