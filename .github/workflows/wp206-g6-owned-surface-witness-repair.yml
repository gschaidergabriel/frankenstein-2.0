name: WP206 G6 owned-surface witness repair

on:
  push:
    branches:
      - 'chatgpt/trigger4-wp206-g6-external-sqlite-revision-fence-20260830'
    paths:
      - '.github/workflows/wp206-g6-owned-surface-witness-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Apply exact-anchor owned-surface repair
        run: python tools/trigger4_wp206_g6_owned_surface_witness_repair.py

      - name: Compile repaired G6 surface
        run: >-
          python -m py_compile
          src/frankenstein2/persistent_agency_kernel.py
          tools/trigger4_wp206_g6_owned_surface_witness_repair.py
          tests/test_wp206_g6_owned_surface_witness.py
          tests/falsifier_wp206_g6_external_sqlite_revision_drift.py
          tests/wp206_restart_probe.py
          tests/test_wp206_g5_evidence_subject_binding.py
          tests/test_wp206_g4_repeat_provenance_binding.py
          tests/test_wp206_legacy_authority_recovery.py
          tests/test_persistent_agency_kernel.py
          src/frankenstein2/causal_identity.py
          src/state/delivery_lifecycle.py
          src/state/delivery_store.py
          src/state/unifieddb_identity.py

      - name: Execute G6 owned-surface acceptance matrix
        env:
          PYTHONPATH: src
        run: python tests/test_wp206_g6_owned_surface_witness.py

      - name: Execute G6 external WP206-owned drift discriminator
        env:
          PYTHONPATH: src
        run: python tests/falsifier_wp206_g6_external_sqlite_revision_drift.py

      - name: Execute predecessors and capture exact diagnostics
        id: predecessors
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: |
          mkdir -p wp206-g6-owned-witness-diagnostics
          failed=0
          run_case() {
            name="$1"
            shift
            set +e
            "$@" >"wp206-g6-owned-witness-diagnostics/${name}.log" 2>&1
            rc=$?
            set -e
            cat "wp206-g6-owned-witness-diagnostics/${name}.log"
            printf '%s\n' "$rc" >"wp206-g6-owned-witness-diagnostics/${name}.exit"
            if [ "$rc" -ne 0 ]; then failed=1; fi
          }
          run_case g5 python tests/test_wp206_g5_evidence_subject_binding.py -v
          run_case g4 python tests/test_wp206_g4_repeat_provenance_binding.py -v
          run_case g3 python tests/test_wp206_legacy_authority_recovery.py -v
          run_case kernel python tests/test_persistent_agency_kernel.py -v
          printf '%s\n' "$failed" > wp206-g6-owned-witness-diagnostics/aggregate.exit
          exit "$failed"

      - name: Upload exact predecessor diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wp206-g6-owned-witness-diagnostics
          path: wp206-g6-owned-witness-diagnostics/
          retention-days: 1
          if-no-files-found: error

      - name: Fail closed if predecessor matrix failed
        if: always()
        run: test "$(cat wp206-g6-owned-witness-diagnostics/aggregate.exit)" = "0"

      - name: Commit only after complete bounded matrix is green
        run: |
          if git diff --quiet -- src/frankenstein2/persistent_agency_kernel.py; then
            echo 'NO_SOURCE_DIFF=true'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/frankenstein2/persistent_agency_kernel.py
          git commit -m 'trigger4: scope WP206 G6 revision guard to owned surface'
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Preserve bounded credit fence
        if: always()
        run: |
          echo 'SCOPE=WP206_G6_OWNED_SURFACE_WITNESS_REPOSITORY_COMPONENT_CANDIDATE_ONLY'
          echo 'DATA_VERSION_ROLE=CONNECTION_LOCAL_DIRTY_HINT_ONLY'
          echo 'TARGET_RUNTIME_CREDIT=0'
          echo 'PHYSICAL_GRID10_CREDIT=0'
          echo 'GWT_JSPACE_RUNTIME_CREDIT=0'
          echo 'EFFECT_CREDIT=0'
          echo 'COMPLETION_CREDIT=0'
          echo 'TRAINING_CREDIT=0'
          echo 'WHOLE_SYSTEM_ACCEPTANCE=false'
