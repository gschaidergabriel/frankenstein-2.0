name: WP206 G6 owned-surface witness repair

on:
  push:
    branches:
      - 'chatgpt/trigger4-wp206-g6-external-sqlite-revision-fence-20260830'
    paths:
      - '.github/workflows/wp206-g6-owned-surface-witness-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Apply bounded WP206-owned witness repair
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/frankenstein2/persistent_agency_kernel.py')
          text = path.read_text(encoding='utf-8')

          ctor_old = '''        # Connection-local observation only.  SQLite advances data_version when a
          # *different* connection commits.  Never persist or compare it across reopen.
          self.sqlite_data_version_baseline = int(data_version_row[0])

      @classmethod
  '''
          ctor_new = '''        # Connection-local observation only.  SQLite advances data_version when a
          # *different* connection commits.  It is a dirty hint, never the authority verdict.
          self.sqlite_data_version_baseline = int(data_version_row[0])
          self._wp206_owned_surface_witness_sha256: str | None = None

      @classmethod
  '''
          if text.count(ctor_old) != 1:
              raise SystemExit('constructor anchor mismatch')
          text = text.replace(ctor_old, ctor_new, 1)

          helper_anchor = '''    def close(self) -> None:
          self.connection.close()

      def initialize_schema(self) -> None:
  '''
          helpers = '''    def close(self) -> None:
          self.connection.close()

      def _read_sqlite_data_version(self) -> int:
          row = self.connection.execute("PRAGMA main.data_version").fetchone()
          if row is None or len(row) != 1 or type(row[0]) is not int:
              raise PersistentAgencyError("UNIFIEDDB_DATA_VERSION_UNAVAILABLE")
          return int(row[0])

      def _compute_wp206_owned_surface_witness(self) -> str:
          """Digest only WP206-owned schema objects and checkpoint rows.

          This is an in-memory same-process revalidation witness.  It is deliberately not
          persisted and is not cross-reopen UnifiedDB authority.
          """
          try:
              schema_rows = self.connection.execute(
                  """SELECT type, name, tbl_name, sql
                     FROM sqlite_schema
                     WHERE name=? OR tbl_name=?
                     ORDER BY type, name""",
                  (CHECKPOINT_TABLE, CHECKPOINT_TABLE),
              ).fetchall()
              checkpoint_rows = self.connection.execute(
                  f"""SELECT checkpoint_id, previous_checkpoint_id, kernel_state_id,
                             generation, checkpoint_sha256, checkpoint_json,
                             canonical_db_path, db_device, db_inode,
                             unifieddb_authority_receipt_sha256
                      FROM {CHECKPOINT_TABLE}
                      ORDER BY checkpoint_id"""
              ).fetchall()
          except sqlite3.Error as exc:
              raise PersistentAgencyError(
                  "UNIFIEDDB_WP206_OWNED_SURFACE_REVALIDATION_FAILED"
              ) from exc
          return _sha256(
              {
                  "schema": "FRANKENSTEIN2_WP206_OWNED_SQLITE_SURFACE_WITNESS/v1",
                  "schema_rows": [list(row) for row in schema_rows],
                  "checkpoint_rows": [list(row) for row in checkpoint_rows],
              }
          )

      def _capture_wp206_monitor_state(self) -> tuple[int, str]:
          # Double-read the connection-local dirty counter around the bounded witness so an
          # overlapping external commit cannot be silently folded into one inconsistent view.
          for _ in range(3):
              before = self._read_sqlite_data_version()
              witness = self._compute_wp206_owned_surface_witness()
              after = self._read_sqlite_data_version()
              if before == after:
                  return after, witness
          raise PersistentAgencyError("UNIFIEDDB_WP206_MONITOR_CAPTURE_UNSTABLE")

      def _adopt_wp206_monitor_state(self, state: tuple[int, str]) -> None:
          self.sqlite_data_version_baseline, self._wp206_owned_surface_witness_sha256 = state

      def initialize_schema(self) -> None:
  '''
          if text.count(helper_anchor) != 1:
              raise SystemExit('helper anchor mismatch')
          text = text.replace(helper_anchor, helpers, 1)

          init_old = '''            self.connection.execute(
              f"""CREATE INDEX IF NOT EXISTS idx_f2_persistent_agency_lineage
                    ON {CHECKPOINT_TABLE}(kernel_state_id, generation)"""
          )
          self.connection.commit()
      except Exception:
          self.connection.rollback()
          raise
  '''
          init_new = '''            self.connection.execute(
              f"""CREATE INDEX IF NOT EXISTS idx_f2_persistent_agency_lineage
                    ON {CHECKPOINT_TABLE}(kernel_state_id, generation)"""
          )
          pending_monitor_state = self._capture_wp206_monitor_state()
          self.connection.commit()
          self._adopt_wp206_monitor_state(pending_monitor_state)
      except Exception:
          self.connection.rollback()
          raise
  '''
          if text.count(init_old) != 1:
              raise SystemExit('initialize_schema anchor mismatch')
          text = text.replace(init_old, init_new, 1)

          guard_old = '''        data_version_row = self.connection.execute(
          "PRAGMA main.data_version"
      ).fetchone()
      if (
          data_version_row is None
          or len(data_version_row) != 1
          or type(data_version_row[0]) is not int
      ):
          raise PersistentAgencyError("UNIFIEDDB_DATA_VERSION_UNAVAILABLE")
      if int(data_version_row[0]) != self.sqlite_data_version_baseline:
          raise PersistentAgencyError("UNIFIEDDB_EXTERNAL_SQLITE_REVISION_DRIFT")
  '''
          guard_new = '''        current_data_version = self._read_sqlite_data_version()
      if self._wp206_owned_surface_witness_sha256 is None:
          # Before initialize_schema there is no admitted WP206-owned SQL surface to witness.
          return
      if current_data_version == self.sqlite_data_version_baseline:
          return
      observed_state = self._capture_wp206_monitor_state()
      if observed_state[1] != self._wp206_owned_surface_witness_sha256:
          raise PersistentAgencyError("UNIFIEDDB_WP206_OWNED_SURFACE_DRIFT")
      # Another connection changed only non-WP206 state.  Refresh the dirty hint after the
      # bounded WP206 witness proved unchanged.
      self._adopt_wp206_monitor_state(observed_state)
  '''
          if text.count(guard_old) != 1:
              raise SystemExit('guard anchor mismatch')
          text = text.replace(guard_old, guard_new, 1)

          begin_old = '''        try:
          self.connection.execute("BEGIN IMMEDIATE")
          existing = self.connection.execute(
  '''
          begin_new = '''        try:
          self.connection.execute("BEGIN IMMEDIATE")
          # Close the race between the pre-BEGIN check and acquisition of the write lock.
          self._assert_current_file_identity()
          existing = self.connection.execute(
  '''
          if text.count(begin_old) != 1:
              raise SystemExit('write BEGIN anchor mismatch')
          text = text.replace(begin_old, begin_new, 1)

          existing_old = '''            if existing is not None:
              if existing == (checkpoint_sha, checkpoint_json):
                  self.connection.commit()
                  return checkpoint_sha
  '''
          existing_new = '''            if existing is not None:
              if existing == (checkpoint_sha, checkpoint_json):
                  pending_monitor_state = self._capture_wp206_monitor_state()
                  self.connection.commit()
                  self._adopt_wp206_monitor_state(pending_monitor_state)
                  return checkpoint_sha
  '''
          if text.count(existing_old) != 1:
              raise SystemExit('idempotent write anchor mismatch')
          text = text.replace(existing_old, existing_new, 1)

          final_old = '''            self.connection.execute(
              f"""INSERT INTO {CHECKPOINT_TABLE}(
                  checkpoint_id, previous_checkpoint_id, kernel_state_id,
                  generation, checkpoint_sha256, checkpoint_json,
                  canonical_db_path, db_device, db_inode,
                  unifieddb_authority_receipt_sha256
              ) VALUES(?,?,?,?,?,?,?,?,?,?)""",
              (
                  checkpoint.checkpoint_id,
                  checkpoint.previous_checkpoint_id,
                  checkpoint.kernel_state_id,
                  checkpoint.generation,
                  checkpoint_sha,
                  checkpoint_json,
                  self.canonical_db_path,
                  self.db_device,
                  self.db_inode,
                  self.authority_receipt_sha256,
              ),
          )
          self.connection.commit()
          return checkpoint_sha
  '''
          final_new = '''            self.connection.execute(
              f"""INSERT INTO {CHECKPOINT_TABLE}(
                  checkpoint_id, previous_checkpoint_id, kernel_state_id,
                  generation, checkpoint_sha256, checkpoint_json,
                  canonical_db_path, db_device, db_inode,
                  unifieddb_authority_receipt_sha256
              ) VALUES(?,?,?,?,?,?,?,?,?,?)""",
              (
                  checkpoint.checkpoint_id,
                  checkpoint.previous_checkpoint_id,
                  checkpoint.kernel_state_id,
                  checkpoint.generation,
                  checkpoint_sha,
                  checkpoint_json,
                  self.canonical_db_path,
                  self.db_device,
                  self.db_inode,
                  self.authority_receipt_sha256,
              ),
          )
          pending_monitor_state = self._capture_wp206_monitor_state()
          self.connection.commit()
          self._adopt_wp206_monitor_state(pending_monitor_state)
          return checkpoint_sha
  '''
          if text.count(final_old) != 1:
              raise SystemExit('final write anchor mismatch')
          text = text.replace(final_old, final_new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Compile repaired G6 surface
        run: >-
          python -m py_compile
          src/frankenstein2/persistent_agency_kernel.py
          tests/test_wp206_g6_owned_surface_witness.py
          tests/falsifier_wp206_g6_external_sqlite_revision_drift.py
          tests/wp206_restart_probe.py
          tests/test_wp206_g5_evidence_subject_binding.py
          tests/test_wp206_g4_repeat_provenance_binding.py
          tests/test_wp206_legacy_authority_recovery.py
          tests/test_persistent_agency_kernel.py
          src/frankenstein2/causal_identity.py
          src/state/delivery_lifecycle.py
          src/state/delivery_store.py
          src/state/unifieddb_identity.py

      - name: Execute G6 owned-surface acceptance matrix
        env:
          PYTHONPATH: src
        run: python tests/test_wp206_g6_owned_surface_witness.py

      - name: Execute G6 external WP206-owned drift discriminator
        env:
          PYTHONPATH: src
        run: python tests/falsifier_wp206_g6_external_sqlite_revision_drift.py

      - name: Preserve accepted predecessor regressions
        env:
          PYTHONPATH: src
        run: |
          python tests/test_wp206_g5_evidence_subject_binding.py -v
          python tests/test_wp206_g4_repeat_provenance_binding.py -v
          python tests/test_wp206_legacy_authority_recovery.py -v
          python tests/test_persistent_agency_kernel.py -v

      - name: Commit only after the complete bounded matrix is green
        run: |
          if git diff --quiet -- src/frankenstein2/persistent_agency_kernel.py; then
            echo 'NO_SOURCE_DIFF=true'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/frankenstein2/persistent_agency_kernel.py
          git commit -m 'trigger4: scope WP206 G6 revision guard to owned surface'
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Preserve bounded credit fence
        if: always()
        run: |
          echo 'SCOPE=WP206_G6_OWNED_SURFACE_WITNESS_REPOSITORY_COMPONENT_CANDIDATE_ONLY'
          echo 'DATA_VERSION_ROLE=CONNECTION_LOCAL_DIRTY_HINT_ONLY'
          echo 'TARGET_RUNTIME_CREDIT=0'
          echo 'PHYSICAL_GRID10_CREDIT=0'
          echo 'GWT_JSPACE_RUNTIME_CREDIT=0'
          echo 'EFFECT_CREDIT=0'
          echo 'COMPLETION_CREDIT=0'
          echo 'TRAINING_CREDIT=0'
          echo 'WHOLE_SYSTEM_ACCEPTANCE=false'
