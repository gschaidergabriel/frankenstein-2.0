name: REVIEW WP803 Run-Descriptor Relabel Falsifier

on:
  push:
    branches:
      - review/wp803-run-descriptor-relabel-falsifier-20260829
    paths:
      - 'src/frankenstein2/cognitive_microworld.py'
      - 'src/frankenstein2/cognitive_world_model_prediction_benchmark.py'
      - 'tests/review/test_wp803_run_descriptor_relabel_falsifier.py'
      - '.github/workflows/review-wp803-run-descriptor-relabel-falsifier-ci.yml'
  pull_request:
    paths:
      - 'src/frankenstein2/cognitive_microworld.py'
      - 'src/frankenstein2/cognitive_world_model_prediction_benchmark.py'
      - 'tests/review/test_wp803_run_descriptor_relabel_falsifier.py'
      - '.github/workflows/review-wp803-run-descriptor-relabel-falsifier-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  negative-control:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile exact accepted source plus review witness
        run: >-
          python -m py_compile
          src/frankenstein2/cognitive_microworld.py
          src/frankenstein2/cognitive_world_model_prediction_benchmark.py
          tests/review/test_wp803_run_descriptor_relabel_falsifier.py
      - name: Reproduce accepted run-identity relabel gap
        env:
          PYTHONPATH: src
        run: >-
          python -m unittest discover
          -s tests/review
          -p 'test_wp803_run_descriptor_relabel_falsifier.py'
          -v
