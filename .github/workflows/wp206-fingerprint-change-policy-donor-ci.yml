name: F2 WP206 Fingerprint Change Policy Donor CI

on:
  push:
    branches:
      - chatgpt/trigger4-wp206-unifieddb-writer-guard-candidate-20260829
    paths:
      - 'src/frankenstein2/fingerprint_change_policy.py'
      - 'tests/test_fingerprint_change_policy.py'
      - '.github/workflows/wp206-fingerprint-change-policy-donor-ci.yml'
  pull_request:
    paths:
      - 'src/frankenstein2/fingerprint_change_policy.py'
      - 'tests/test_fingerprint_change_policy.py'
      - '.github/workflows/wp206-fingerprint-change-policy-donor-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile policy surface
        run: python -m py_compile src/frankenstein2/fingerprint_change_policy.py tests/test_fingerprint_change_policy.py
      - name: Fingerprint change policy falsification suite
        env:
          PYTHONPATH: src
        run: python tests/test_fingerprint_change_policy.py -v
