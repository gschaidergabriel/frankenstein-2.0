name: F2 WP305 Processing Credit CI

on:
  push:
    branches:
      - main
      - chatgpt/trigger4-wp305-processing-credit-20260829
    paths:
      - 'src/frankenstein2/processing_credit.py'
      - 'src/frankenstein2/typed_memory.py'
      - 'src/frankenstein2/memory_lifecycle.py'
      - 'tests/test_processing_credit.py'
      - '.github/workflows/wp305-processing-credit-ci.yml'
  pull_request:
    paths:
      - 'src/frankenstein2/processing_credit.py'
      - 'src/frankenstein2/typed_memory.py'
      - 'src/frankenstein2/memory_lifecycle.py'
      - 'tests/test_processing_credit.py'
      - '.github/workflows/wp305-processing-credit-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile src/frankenstein2/memory_lifecycle.py src/frankenstein2/typed_memory.py src/frankenstein2/processing_credit.py tests/test_processing_credit.py
      - name: Processing credit falsification suite
        env:
          PYTHONPATH: src
        run: python tests/test_processing_credit.py -v
