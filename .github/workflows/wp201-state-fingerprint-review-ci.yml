name: F2 WP201 StateFingerprint REVIEW CI

on:
  push:
    branches:
      - review/F2-WP-201-g1-content-identity-split-20260829
    paths:
      - 'src/frankenstein2/state_fingerprint.py'
      - 'tests/test_state_fingerprint.py'
      - '.github/workflows/wp201-state-fingerprint-review-ci.yml'
  pull_request:
    paths:
      - 'src/frankenstein2/state_fingerprint.py'
      - 'tests/test_state_fingerprint.py'
      - '.github/workflows/wp201-state-fingerprint-review-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile src/frankenstein2/state_fingerprint.py tests/test_state_fingerprint.py
      - name: StateFingerprint review falsification suite
        env:
          PYTHONPATH: src
        run: python tests/test_state_fingerprint.py -v
