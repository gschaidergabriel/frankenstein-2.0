name: F2 WP502 WP506 Frame Version Repair Once

on:
  push:
    branches:
      - 'trigger4/wp502-wp506-frame-version-repair-20260829'
    paths:
      - '.github/workflows/wp502-wp506-frame-version-repair-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'trigger4/wp502-wp506-frame-version-repair-20260829'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind Hyperposition to exact SituationFrame version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one block, found {count}')
              return text.replace(old, new, 1)

          hp_path = Path('src/frankenstein2/hyperposition.py')
          hp = hp_path.read_text()
          hp = replace_once(
              hp,
              '    situation_frame_ref: str | None = None\n    policy_ref: str | None = None\n',
              '    situation_frame_ref: str | None = None\n    situation_frame_generation: int | None = None\n    situation_frame_sha256: str | None = None\n    policy_ref: str | None = None\n',
              'Hyperposition frame-version fields',
          )
          hp = replace_once(
              hp,
              '''        object.__setattr__(\n            self,\n            "situation_frame_ref",\n            _optional_text("situation_frame_ref", self.situation_frame_ref),\n        )\n        object.__setattr__(self, "policy_ref", _optional_text("policy_ref", self.policy_ref))\n''',
              '''        frame_fields = (\n            self.situation_frame_ref,\n            self.situation_frame_generation,\n            self.situation_frame_sha256,\n        )\n        if any(value is not None for value in frame_fields) and not all(\n            value is not None for value in frame_fields\n        ):\n            raise HyperpositionError(\n                "SituationFrame binding must include ref, generation, and sha256 together"\n            )\n        if self.situation_frame_ref is None:\n            object.__setattr__(self, "situation_frame_generation", None)\n            object.__setattr__(self, "situation_frame_sha256", None)\n        else:\n            object.__setattr__(\n                self,\n                "situation_frame_ref",\n                _require_text("situation_frame_ref", self.situation_frame_ref),\n            )\n            _require_nonnegative_int(\n                "situation_frame_generation", self.situation_frame_generation\n            )\n            object.__setattr__(\n                self,\n                "situation_frame_sha256",\n                _require_sha256("situation_frame_sha256", self.situation_frame_sha256),\n            )\n        object.__setattr__(self, "policy_ref", _optional_text("policy_ref", self.policy_ref))\n''',
              'Hyperposition frame-version validation',
          )
          hp = replace_once(
              hp,
              '            "situation_frame_ref": self.situation_frame_ref,\n            "policy_ref": self.policy_ref,\n',
              '            "situation_frame_ref": self.situation_frame_ref,\n            "situation_frame_generation": self.situation_frame_generation,\n            "situation_frame_sha256": self.situation_frame_sha256,\n            "policy_ref": self.policy_ref,\n',
              'Hyperposition frame-version serialization',
          )
          hp = replace_once(
              hp,
              '''    provenance_refs: tuple[str, ...],\n    situation_frame_ref: str | None = None,\n    policy_ref: str | None = None,\n) -> Hyperposition:\n''',
              '''    provenance_refs: tuple[str, ...],\n    situation_frame_ref: str | None = None,\n    situation_frame_generation: int | None = None,\n    situation_frame_sha256: str | None = None,\n    policy_ref: str | None = None,\n) -> Hyperposition:\n''',
              'create_hyperposition signature',
          )
          hp = replace_once(
              hp,
              '''        provenance_refs=provenance_refs,\n        situation_frame_ref=situation_frame_ref,\n        policy_ref=policy_ref,\n''',
              '''        provenance_refs=provenance_refs,\n        situation_frame_ref=situation_frame_ref,\n        situation_frame_generation=situation_frame_generation,\n        situation_frame_sha256=situation_frame_sha256,\n        policy_ref=policy_ref,\n''',
              'create_hyperposition propagation',
          )
          hp_path.write_text(hp)

          hp_test_path = Path('tests/test_hyperposition.py')
          hp_test = hp_test_path.read_text()
          old = '            situation_frame_ref="situation:42",\n            policy_ref="policy:bounded",\n'
          count = hp_test.count(old)
          if count != 2:
              raise SystemExit(f'hyperposition test frame binding: expected 2 blocks, found {count}')
          hp_test = hp_test.replace(
              old,
              '            situation_frame_ref="situation:42",\n            situation_frame_generation=5,\n            situation_frame_sha256="a" * 64,\n            policy_ref="policy:bounded",\n',
          )
          old_state = '        situation_frame_ref="situation:42",\n        policy_ref="policy:bounded",\n'
          count = hp_test.count(old_state)
          if count != 1:
              raise SystemExit(f'hyperposition state frame binding: expected 1 block, found {count}')
          hp_test = hp_test.replace(
              old_state,
              '        situation_frame_ref="situation:42",\n        situation_frame_generation=5,\n        situation_frame_sha256="a" * 64,\n        policy_ref="policy:bounded",\n',
              1,
          )
          marker = '\n\nif __name__ == "__main__":\n'
          regression = '''\n\n    def test_situation_frame_binding_is_exact_and_all_or_none(self):\n        base = dict(\n            hyperposition_id="hyper:frame-bound",\n            generation=3,\n            alternatives=(alt("alt:a", "hypothesis:a"), alt("alt:b", "hypothesis:b")),\n            provenance_refs=("source:test",),\n        )\n        with self.assertRaisesRegex(HyperpositionError, "ref, generation, and sha256 together"):\n            create_hyperposition(**base, situation_frame_ref="situation:42")\n        current = create_hyperposition(\n            **base,\n            situation_frame_ref="situation:42",\n            situation_frame_generation=5,\n            situation_frame_sha256="a" * 64,\n        )\n        stale = create_hyperposition(\n            **base,\n            situation_frame_ref="situation:42",\n            situation_frame_generation=4,\n            situation_frame_sha256="b" * 64,\n        )\n        self.assertEqual(current.as_dict()["situation_frame_generation"], 5)\n        self.assertEqual(current.as_dict()["situation_frame_sha256"], "a" * 64)\n        self.assertNotEqual(current.sha256(), stale.sha256())\n'''
          hp_test = replace_once(hp_test, marker, regression + marker, 'Hyperposition regression insertion')
          hp_test_path.write_text(hp_test)

          gwt_path = Path('src/frankenstein2/gwt_workspace.py')
          gwt = gwt_path.read_text()
          gwt = replace_once(
              gwt,
              '''def _resolve_hyperposition_binding(\n    *,\n    frame_id: str,\n    hyperposition: Hyperposition | None,\n''',
              '''def _resolve_hyperposition_binding(\n    *,\n    frame_id: str,\n    frame_generation: int,\n    frame_sha256: str,\n    hyperposition: Hyperposition | None,\n''',
              'WP506 resolver signature',
          )
          gwt = replace_once(
              gwt,
              '''    normalized_frame_id = _text("frame_id", frame_id)\n    if hyperposition.situation_frame_ref != normalized_frame_id:\n        raise GwtWorkspaceError("hyperposition situation frame binding mismatch")\n''',
              '''    normalized_frame_id = _text("frame_id", frame_id)\n    normalized_frame_generation = _generation("frame_generation", frame_generation)\n    normalized_frame_sha256 = _sha256("frame_sha256", frame_sha256)\n    if (\n        hyperposition.situation_frame_ref != normalized_frame_id\n        or hyperposition.situation_frame_generation != normalized_frame_generation\n        or hyperposition.situation_frame_sha256 != normalized_frame_sha256\n    ):\n        raise GwtWorkspaceError("hyperposition situation frame binding mismatch")\n''',
              'WP506 exact frame-version comparison',
          )
          call = '''                frame_id=self.frame_id,\n                hyperposition=self.hyperposition,\n'''
          count = gwt.count(call)
          if count != 1:
              raise SystemExit(f'WP506 post-init resolver call: expected 1, found {count}')
          gwt = gwt.replace(
              call,
              '''                frame_id=self.frame_id,\n                frame_generation=self.frame_generation,\n                frame_sha256=self.frame_sha256,\n                hyperposition=self.hyperposition,\n''',
              1,
          )
          call = '''        frame_id=selection.frame_id,\n        hyperposition=selection.hyperposition,\n'''
          count = gwt.count(call)
          if count != 1:
              raise SystemExit(f'WP506 downstream resolver call: expected 1, found {count}')
          gwt = gwt.replace(
              call,
              '''        frame_id=selection.frame_id,\n        frame_generation=selection.frame_generation,\n        frame_sha256=selection.frame_sha256,\n        hyperposition=selection.hyperposition,\n''',
              1,
          )
          gwt_path.write_text(gwt)

          gwt_test_path = Path('tests/test_gwt_workspace.py')
          gwt_test = gwt_test_path.read_text()
          gwt_test = replace_once(
              gwt_test,
              'def make_hyperposition(*, frame_ref="frame-1"):\n',
              'def make_hyperposition(*, frame_ref="frame-1", frame_generation=4, frame_sha256=D):\n',
              'GWT Hyperposition test helper signature',
          )
          gwt_test = replace_once(
              gwt_test,
              '''        provenance_refs=("prov:hp",),\n        situation_frame_ref=frame_ref,\n    )\n''',
              '''        provenance_refs=("prov:hp",),\n        situation_frame_ref=frame_ref,\n        situation_frame_generation=frame_generation,\n        situation_frame_sha256=frame_sha256,\n    )\n''',
              'GWT Hyperposition helper propagation',
          )
          gwt_test += '''\n\ndef test_same_frame_id_stale_hyperposition_version_fails_closed():\n    stale = make_hyperposition(\n        frame_ref="frame-1",\n        frame_generation=3,\n        frame_sha256="b" * 64,\n    )\n    with pytest.raises(GwtWorkspaceError, match="hyperposition situation frame binding mismatch"):\n        build_workspace_selection(\n            selection_id="sel-stale-hp-frame-version",\n            cycle_id="cycle-1",\n            generation=7,\n            frame_id="frame-1",\n            frame_generation=4,\n            frame_sha256=D,\n            grid_plan_id=GRID_PLAN.plan_id,\n            grid_plan_generation=GRID_PLAN.generation,\n            grid_plan_sha256=GRID_PLAN.sha256(),\n            hyperposition=stale,\n            policy=policy(),\n            candidates=(candidate("hp-stale-version"),),\n        )\n\n\ndef test_matching_hyperposition_frame_version_survives_downstream_revalidation():\n    bound = make_hyperposition(\n        frame_ref="frame-1",\n        frame_generation=4,\n        frame_sha256=D,\n    )\n    value = build_workspace_selection(\n        selection_id="sel-exact-hp-frame-version",\n        cycle_id="cycle-1",\n        generation=7,\n        frame_id="frame-1",\n        frame_generation=4,\n        frame_sha256=D,\n        grid_plan_id=GRID_PLAN.plan_id,\n        grid_plan_generation=GRID_PLAN.generation,\n        grid_plan_sha256=GRID_PLAN.sha256(),\n        hyperposition=bound,\n        policy=policy(),\n        candidates=(candidate("hp-exact-version"),),\n    )\n    payload = value.as_dict()["hyperposition"]\n    assert payload["situation_frame_ref"] == "frame-1"\n    assert payload["situation_frame_generation"] == 4\n    assert payload["situation_frame_sha256"] == D\n    create_broadcast(\n        broadcast_id="b-exact-hp-frame-version",\n        generation=1,\n        selection=value,\n        expected_selection_sha256=value.sha256(),\n        recipient_cell_ids=("G1",),\n    )\n'''
          gwt_test_path.write_text(gwt_test)
          PY
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile repaired sources and tests
        run: python -m py_compile src/frankenstein2/hyperposition.py src/frankenstein2/gwt_workspace.py tests/test_hyperposition.py tests/test_gwt_workspace.py
      - name: Run repair suites before commit
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_hyperposition.py tests/test_gwt_workspace.py
      - name: Commit repair and retire one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/wp502-wp506-frame-version-repair-once.yml
          git add src/frankenstein2/hyperposition.py src/frankenstein2/gwt_workspace.py tests/test_hyperposition.py tests/test_gwt_workspace.py
          git commit -m 'trigger4: bind Hyperposition to exact SituationFrame version'
          git push origin HEAD:trigger4/wp502-wp506-frame-version-repair-20260829
