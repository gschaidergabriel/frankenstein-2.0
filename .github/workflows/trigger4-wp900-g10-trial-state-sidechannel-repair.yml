name: Trigger4 WP900 G10 Trial-State Sidechannel Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger4-wp900-g10-trial-state-sidechannel-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trigger4-wp900-g10-trial-state-sidechannel-repair
  cancel-in-progress: false

jobs:
  repair-g10-in-place:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact G10 authority and vulnerable source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          active = json.loads(Path('workpackages/active/F2-WP-900.json').read_text())
          assert active['generation'] == 10
          assert active['claim_id'] == 'F2-WP-900-G10-GPT56SOL-INDEPENDENT-SEMANTIC-MEDIATOR-AUTHORITY-20260902'
          assert active['state'] == 'CLAIMED'
          PY
          test "$(git rev-parse HEAD:src/frankenstein2/gwt_independent_semantic_mediator.py)" = "6daa208be2d3da7688f7df5f05f0e7c66da98775"
          test "$(git rev-parse HEAD:tests/test_wp900_g10_independent_semantic_mediator.py)" = "e37018e7d5527adc030ffca2cd46689adb6357f1"

      - name: Repair behavior-visible trial identity and add adversarial regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path('src/frankenstein2/gwt_independent_semantic_mediator.py')
          source = source_path.read_text()

          replacements = [
              (
                  '_EXECUTION_FACTORY = object()\n\n_WORKER_SOURCE = r"""',
                  '_EXECUTION_FACTORY = object()\n_TRIAL_PROCESS_IDENTITY_REDACTED = "VERIFIER_ONLY_REDACTED"\n\n_WORKER_SOURCE = r"""',
              ),
              (
                  '        object.__setattr__(\n            self,\n            "trial_process_identity",\n            _text("trial_process_identity", self.trial_process_identity),\n        )',
                  '        _text("trial_process_identity", self.trial_process_identity)\n        object.__setattr__(\n            self,\n            "trial_process_identity",\n            _TRIAL_PROCESS_IDENTITY_REDACTED,\n        )',
              ),
              (
                  '        trial_process_identities=tuple(state.trial_process_identity for state in states),  # type: ignore[arg-type]',
                  '        trial_process_identities=tuple(\n            f"executor-child-pid:{receipt.child_pid}" for receipt in execution_receipts\n        ),  # type: ignore[arg-type]',
              ),
          ]
          for old, new in replacements:
              count = source.count(old)
              assert count == 1, (old[:80], count)
              source = source.replace(old, new, 1)
          source_path.write_text(source)

          test_path = Path('tests/test_wp900_g10_independent_semantic_mediator.py')
          tests = test_path.read_text()
          marker = '\n\ndef test_mediator_requires_gwt_source_event_bound_to_exact_semantic_bytes():\n'
          assert tests.count(marker) == 1
          regression = r'''


def test_behavior_capable_state_redacts_verifier_only_trial_identity():
    states = []
    for position, payload in enumerate(PAYLOADS, 1):
        mediator = source_mediator(position=position, payload=payload)
        state = admit_mediated_semantic_state(
            mediator=mediator,
            wire=mediator.to_wire(),
            trial_process_identity=f"trial-process:g10:{position}",
        )
        states.append(state)
        assert state.trial_process_identity == "VERIFIER_ONLY_REDACTED"
        assert state.as_dict()["trial_process_identity"] == "VERIFIER_ONLY_REDACTED"

    assert len({state.trial_process_identity for state in states}) == 1

    mediators, _, states, receipts = all_mediators_states_and_receipts()
    candidate = bind_independent_semantic_mediator_crossover(
        mediators=mediators,
        states=states,
        execution_receipts=receipts,
        provenance_refs=("prov:g10:post-execution-process-observation",),
    )
    assert all(
        identity.startswith("executor-child-pid:")
        for identity in candidate.trial_process_identities
    )
    assert len(set(candidate.trial_process_identities)) == 4
'''
          tests = tests.replace(marker, regression + marker, 1)
          test_path.write_text(tests)
          PY

      - name: Execute G8 G9 G10 regression fence
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/tests
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -m py_compile src/frankenstein2/gwt_independent_semantic_mediator.py
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q \
            tests/test_wp900_g8_causal_admission_fence.py \
            tests/test_wp900_g9_semantic_content_causality.py \
            tests/test_wp900_g9_reentry_only_execution.py \
            tests/test_wp900_g10_independent_semantic_mediator.py

      - name: Commit one coherent G10 repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'GPT-5.6-Sol Trigger4'
          git config user.email 'actions@users.noreply.github.com'
          git add src/frankenstein2/gwt_independent_semantic_mediator.py tests/test_wp900_g10_independent_semantic_mediator.py
          test -n "$(git diff --cached --name-only)"
          git commit -m 'wp900: redact trial identity from G10 behavior state'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
