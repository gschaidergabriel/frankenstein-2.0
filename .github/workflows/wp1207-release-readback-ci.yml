name: F2 WP1207 Release Readback CI

on:
  push:
    branches:
      - main
    paths:
      - 'src/frankenstein2/portable_release_transaction.py'
      - 'src/frankenstein2/portable_release_readback.py'
      - 'tests/test_portable_release_transaction.py'
      - 'tests/test_portable_release_readback.py'
      - '.github/workflows/wp1207-portable-release-transaction-ci.yml'
      - '.github/workflows/wp1207-release-readback-ci.yml'
      - 'workpackages/active/F2-WP-1207.json'
      - 'workpackages/deltas/F2-WP-1207/**'
      - 'workpackages/reconciliations/F2-WP-1207/**'
      - 'workpackages/receipts/F2-WP-1207*'
  pull_request:
    paths:
      - 'src/frankenstein2/portable_release_transaction.py'
      - 'src/frankenstein2/portable_release_readback.py'
      - 'tests/test_portable_release_transaction.py'
      - 'tests/test_portable_release_readback.py'
      - '.github/workflows/wp1207-portable-release-transaction-ci.yml'
      - '.github/workflows/wp1207-release-readback-ci.yml'
      - 'workpackages/active/F2-WP-1207.json'
      - 'workpackages/deltas/F2-WP-1207/**'
      - 'workpackages/reconciliations/F2-WP-1207/**'
      - 'workpackages/receipts/F2-WP-1207*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-release-readback-fence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile exact WP1207 G1 plus G2 surfaces
        run: python -m py_compile src/frankenstein2/portable_release_transaction.py src/frankenstein2/portable_release_readback.py tests/test_portable_release_transaction.py tests/test_portable_release_readback.py
      - name: Re-run accepted G1 fail-closed transaction suite
        env:
          PYTHONPATH: src
        run: python tests/test_portable_release_transaction.py -v
      - name: Run G2 release-readback falsification suite
        env:
          PYTHONPATH: src
        run: python tests/test_portable_release_readback.py -v
