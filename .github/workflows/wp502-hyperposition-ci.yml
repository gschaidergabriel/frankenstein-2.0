name: F2 WP502 Hyperposition CI

on:
  push:
    branches:
      - main
      - trigger4/wp502-hyperposition-g1-gpt56sol-20260829
    paths:
      - 'src/frankenstein2/hyperposition.py'
      - 'tests/test_hyperposition.py'
      - '.github/workflows/wp502-hyperposition-ci.yml'
  pull_request:
    paths:
      - 'src/frankenstein2/hyperposition.py'
      - 'tests/test_hyperposition.py'
      - '.github/workflows/wp502-hyperposition-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile src/frankenstein2/hyperposition.py tests/test_hyperposition.py
      - name: Hyperposition falsification suite
        env:
          PYTHONPATH: src
        run: python tests/test_hyperposition.py -v
