name: F2 WP603 Recursion Router CI

on:
  push:
    branches:
      - main
      - trigger4/wp603-recursion-router-20260829
    paths:
      - 'src/frankenstein2/recursion_router.py'
      - 'src/frankenstein2/direct_delegate_router.py'
      - 'src/frankenstein2/native_child_abi.py'
      - 'src/frankenstein2/native_child_binding.py'
      - 'src/frankenstein2/causal_identity.py'
      - 'src/frankenstein2/situation_frame.py'
      - 'tests/test_recursion_router.py'
      - '.github/workflows/wp603-recursion-router-ci.yml'
  pull_request:
    paths:
      - 'src/frankenstein2/recursion_router.py'
      - 'src/frankenstein2/direct_delegate_router.py'
      - 'src/frankenstein2/native_child_abi.py'
      - 'src/frankenstein2/native_child_binding.py'
      - 'src/frankenstein2/causal_identity.py'
      - 'src/frankenstein2/situation_frame.py'
      - 'tests/test_recursion_router.py'
      - '.github/workflows/wp603-recursion-router-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile src/frankenstein2/recursion_router.py tests/test_recursion_router.py
      - name: Recursion router falsification suite
        env:
          PYTHONPATH: src
        run: python tests/test_recursion_router.py -v
