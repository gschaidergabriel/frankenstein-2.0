name: F2 WP206 G1 UnifiedDB Admission Falsifier CI

on:
  push:
    branches:
      - chatgpt/trigger4-wp206-g1-unifieddb-admission-falsifier-20260829
    paths:
      - 'src/frankenstein2/persistent_agency_kernel.py'
      - 'src/state/unifieddb_identity.py'
      - 'tests/falsifiers/test_wp206_g1_unifieddb_admission.py'
      - '.github/workflows/wp206-g1-unifieddb-admission-falsifier-ci.yml'
  pull_request:
    paths:
      - 'src/frankenstein2/persistent_agency_kernel.py'
      - 'src/state/unifieddb_identity.py'
      - 'tests/falsifiers/test_wp206_g1_unifieddb_admission.py'
      - '.github/workflows/wp206-g1-unifieddb-admission-falsifier-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  falsifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile falsifier
        run: python -m py_compile src/frankenstein2/persistent_agency_kernel.py src/state/unifieddb_identity.py tests/falsifiers/test_wp206_g1_unifieddb_admission.py
      - name: UnifiedDB admission falsifier
        env:
          PYTHONPATH: src
        run: python tests/falsifiers/test_wp206_g1_unifieddb_admission.py -v
