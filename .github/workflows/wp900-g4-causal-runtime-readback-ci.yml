name: WP900 G4 Causal Runtime Readback CI

on:
  push:
    paths:
      - 'src/frankenstein2/grid10_interface.py'
      - 'src/frankenstein2/gwt_workspace.py'
      - 'src/frankenstein2/gwt_uptake.py'
      - 'src/frankenstein2/gwt_reentry_provenance.py'
      - 'src/frankenstein2/gwt_reentry_uptake_binding.py'
      - 'src/frankenstein2/gwt_runtime_witness.py'
      - 'src/frankenstein2/gwt_causal_runtime_readback.py'
      - 'tests/test_gwt_runtime_witness.py'
      - 'tests/test_gwt_causal_runtime_readback.py'
      - '.github/workflows/wp900-g4-causal-runtime-readback-ci.yml'
  pull_request:
    paths:
      - 'src/frankenstein2/grid10_interface.py'
      - 'src/frankenstein2/gwt_workspace.py'
      - 'src/frankenstein2/gwt_uptake.py'
      - 'src/frankenstein2/gwt_reentry_provenance.py'
      - 'src/frankenstein2/gwt_reentry_uptake_binding.py'
      - 'src/frankenstein2/gwt_runtime_witness.py'
      - 'src/frankenstein2/gwt_causal_runtime_readback.py'
      - 'tests/test_gwt_runtime_witness.py'
      - 'tests/test_gwt_causal_runtime_readback.py'
      - '.github/workflows/wp900-g4-causal-runtime-readback-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-falsification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile exact WP900 G4 dependency surface
        run: >-
          python -m py_compile
          src/frankenstein2/grid10_interface.py
          src/frankenstein2/gwt_workspace.py
          src/frankenstein2/gwt_uptake.py
          src/frankenstein2/gwt_reentry_provenance.py
          src/frankenstein2/gwt_reentry_uptake_binding.py
          src/frankenstein2/gwt_runtime_witness.py
          src/frankenstein2/gwt_causal_runtime_readback.py
          tests/test_gwt_runtime_witness.py
          tests/test_gwt_causal_runtime_readback.py
      - name: WP900 G4 fail-closed causal runtime readback suite
        env:
          PYTHONPATH: src
        run: >-
          python -m pytest -q
          tests/test_gwt_runtime_witness.py
          tests/test_gwt_causal_runtime_readback.py
