name: WP900 G4 Causal Runtime Readback CI

on:
  pull_request:
    paths:
      - 'src/frankenstein2/gwt_causal_runtime_readback.py'
      - 'tests/test_gwt_causal_runtime_readback.py'
      - '.github/workflows/wp900-g4-causal-runtime-readback-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install repository-test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run bounded WP900 G4 regressions
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_gwt_causal_runtime_readback.py
