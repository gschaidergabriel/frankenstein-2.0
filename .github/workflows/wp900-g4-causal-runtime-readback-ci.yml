name: WP900 G4-G6 Causal Runtime Readback CI

on:
  pull_request:
    paths:
      - 'src/frankenstein2/gwt_causal_runtime_readback.py'
      - 'src/frankenstein2/gwt_semantic_runtime_readback.py'
      - 'src/frankenstein2/gwt_runtime_witness.py'
      - 'src/frankenstein2/gwt_uptake.py'
      - 'src/frankenstein2/gwt_reentry_uptake_binding.py'
      - 'src/frankenstein2/runtime_bound_whole_loop.py'
      - 'src/frankenstein2/whole_persistent_loop.py'
      - 'tests/test_gwt_causal_runtime_readback.py'
      - 'tests/test_gwt_causal_runtime_readback_context_gate.py'
      - 'tests/test_gwt_runtime_witness.py'
      - 'tests/test_gwt_uptake.py'
      - 'tests/test_gwt_reentry_uptake_binding.py'
      - 'tests/test_wp900_g5_runtime_bound_whole_loop.py'
      - 'tests/test_wp900_g6_semantic_runtime_readback.py'
      - 'tests/test_whole_persistent_loop.py'
      - '.github/workflows/wp900-g4-causal-runtime-readback-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install repository-test dependency
        run: python -m pip install --disable-pip-version-check pytest

      # Repository-CI only: this job must not mint target-runtime or semantic GWT/J-Space credit.
      - name: Compile bounded GWT runtime and semantic readback path
        run: |
          python -m py_compile \
            src/frankenstein2/gwt_causal_runtime_readback.py \
            src/frankenstein2/gwt_semantic_runtime_readback.py \
            src/frankenstein2/gwt_runtime_witness.py \
            src/frankenstein2/gwt_uptake.py \
            src/frankenstein2/gwt_reentry_uptake_binding.py \
            src/frankenstein2/runtime_bound_whole_loop.py \
            src/frankenstein2/whole_persistent_loop.py

      - name: Run G4 binder and dependency regressions
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q \
            tests/test_gwt_causal_runtime_readback.py \
            tests/test_gwt_causal_runtime_readback_context_gate.py \
            tests/test_gwt_runtime_witness.py \
            tests/test_gwt_uptake.py \
            tests/test_gwt_reentry_uptake_binding.py

      - name: Run G5 runtime-bound whole-loop integration regressions
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q \
            tests/test_wp900_g5_runtime_bound_whole_loop.py \
            tests/test_whole_persistent_loop.py

      - name: Run G6 semantic causal readback regressions
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_wp900_g6_semantic_runtime_readback.py
