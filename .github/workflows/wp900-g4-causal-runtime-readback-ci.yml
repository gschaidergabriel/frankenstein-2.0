name: WP900 G4 Causal Runtime Readback CI

on:
  push:
    branches:
      - main
      - worker/F2-WP-900-g4-gpt56sol-causal-runtime-readback
    paths:
      - "src/frankenstein2/gwt_causal_runtime_readback.py"
      - "tests/test_gwt_causal_runtime_readback.py"
      - "src/frankenstein2/gwt_runtime_witness.py"
      - "src/frankenstein2/gwt_uptake.py"
      - "src/frankenstein2/gwt_workspace.py"
      - "src/frankenstein2/gwt_reentry_provenance.py"
      - "src/frankenstein2/gwt_reentry_uptake_binding.py"
      - ".github/workflows/wp900-g4-causal-runtime-readback-ci.yml"
  pull_request:
    paths:
      - "src/frankenstein2/gwt_causal_runtime_readback.py"
      - "tests/test_gwt_causal_runtime_readback.py"
      - "src/frankenstein2/gwt_runtime_witness.py"
      - "src/frankenstein2/gwt_uptake.py"
      - "src/frankenstein2/gwt_workspace.py"
      - "src/frankenstein2/gwt_reentry_provenance.py"
      - "src/frankenstein2/gwt_reentry_uptake_binding.py"
      - ".github/workflows/wp900-g4-causal-runtime-readback-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wp900-g4-causal-runtime-readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile bounded G4 binder
        run: python -m py_compile src/frankenstein2/gwt_causal_runtime_readback.py tests/test_gwt_causal_runtime_readback.py
      - name: Run WP900 G4 causal readback regressions
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_gwt_causal_runtime_readback.py
      - name: Re-run accepted upstream GWT contracts
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_gwt_runtime_witness.py tests/test_gwt_uptake.py
