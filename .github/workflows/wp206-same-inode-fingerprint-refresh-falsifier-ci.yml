name: WP206 Same-Inode Fingerprint Refresh Falsifier

on:
  pull_request:
    paths:
      - 'src/frankenstein2/persistent_agency_kernel.py'
      - 'src/state/unifieddb_identity.py'
      - 'tests/test_wp206_same_inode_unifieddb_fingerprint_refresh_falsifier.py'
      - '.github/workflows/wp206-same-inode-fingerprint-refresh-falsifier-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  falsify-same-inode-fingerprint-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile exact discriminator surface
        run: >-
          python -m py_compile
          src/frankenstein2/persistent_agency_kernel.py
          src/state/unifieddb_identity.py
          tests/test_wp206_same_inode_unifieddb_fingerprint_refresh_falsifier.py
      - name: Run preregistered same-inode fingerprint discriminator
        env:
          PYTHONPATH: src
        run: >-
          python -m unittest
          tests.test_wp206_same_inode_unifieddb_fingerprint_refresh_falsifier
          -v
