name: F2 WP1105 State Migration CI

on:
  push:
    branches:
      - main
    paths:
      - 'src/frankenstein2/state_migration.py'
      - 'tests/test_state_migration.py'
      - '.github/workflows/wp1105-state-migration-ci.yml'
  pull_request:
    paths:
      - 'src/frankenstein2/state_migration.py'
      - 'tests/test_state_migration.py'
      - '.github/workflows/wp1105-state-migration-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile src/frankenstein2/state_migration.py tests/test_state_migration.py
      - name: Durable state migration falsification suite
        env:
          PYTHONPATH: src
        run: python tests/test_state_migration.py -v
