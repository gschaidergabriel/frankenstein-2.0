name: F2 WP1102 Claude Code Route CI

on:
  push:
    branches:
      - main
      - trigger4/wp1102-claude-code-route-20260829
    paths:
      - 'src/frankenstein2/claude_code_route.py'
      - 'tests/test_claude_code_route.py'
      - '.github/workflows/wp1102-claude-code-route-ci.yml'
      - 'workpackages/deltas/F2-WP-1102/**'
  pull_request:
    paths:
      - 'src/frankenstein2/claude_code_route.py'
      - 'tests/test_claude_code_route.py'
      - '.github/workflows/wp1102-claude-code-route-ci.yml'
      - 'workpackages/deltas/F2-WP-1102/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile
        run: python -m py_compile src/frankenstein2/claude_code_route.py tests/test_claude_code_route.py
      - name: Claude Code route falsification suite
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_claude_code_route.py
