name: Trigger 4 Kokoro vs Piper CPU File Output

on:
  push:
    branches: [main]
    paths:
      - "trigger4/tools/local_voice/kokoro_piper_cpu_benchmark.py"
      - "trigger4/tools/local_voice/run_kokoro_piper_cpu_benchmark_s1.sh"
      - ".github/workflows/trigger4-kokoro-piper-cpu-file-output.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-file-output-discriminator:
    runs-on: clay-host
    timeout-minutes: 75
    env:
      F2_SANDBOX_ROOT: /var/tmp/frankenstein2-sandboxes
      F2_SANDBOX_CPUS: "4"
      F2_SANDBOX_MEMORY: 8g
      F2_SANDBOX_PIDS: "2048"

    steps:
      - name: Checkout exact workflow subject
        uses: actions/checkout@v4

      - name: Verify exact VPS runner identity
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '%s\n' \
            "RUNNER_NAME=${RUNNER_NAME:-UNKNOWN}" \
            "RUNNER_OS=${RUNNER_OS:-UNKNOWN}" \
            "RUNNER_ARCH=${RUNNER_ARCH:-UNKNOWN}" \
            "GITHUB_SHA=$GITHUB_SHA" \
            "GITHUB_RUN_ID=$GITHUB_RUN_ID" \
            "GITHUB_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
          test "${RUNNER_NAME:-}" = "vps-clay-host"
          test "${RUNNER_OS:-}" = "Linux"

      - name: Static harness gates
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile trigger4/tools/local_voice/kokoro_piper_cpu_benchmark.py
          bash -n trigger4/tools/local_voice/run_kokoro_piper_cpu_benchmark_s1.sh
          bash -n tools/vps_sandbox/run_ubuntu_sandbox.sh
          bash tools/vps_sandbox/preflight.sh | tee /tmp/t4-vps-preflight.txt

      - name: Execute exact S1 CPU file-output discriminator
        id: sandbox
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          bash tools/vps_sandbox/run_ubuntu_sandbox.sh \
            --backend auto \
            --network on \
            -- \
            bash trigger4/tools/local_voice/run_kokoro_piper_cpu_benchmark_s1.sh \
            2>&1 | tee /tmp/t4-kokoro-piper-sandbox.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Bind workflow and runner context to bounded receipt
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          marker="$(grep '^T4_RECEIPT_B64=' /tmp/t4-kokoro-piper-sandbox.log | tail -n 1 || true)"
          if [[ -z "$marker" ]]; then
            printf '%s\n' \
              '{"schema":"T4_LOCAL_VOICE_KOKORO_PIPER_CPU_DISCRIMINATOR/v1","result":"BLOCKED","failure_class":"EVIDENCE_INVALID","stage":"MISSING_INNER_RECEIPT","credits":{"cpu_file_output_component":0,"audible_playback":0,"trigger4_f2_acceptance":0,"whole_system":0}}' \
              > /tmp/t4-inner.json
          else
            printf '%s' "${marker#T4_RECEIPT_B64=}" | base64 -d > /tmp/t4-inner.json
          fi

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(Path("/tmp/t4-inner.json").read_text())
          log = Path("/tmp/t4-kokoro-piper-sandbox.log").read_text(errors="replace")
          preflight = Path("/tmp/t4-vps-preflight.txt").read_text(errors="replace")
          receipt["workflow_binding"] = {
              "source_sha": os.environ.get("GITHUB_SHA"),
              "workflow_run_id": int(os.environ.get("GITHUB_RUN_ID", "0")),
              "workflow_run_attempt": int(os.environ.get("GITHUB_RUN_ATTEMPT", "0")),
              "runner_name": os.environ.get("RUNNER_NAME", "UNKNOWN"),
              "runner_os": os.environ.get("RUNNER_OS", "UNKNOWN"),
              "runner_arch": os.environ.get("RUNNER_ARCH", "UNKNOWN"),
              "sandbox_command_exit_code": int("${{ steps.sandbox.outputs.rc || '999' }}"),
              "sandbox_wrapper_pass_marker": "F2_SANDBOX_RESULT=PASS" in log,
          }
          receipt["host_preflight_log"] = preflight
          receipt["sandbox_log_tail"] = "\n".join(log.splitlines()[-200:])
          Path("/tmp/t4-kokoro-piper-cpu-receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps({
              "result": receipt.get("result"),
              "failure_class": receipt.get("failure_class"),
              "workflow_run_id": receipt["workflow_binding"]["workflow_run_id"],
          }, sort_keys=True))
          PY

      - name: Upload bounded runtime receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t4-kokoro-piper-cpu-${{ github.run_id }}
          path: /tmp/t4-kokoro-piper-cpu-receipt.json
          if-no-files-found: error

      - name: Enforce exact discriminator success
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(Path("/tmp/t4-kokoro-piper-cpu-receipt.json").read_text())
          assert receipt.get("result") == "PASS", receipt.get("failure_class")
          assert receipt["workflow_binding"]["sandbox_command_exit_code"] == 0
          assert receipt["workflow_binding"]["sandbox_wrapper_pass_marker"] is True
          assert receipt["credits"]["cpu_file_output_component"] == 1
          for engine in ("kokoro", "piper"):
              er = receipt["engines"][engine]
              assert er["result"] == "PASS"
              assert er["network_guard"]["outbound_model_api_calls"] == 0
              assert er["network_guard"]["outbound_asr_api_calls"] == 0
              assert er["network_guard"]["outbound_tts_api_calls"] == 0
          assert receipt["credits"]["audible_playback"] == 0
          assert receipt["credits"]["trigger4_f2_acceptance"] == 0
          assert receipt["credits"]["whole_system"] == 0
          PY
