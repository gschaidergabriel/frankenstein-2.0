name: REVIEW WP510 Uptaken Recipient Bijection

on:
  push:
    branches:
      - review/wp510-uptaken-recipient-bijection-20260829
    paths:
      - 'src/frankenstein2/gwt_causal_path.py'
      - 'tests/test_wp510_uptaken_recipient_bijection_review.py'
      - '.github/workflows/review-wp510-uptaken-recipient-bijection-ci.yml'
  pull_request:
    paths:
      - 'tests/test_wp510_uptaken_recipient_bijection_review.py'
      - '.github/workflows/review-wp510-uptaken-recipient-bijection-ci.yml'

permissions:
  contents: read

jobs:
  discriminator:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile review discriminator and WP510 source
        run: >-
          python -m py_compile
          src/frankenstein2/gwt_causal_path.py
          tests/test_wp510_uptaken_recipient_bijection_review.py
      - name: Execute preregistered recipient-bijection discriminator
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_wp510_uptaken_recipient_bijection_review.py
