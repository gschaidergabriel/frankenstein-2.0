name: F2 WP1207 Issue451 Rollback State Binding Candidate

on:
  push:
    branches:
      - 'trigger4/wp1207-451-rollback-state-binding'
    paths:
      - 'workpackages/candidate_patches/F2-WP-1207-issue451-rollback-state-binding.patch'
      - '.github/workflows/wp1207-issue451-rollback-state-binding-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-source-candidate-falsifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify exact reviewed source and test blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/frankenstein2/portable_release_transaction.py)" = "a248d6ded9fd90f34f7e6763fe30948fc58af6e6"
          test "$(git hash-object tests/test_portable_release_transaction.py)" = "c095b15fb65c367b45944db24b5a9909bc1d3f8e"

      - name: Reproduce issue 451 before applying candidate repair
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from frankenstein2.portable_release_transaction import (
              LINEAGE_SCHEMA,
              RELEASE_SCHEMA,
              REQUEST_SCHEMA,
              ReleaseIdentity,
              build_transaction_plan,
              record_attempt,
          )

          A = "a" * 64
          B = "b" * 64
          C = "c" * 64
          D = "d" * 64
          E = "e" * 64
          F = "f" * 64

          def release(release_id, version, artifact, manifest):
              return {
                  "schema": RELEASE_SCHEMA,
                  "release_id": release_id,
                  "version": version,
                  "artifact_sha256": artifact,
                  "manifest_sha256": manifest,
              }

          r1 = release("frankenstein-2.0-r1", "2.0.0-r1", A, B)
          r2 = release("frankenstein-2.0-r2", "2.0.0-r2", C, D)
          r1_digest = ReleaseIdentity.from_mapping(r1).digest()
          r2_digest = ReleaseIdentity.from_mapping(r2).digest()
          plan = build_transaction_plan({
              "schema": REQUEST_SCHEMA,
              "attempt_id": "wp1207-issue451-pre-fix",
              "operation": "ROLLBACK",
              "target_release": r1,
              "current_lineage": {
                  "schema": LINEAGE_SCHEMA,
                  "generation": 7,
                  "state_sha256": E,
                  "active_release_digest": r2_digest,
                  "predecessor_generation": 6,
                  "predecessor_state_sha256": F,
                  "predecessor_release_digest": r1_digest,
              },
              "expected_generation": 7,
              "expected_state_sha256": E,
              "rollback_release": r1,
              "injected_failure_stage": None,
          })
          receipt = record_attempt(
              plan,
              outcome="SUCCEEDED",
              observed_generation=8,
              observed_state_sha256=A,
          )
          assert receipt.observed_state_sha256 == A
          assert receipt.observed_state_sha256 != plan.rollback_target_state_sha256
          print("ISSUE451_COUNTEREXAMPLE_REPRODUCED")
          PY

      - name: Apply candidate repair to disposable checkout
        shell: bash
        run: |
          set -euo pipefail
          git apply --check workpackages/candidate_patches/F2-WP-1207-issue451-rollback-state-binding.patch
          git apply workpackages/candidate_patches/F2-WP-1207-issue451-rollback-state-binding.patch

      - name: Run canonical WP1207 transaction regressions with candidate repair
        env:
          PYTHONPATH: src
        run: python tests/test_portable_release_transaction.py -v

      - name: Verify wrong rollback state is rejected after candidate repair
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from frankenstein2.portable_release_transaction import (
              LINEAGE_SCHEMA,
              RELEASE_SCHEMA,
              REQUEST_SCHEMA,
              PortableReleaseTransactionError,
              ReleaseIdentity,
              build_transaction_plan,
              record_attempt,
          )

          A = "a" * 64
          B = "b" * 64
          C = "c" * 64
          D = "d" * 64
          E = "e" * 64
          F = "f" * 64

          def release(release_id, version, artifact, manifest):
              return {
                  "schema": RELEASE_SCHEMA,
                  "release_id": release_id,
                  "version": version,
                  "artifact_sha256": artifact,
                  "manifest_sha256": manifest,
              }

          r1 = release("frankenstein-2.0-r1", "2.0.0-r1", A, B)
          r2 = release("frankenstein-2.0-r2", "2.0.0-r2", C, D)
          r1_digest = ReleaseIdentity.from_mapping(r1).digest()
          r2_digest = ReleaseIdentity.from_mapping(r2).digest()
          plan = build_transaction_plan({
              "schema": REQUEST_SCHEMA,
              "attempt_id": "wp1207-issue451-post-fix",
              "operation": "ROLLBACK",
              "target_release": r1,
              "current_lineage": {
                  "schema": LINEAGE_SCHEMA,
                  "generation": 7,
                  "state_sha256": E,
                  "active_release_digest": r2_digest,
                  "predecessor_generation": 6,
                  "predecessor_state_sha256": F,
                  "predecessor_release_digest": r1_digest,
              },
              "expected_generation": 7,
              "expected_state_sha256": E,
              "rollback_release": r1,
              "injected_failure_stage": None,
          })

          good = record_attempt(
              plan,
              outcome="SUCCEEDED",
              observed_generation=8,
              observed_state_sha256=F,
          )
          assert good.observed_state_sha256 == F

          try:
              record_attempt(
                  plan,
                  outcome="SUCCEEDED",
                  observed_generation=8,
                  observed_state_sha256=A,
              )
          except PortableReleaseTransactionError as exc:
              assert "exact predecessor state digest" in str(exc)
          else:
              raise AssertionError("wrong rollback state digest was still accepted")

          print("ISSUE451_CANDIDATE_REPAIR_DISCRIMINATOR_PASS")
          PY
