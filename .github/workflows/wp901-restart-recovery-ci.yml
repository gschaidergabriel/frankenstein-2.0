name: WP901 restart recovery continuation CI

on:
  pull_request:
    paths:
      - 'src/frankenstein2/restart_recovery_continuation.py'
      - 'tests/test_restart_recovery_continuation.py'
      - 'tests/falsifier_wp901_plan_semantic_consistency.py'
      - '.github/workflows/wp901-restart-recovery-ci.yml'
      - 'workpackages/active/F2-WP-901.json'
  push:
    branches:
      - main
    paths:
      - 'src/frankenstein2/restart_recovery_continuation.py'
      - 'tests/test_restart_recovery_continuation.py'
      - 'tests/falsifier_wp901_plan_semantic_consistency.py'
      - '.github/workflows/wp901-restart-recovery-ci.yml'
      - 'workpackages/active/F2-WP-901.json'
      - 'workpackages/reconciliations/F2-WP-901/**'
      - 'workpackages/receipts/F2-WP-901*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-recovery-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact workflow ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Compile WP901 source and regressions
        run: >-
          python -m py_compile
          src/frankenstein2/restart_recovery_continuation.py
          tests/test_restart_recovery_continuation.py
          tests/falsifier_wp901_plan_semantic_consistency.py
      - name: Run WP901 fail-closed suite and semantic consistency regressions
        env:
          PYTHONPATH: src
        run: >-
          python -m unittest -v
          tests.test_restart_recovery_continuation
          tests.falsifier_wp901_plan_semantic_consistency
