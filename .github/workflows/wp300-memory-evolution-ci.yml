name: F2 WP300 Memory Evolution CI

on:
  push:
    branches:
      - main
      - chatgpt/trigger4-wp300-memory-evolution-20260829
    paths:
      - 'src/frankenstein2/memory_lifecycle.py'
      - 'tests/test_memory_lifecycle.py'
      - '.github/workflows/wp300-memory-evolution-ci.yml'
  pull_request:
    paths:
      - 'src/frankenstein2/memory_lifecycle.py'
      - 'tests/test_memory_lifecycle.py'
      - '.github/workflows/wp300-memory-evolution-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile src/frankenstein2/memory_lifecycle.py tests/test_memory_lifecycle.py
      - name: Memory evolution falsification suite
        env:
          PYTHONPATH: src
        run: python tests/test_memory_lifecycle.py -v
