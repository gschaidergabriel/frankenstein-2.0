name: Review WP402 G2 Exact Type Falsifier

on:
  push:
    branches:
      - chatgpt/review-wp402-g2-exact-type-falsifier-20260829
    paths:
      - 'src/frankenstein2/qubo_projection.py'
      - 'src/frankenstein2/sparse_world_basis.py'
      - 'tests/test_wp402_g2_exact_type_falsifier.py'
      - '.github/workflows/review-wp402-g2-exact-type-falsifier-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-falsifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile exact G2 source and falsifier
        run: python -m py_compile src/frankenstein2/sparse_world_basis.py src/frankenstein2/qubo_projection.py tests/test_wp402_g2_exact_type_falsifier.py
      - name: Run exact-type build-and-score falsifier
        env:
          PYTHONPATH: src
        run: python tests/test_wp402_g2_exact_type_falsifier.py -v
