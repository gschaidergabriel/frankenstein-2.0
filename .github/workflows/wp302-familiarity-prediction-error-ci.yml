name: WP302 Familiarity Prediction Error CI

on:
  pull_request:
    paths:
      - "src/frankenstein2/familiarity_prediction_error.py"
      - "src/frankenstein2/prediction_contract.py"
      - "tests/test_familiarity_prediction_error.py"
      - ".github/workflows/wp302-familiarity-prediction-error-ci.yml"
  push:
    branches:
      - main
      - "chatgpt/trigger4-wp302-familiarity-prediction-error-20260829"
      - "review/wp302-orphan-recovery-pytest-20260829"
    paths:
      - "src/frankenstein2/familiarity_prediction_error.py"
      - "src/frankenstein2/prediction_contract.py"
      - "tests/test_familiarity_prediction_error.py"
      - ".github/workflows/wp302-familiarity-prediction-error-ci.yml"

permissions:
  contents: read

jobs:
  deterministic-component:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run WP302 deterministic falsification suite
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_familiarity_prediction_error.py
