name: Review WP508 G2 inherited G1 lineage falsifier

on:
  push:
    branches:
      - review/wp508-g2-inherited-g1-lineage-20260829-1530
    paths:
      - 'tests/review/test_wp508_g2_inherited_g1_lineage_falsifier.py'
      - '.github/workflows/review-wp508-g2-inherited-g1-lineage.yml'
  pull_request:
    paths:
      - 'tests/review/test_wp508_g2_inherited_g1_lineage_falsifier.py'
      - '.github/workflows/review-wp508-g2-inherited-g1-lineage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detached-wp506-lineage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: G2 must reject detached WP506 builder lineage
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/review/test_wp508_g2_inherited_g1_lineage_falsifier.py::test_g2_must_reject_wp508_witness_with_detached_wp506_builder_lineage

  missing-broadcast-payload-lineage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: G2 must reject reentry without broadcast payload reference
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/review/test_wp508_g2_inherited_g1_lineage_falsifier.py::test_g2_must_reject_wp508_witness_without_broadcast_payload_reentry
