name: Review WP508 G2 inherited G1 lineage falsifier

on:
  push:
    branches:
      - review/wp508-g2-inherited-g1-lineage-20260829-1530
    paths:
      - 'tests/review/test_wp508_g2_inherited_g1_lineage_falsifier.py'
      - '.github/workflows/review-wp508-g2-inherited-g1-lineage.yml'
  pull_request:
    paths:
      - 'tests/review/test_wp508_g2_inherited_g1_lineage_falsifier.py'
      - '.github/workflows/review-wp508-g2-inherited-g1-lineage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  falsifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile review discriminator
        run: python -m py_compile tests/review/test_wp508_g2_inherited_g1_lineage_falsifier.py
      - name: Require G2 to reject inherited invalid G1 lineage
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/review/test_wp508_g2_inherited_g1_lineage_falsifier.py
