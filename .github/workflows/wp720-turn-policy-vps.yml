name: WP720 Turn Policy Exact-Subject VPS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wp720-turn-policy-vps.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-policy-sandbox:
    runs-on: clay-host
    timeout-minutes: 20
    env:
      WP720_ACCEPTED_SUBJECT: 731db925df96ab7e49c0e5b80cd7bc8f4d37a086
      F2_SANDBOX_ROOT: /var/tmp/frankenstein2-sandboxes
      F2_SANDBOX_MIN_FREE_KIB: '5242880'
      F2_SANDBOX_MIN_MEM_KIB: '1048576'
    steps:
      - name: Checkout exact accepted WP720 subject
        uses: actions/checkout@v4
        with:
          ref: 731db925df96ab7e49c0e5b80cd7bc8f4d37a086
          persist-credentials: false

      - name: Verify runner and exact subject identity
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '%s\n' \
            "RUNNER_NAME=${RUNNER_NAME:-UNKNOWN}" \
            "RUNNER_OS=${RUNNER_OS:-UNKNOWN}" \
            "RUNNER_ARCH=${RUNNER_ARCH:-UNKNOWN}" \
            "CONTROLLER_SHA=$GITHUB_SHA" \
            "SOURCE_SHA=$(git rev-parse HEAD)" \
            "GITHUB_RUN_ID=$GITHUB_RUN_ID" \
            "GITHUB_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
          test "${RUNNER_NAME:-}" = "vps-clay-host"
          test "${RUNNER_OS:-}" = "Linux"
          test "$(git rev-parse HEAD)" = "$WP720_ACCEPTED_SUBJECT"
          test "$(sha256sum src/frankenstein2/voice_packet_cortex.py | cut -d' ' -f1)" = "eaca762b470dfbf6c19caeee603fc905d664baea4809e8d719212b9b44451bca"
          test "$(sha256sum src/frankenstein2/voice_packet_turn_policy.py | cut -d' ' -f1)" = "31067d9869c50d840594017390c5dbfc54d7c841e45991c158ee595e00968206"
          test "$(sha256sum tests/test_voice_packet_cortex.py | cut -d' ' -f1)" = "9689cddd71f71f49fc1e98ade1731864be42197ce77e7b8d707cc522724768cb"
          test "$(sha256sum tests/test_voice_packet_turn_policy.py | cut -d' ' -f1)" = "707bacbe54e989c2e45b212ab8971be1046e5178677a6fb0f946eb9c487a34e5"

      - name: Host-health and isolation preflight
        shell: bash
        run: bash tools/vps_sandbox/preflight.sh | tee /tmp/wp720-preflight.txt

      - name: Execute exact policy subject in lowest safe faithful Ubuntu sandbox
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tools/vps_sandbox/run_ubuntu_sandbox.sh --backend auto --network off -- \
            /bin/bash -lc '
              set -u
              PYTHONPATH=src python3 -m unittest discover -s tests -p "test_voice_packet_turn_policy.py" -v > /tmp/wp720-policy-tests.log 2>&1
              policy_status=$?
              PYTHONPATH=src python3 -m unittest discover -s tests -p "test_voice_packet_cortex.py" -v > /tmp/wp720-cortex-tests.log 2>&1
              cortex_status=$?
              cat /tmp/wp720-policy-tests.log
              cat /tmp/wp720-cortex-tests.log
              printf "POLICY_TESTS_EXIT=%s\n" "$policy_status"
              printf "CORTEX_TESTS_EXIT=%s\n" "$cortex_status"
              exit 0
            ' | tee /tmp/wp720-sandbox.txt

      - name: Emit exact bounded runtime receipt
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import subprocess

          expected_subject = os.environ['WP720_ACCEPTED_SUBJECT']
          expected_hashes = {
              'src/frankenstein2/voice_packet_cortex.py': 'eaca762b470dfbf6c19caeee603fc905d664baea4809e8d719212b9b44451bca',
              'src/frankenstein2/voice_packet_turn_policy.py': '31067d9869c50d840594017390c5dbfc54d7c841e45991c158ee595e00968206',
              'tests/test_voice_packet_cortex.py': '9689cddd71f71f49fc1e98ade1731864be42197ce77e7b8d707cc522724768cb',
              'tests/test_voice_packet_turn_policy.py': '707bacbe54e989c2e45b212ab8971be1046e5178677a6fb0f946eb9c487a34e5',
          }

          def file_hash(path):
              p = pathlib.Path(path)
              if not p.exists():
                  return None
              return hashlib.sha256(p.read_bytes()).hexdigest()

          def parse_status(text, name):
              match = re.search(rf'^{re.escape(name)}=(\d+)$', text, re.MULTILINE)
              return int(match.group(1)) if match else None

          try:
              source_sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          except Exception:
              source_sha = None
          actual_hashes = {path: file_hash(path) for path in expected_hashes}
          hashes_match = actual_hashes == expected_hashes
          sandbox = pathlib.Path('/tmp/wp720-sandbox.txt').read_text(errors='replace') if pathlib.Path('/tmp/wp720-sandbox.txt').exists() else ''
          preflight = pathlib.Path('/tmp/wp720-preflight.txt').read_text(errors='replace') if pathlib.Path('/tmp/wp720-preflight.txt').exists() else ''
          statuses = {
              'policy_tests': parse_status(sandbox, 'POLICY_TESTS_EXIT'),
              'cortex_tests': parse_status(sandbox, 'CORTEX_TESTS_EXIT'),
          }
          runner_valid = os.environ.get('RUNNER_NAME') == 'vps-clay-host' and os.environ.get('RUNNER_OS') == 'Linux'
          sandbox_executed = 'F2_SANDBOX_RESULT=PASS' in sandbox
          subject_valid = source_sha == expected_subject and hashes_match

          if not runner_valid:
              result = 'INFRA_AUTH_TRANSPORT_QUOTA'
              failure_class = 'INFRA_AUTH_TRANSPORT_QUOTA'
          elif not subject_valid:
              result = 'EVIDENCE_INVALID'
              failure_class = 'EVIDENCE_INVALID'
          elif not sandbox_executed or any(value is None for value in statuses.values()):
              result = 'INFRA_AUTH_TRANSPORT_QUOTA'
              failure_class = 'INFRA_AUTH_TRANSPORT_QUOTA'
          elif any(value != 0 for value in statuses.values()):
              result = 'EXECUTED_PRODUCT_NEGATIVE'
              failure_class = 'PRODUCT_NEGATIVE'
          else:
              result = 'EXECUTED_NO_COUNTEREXAMPLE'
              failure_class = None

          promoted = int(result == 'EXECUTED_NO_COUNTEREXAMPLE')
          receipt = {
              'schema': 'F2_WP720_TURN_POLICY_VPS_RECEIPT/v1',
              'workpackage_id': 'F2-WP-720',
              'generation': 1,
              'claim_id': 'F2-WP-720-G1-GPT56SOL-PFD-TURN-POLICY-BINDING-20260902',
              'result': result,
              'failure_class': failure_class,
              'repository_ci_subject_sha': expected_subject,
              'repository_ci_run_id': 33536164254,
              'repository_ci_job_id': 99950875033,
              'source_sha': source_sha,
              'controller_sha': os.environ.get('GITHUB_SHA'),
              'workflow_run_id': int(os.environ.get('GITHUB_RUN_ID', '0')),
              'workflow_run_attempt': int(os.environ.get('GITHUB_RUN_ATTEMPT', '0')),
              'runner_name': os.environ.get('RUNNER_NAME', 'UNKNOWN'),
              'runner_os': os.environ.get('RUNNER_OS', 'UNKNOWN'),
              'runner_arch': os.environ.get('RUNNER_ARCH', 'UNKNOWN'),
              'execution_surface': 'OWNER_VPS_DISPOSABLE_UBUNTU_SANDBOX',
              'sandbox_tier': 'S1_OR_S2_AUTO',
              'network_mode': 'OFF',
              'expected_hashes': expected_hashes,
              'actual_hashes': actual_hashes,
              'step_statuses': statuses,
              'preflight_log': preflight,
              'sandbox_log': sandbox,
              'runtime_execution_observed': bool(sandbox_executed and all(value is not None for value in statuses.values())),
              'repository_component_ci_credit': 1,
              'target_environment_component_runtime_credit': promoted,
              'physical_audio_credit': 0,
              'asr_runtime_credit': 0,
              'tts_runtime_credit': 0,
              'gwt_runtime_credit': 0,
              'semantic_gwt_runtime_credit': 0,
              'jspace_runtime_credit': 0,
              'effect_credit': 0,
              'training_credit': 0,
              'completion_credit': 0,
              'whole_voice_e2e_credit': 0,
              'whole_system_acceptance': False,
          }
          pathlib.Path('/tmp/wp720-runtime-receipt.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print(json.dumps(receipt, sort_keys=True))
          PY

      - name: Upload bounded runtime receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp720-turn-policy-vps-${{ github.run_id }}
          path: /tmp/wp720-runtime-receipt.json
          if-no-files-found: error

      - name: Enforce bounded runtime discriminator result
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('/tmp/wp720-runtime-receipt.json')
          if not path.exists():
              raise SystemExit('WP720_RUNTIME_RECEIPT_MISSING')
          receipt = json.loads(path.read_text())
          if receipt.get('result') != 'EXECUTED_NO_COUNTEREXAMPLE':
              raise SystemExit(f"WP720_RUNTIME_DISCRIMINATOR_NOT_PASS:{receipt.get('result')}:{receipt.get('failure_class')}")
          print('WP720_BOUNDED_TARGET_COMPONENT_RUNTIME_PASS')
          PY
