name: Review WP506 Hyperposition Frame Version Falsifier

# REVIEW_ONLY. A failing falsifier is bounded repository-component negative evidence,
# not runtime, physical GRID10, GWT uptake, effect, training, completion, or whole-system credit.
on:
  push:
    branches:
      - review/wp506-hyperposition-frame-version-falsifier-20260829
    paths:
      - 'tests/test_wp506_hyperposition_frame_version_falsifier.py'
      - '.github/workflows/wp506-hyperposition-frame-version-falsifier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  falsifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile review test
        run: python -m py_compile tests/test_wp506_hyperposition_frame_version_falsifier.py
      - name: Execute same-id stale-frame-version discriminator
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_wp506_hyperposition_frame_version_falsifier.py
