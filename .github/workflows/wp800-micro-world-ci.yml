name: F2 WP800 Held-Out Micro World CI

on:
  push:
    branches:
      - main
      - trigger4/wp800-heldout-microworld-20260829
    paths:
      - 'src/frankenstein2/micro_world.py'
      - 'tests/test_micro_world.py'
      - '.github/workflows/wp800-micro-world-ci.yml'
  pull_request:
    paths:
      - 'src/frankenstein2/micro_world.py'
      - 'tests/test_micro_world.py'
      - '.github/workflows/wp800-micro-world-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile src/frankenstein2/micro_world.py tests/test_micro_world.py
      - name: WP800 deterministic falsification suite
        env:
          PYTHONPATH: src
        run: python tests/test_micro_world.py -v
