name: F2 WP403 Rudimentary Physics Projection CI

on:
  push:
    branches:
      - main
      - trigger4/wp403-rudimentary-physics-20260829
    paths:
      - 'src/frankenstein2/physics_projection.py'
      - 'src/frankenstein2/sparse_world_basis.py'
      - 'tests/test_physics_projection.py'
      - '.github/workflows/wp403-physics-projection-ci.yml'
  pull_request:
    paths:
      - 'src/frankenstein2/physics_projection.py'
      - 'src/frankenstein2/sparse_world_basis.py'
      - 'tests/test_physics_projection.py'
      - 'tests/test_wp403_subclass_forgery_falsifier.py'
      - '.github/workflows/wp403-physics-projection-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  falsification:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile exact WP403 source and tests
        run: python -m py_compile src/frankenstein2/sparse_world_basis.py src/frankenstein2/physics_projection.py tests/test_physics_projection.py tests/test_wp403_subclass_forgery_falsifier.py
      - name: Existing WP403 generation-2 regression suite
        env:
          PYTHONPATH: src
        run: python tests/test_physics_projection.py -v
      - name: Candidate falsifier - exact projection subtype boundary
        env:
          PYTHONPATH: src
        run: python tests/test_wp403_subclass_forgery_falsifier.py -v
