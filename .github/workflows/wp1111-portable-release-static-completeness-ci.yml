name: WP1111 portable release static completeness

on:
  push:
    paths:
      - 'AI_START_HERE_DO_NOT_SCAN_REPO/02_RELEASE_CONTRACT.json'
      - 'src/frankenstein2/portable_release_static_completeness.py'
      - 'tests/test_portable_release_static_completeness.py'
      - '.github/workflows/wp1111-portable-release-static-completeness-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  component:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile owned source and test
        run: |
          python -m py_compile src/frankenstein2/portable_release_static_completeness.py tests/test_portable_release_static_completeness.py
      - name: Run fail-closed component suite
        env:
          PYTHONPATH: src
        run: |
          python -m unittest -v tests.test_portable_release_static_completeness
      - name: Verify Windows junction fails closed
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'wp1111-junction'
          Remove-Item -Recurse -Force $root -ErrorAction SilentlyContinue
          $real = Join-Path $root 'real'
          $junction = Join-Path $root 'junction'
          New-Item -ItemType Directory -Path $real -Force | Out-Null
          Set-Content -Path (Join-Path $real 'evidence.txt') -Value 'evidence'
          New-Item -ItemType Junction -Path $junction -Target $real | Out-Null
          $env:WP1111_ROOT = $root
          $env:PYTHONPATH = 'src'
          python -c "import os; from pathlib import Path; from frankenstein2.portable_release_static_completeness import _safe_file; root=Path(os.environ['WP1111_ROOT']); violations=[]; assert (root/'junction').is_junction(); assert _safe_file(root, 'junction/evidence.txt', 'junction_ref', violations) is None; assert 'junction_ref:symlink_component' in violations, violations"
