name: F2 WP1103 Codex CLI Route CI

on:
  push:
    branches:
      - main
      - trigger4/wp1103-codex-cli-route-20260829
    paths:
      - 'src/frankenstein2/codex_cli_route.py'
      - 'tests/test_codex_cli_route.py'
      - '.github/workflows/wp1103-codex-cli-route-ci.yml'
  pull_request:
    paths:
      - 'src/frankenstein2/codex_cli_route.py'
      - 'tests/test_codex_cli_route.py'
      - '.github/workflows/wp1103-codex-cli-route-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: >-
          python -m py_compile
          src/frankenstein2/codex_cli_route.py
          tests/test_codex_cli_route.py
      - name: Codex route fail-closed suite
        env:
          PYTHONPATH: src
        run: python tests/test_codex_cli_route.py -v
